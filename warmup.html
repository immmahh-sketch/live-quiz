<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1544">
<title>Earn points before the quiz begins! · Let's Quiz!</title>
<meta name="description" content="A warm-up game on your phone before quiz night: earn bonus points for the quiz.">
<meta property="og:title" content="Earn points before the quiz begins!">
<meta property="og:description" content="Questions and games on your phone. Finish it for bonus points on quiz night; the top score gets even more.">
<meta property="og:image" content="https://letsquiz.uk/assets/brand/icon-1024.png">
<link rel="icon" type="image/png" sizes="64x64" href="assets/brand/icon-64.png">
<link rel="apple-touch-icon" href="assets/brand/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  /* The warm-up: first a landing screen (what it is, the prize, your name), then the game, all on the phone screen. */
  :root { --stage: #1b1544; --stage-2: #2a1f6e; --sun: #ffd54a; --ink: #1b1544; --brand: #5b3df5; }
  html, body { margin: 0; min-height: 100%; background: radial-gradient(1200px 700px at 50% -10%, var(--stage-2), var(--stage) 70%) fixed; color: #fff; font-family: Nunito, system-ui, sans-serif; }
  button, input { font: inherit; }
  /* ---- landing ---- */
  .land { max-width: 560px; margin: 0 auto; padding: calc(18px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 14px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 1.2rem; }
  .brand img { width: 40px; height: 40px; }
  h1 { margin: 4px 0 0; font-size: clamp(2rem, 8.5vw, 2.9rem); line-height: 1.02; font-weight: 900; text-wrap: balance; }
  .lead { margin: 0; font-weight: 700; font-size: 1.08rem; opacity: .92; }
  .prize { background: linear-gradient(135deg, #ffd54a, #ffb020); color: var(--ink); border-radius: 18px; padding: 14px 16px; font-weight: 900; font-size: 1.15rem; display: flex; gap: 12px; align-items: center; box-shadow: 0 10px 30px rgba(255,176,32,.25); }
  .prize .big { font-size: 2.2rem; line-height: 1; }
  .prize small { display: block; font-weight: 800; font-size: .9rem; opacity: .8; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: rgba(255,255,255,.1); border-radius: 999px; padding: 5px 11px; font-weight: 800; font-size: .88rem; }
  .card { background: #fff; color: var(--ink); border-radius: 20px; padding: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  .card h2 { margin: 0 0 10px; font-size: 1.15rem; }
  label { display: block; font-weight: 800; font-size: .9rem; margin: 10px 0 5px; color: #5d5a78; }
  input[type=text] { width: 100%; box-sizing: border-box; border: 2px solid #dcd9ee; border-radius: 12px; padding: 12px; font-size: 1.1rem; font-weight: 800; color: var(--ink); }
  input[type=text]:focus { outline: none; border-color: var(--brand); }
  .emopick { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
  .emopick button { border: 2px solid transparent; background: #f2f0fb; border-radius: 10px; font-size: 1.35rem; padding: 4px 0; cursor: pointer; }
  .emopick button.on { border-color: var(--brand); background: #e7e1ff; }
  .go { width: 100%; margin-top: 14px; border: 0; border-radius: 14px; padding: 15px; background: var(--brand); color: #fff; font-weight: 900; font-size: 1.25rem; cursor: pointer; box-shadow: 0 6px 0 #3f27c4; }
  .go:active { transform: translateY(3px); box-shadow: 0 3px 0 #3f27c4; }
  .go:disabled { opacity: .6; }
  .err { background: #ffe3e7; color: #a3122c; border-radius: 12px; padding: 10px 12px; font-weight: 800; margin-bottom: 8px; }
  .board { margin: 0; padding: 0; list-style: none; }
  .board li { display: flex; gap: 10px; align-items: center; padding: 7px 4px; border-bottom: 1px solid #eeecf6; font-weight: 800; }
  .board li:last-child { border-bottom: 0; }
  .board .n { width: 1.6em; text-align: center; color: #8a86a6; }
  .board .s { margin-left: auto; font-weight: 900; }
  .board { max-height: 55vh; overflow: auto; }
  .board li.me { background: #ffd54a; border-radius: 10px; }
  .board li:first-child .n { color: #c9930a; }
  .muted { color: #6f6b8c; font-weight: 700; }
  .small { font-size: .9rem; }
  .note { font-size: .85rem; opacity: .7; font-weight: 700; text-align: center; }
  .played { text-align: center; }
  .played .em { font-size: 3.4rem; }
  .played .score { font-size: 2.6rem; font-weight: 900; color: var(--sun); }
  a { color: inherit; }
  /* ---- the game: all on the phone screen ---- */
  /* The quiz itself runs in a hidden frame (it keeps the time, plays the bots and the sounds); what you see is your
     phone view, which shows each question, picture and answer, the scores between questions and the final table. */
  .game { position: fixed; inset: 0; display: flex; flex-direction: column; background: #f4f3fb; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .engine { position: fixed; left: -3000px; top: 0; width: 1024px; height: 576px; border: 0; }
  .playhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 12px; background: var(--stage); color: #fff; font-weight: 800; font-size: .85rem; }
  .playhead button { color: #fff; background: rgba(255,255,255,.14); border: 0; border-radius: 8px; padding: 4px 10px; cursor: pointer; font-weight: 800; }
  .playwrap { flex: 1 1 auto; min-height: 0; display: flex; justify-content: center; }
  .playwrap iframe { flex: 1 1 auto; width: 100%; max-width: 560px; border: 0; background: #f4f3fb; }
  .waiting { flex: 1 1 auto; display: grid; place-items: center; color: var(--ink); font-weight: 800; text-align: center; padding: 16px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/common.js"></script>
<script>
const { $, $$, esc, store, uid, ordinal } = LQ;
const app = $('#app');
const WEEK = +(new URLSearchParams(location.search).get('wk') || 0) || 0; // TEST codes only: try one week of a weekly series
const CODE = (new URLSearchParams(location.search).get('c') || new URLSearchParams(location.search).get('code') || 'WARMUP').toUpperCase().replace(/[^A-Z0-9]/g, '');
const me = () => { const p = store('lq_player') || {}; return { pid: /^p_[a-z0-9]{6,12}$/.test(p.pid || '') ? p.pid : '', name: p.name || '', emoji: LQ.EMOJIS.includes(p.emoji) ? p.emoji : '' }; };
const SAVE_KEY = 'lq_live_warmup';
const TEST = /^TEST[A-Z0-9]+$/.test(CODE); // TEST in front of the code: the host trying the warm-up, as often as you like, nothing saved
const brand = `<div class="brand"><img src="assets/brand/mark.png" alt="">Let's Quiz!</div>`;
// Everyone who has played, best first; equal scores share a place. `mine` is picked out (and scrolled to).
const boardHtml = (rows, mine) => { let hit = false; const place = (p) => rows.filter((x) => x.score > p.score).length + 1;
  return rows.length ? `<ol class="board" id="board">${rows.map((p) => { const me = !hit && mine && p.name === mine.name && p.score === mine.score; if (me) hit = true; const n = place(p); return `<li class="${me ? 'me' : ''}"><span class="n">${n === 1 ? '🥇' : n === 2 ? '🥈' : n === 3 ? '🥉' : n}</span><span>${esc(p.emoji || '')} ${esc(p.name)}${me ? ' <b>(you)</b>' : ''}</span><span class="s">${p.score}</span></li>`; }).join('')}</ol>` : '<p class="muted small" style="margin:0">No scores yet. Yours could be the first!</p>'; };
const scrollToMe = () => { const b = $('#board'), r = b?.querySelector('.me'); if (b && r) b.scrollTop = Math.max(0, r.offsetTop - b.offsetTop - b.clientHeight / 2); };

async function start() {
  // warmup?c=CODE&reset=1 throws away a game part-played on this phone and starts afresh (for the host testing it).
  // A finished go still counts: the server keeps one score per phone whatever this phone has saved.
  const qs = new URLSearchParams(location.search);
  if (qs.get('reset') === '1') { LQ.unstore(SAVE_KEY); qs.delete('reset'); history.replaceState(null, '', location.pathname + (qs.toString() ? '?' + qs : '')); }
  // A game already going on this device carries straight on (a reload, a dropped connection). Not a test game
  // (TESTWARMUP): that starts afresh every time and is saved apart, so it never touches a real one.
  const g = TEST ? null : store(SAVE_KEY);
  if (g?.warmup === CODE && g.phase && g.phase !== 'lobby' && g.phase !== 'final' && me().pid) return game();
  app.innerHTML = `<div class="land">${brand}<p class="muted" style="color:#fff;opacity:.7">Loading…</p></div>`;
  let r;
  try { r = await LQ.api('warmup_open', { code: CODE, pid: me().pid, peek: true, week: WEEK }, { timeout: 20000 }); }
  catch (e) { return landError(e.message); }
  if (r.played) return played(r);
  if (!r.open) return closed(r);
  intro(r);
}
function landError(msg) {
  app.innerHTML = `<div class="land">${brand}<h1>Warm-up</h1><div class="card"><div class="err">${esc(msg)}</div>
    <form id="cf"><label>Warm-up code</label><input type="text" id="cc" value="${esc(CODE)}" maxlength="12" autocapitalize="characters"><button class="go">Try again</button></form></div></div>`;
  $('#cf').onsubmit = (e) => { e.preventDefault(); location.href = 'warmup?c=' + encodeURIComponent($('#cc').value.trim()); };
}
// A game of its own (no quiz night it leads up to: r.standalone) is just for fun: no bonus, no Friday.
const solo = (r) => !!r.standalone;
const typeChips = (r) => (r.types || []).map((t) => LQ.TYPES[t]).filter(Boolean).map((T) => `<span class="chip">${T.icon} ${esc(T.label)}</span>`).join('');
function intro(r) {
  const m = me(); let emoji = m.emoji || LQ.EMOJIS[Math.floor(Math.random() * LQ.EMOJIS.length)];
  if (solo(r)) document.title = r.title + " · Let's Quiz!";
  app.innerHTML = `<div class="land">${brand}
    <h1>${esc(r.title)}</h1>
    ${solo(r) ? `<p class="lead">${r.questions || 'Ten'} questions and games on your phone, against ${r.bots === 3 || r.bots == null ? 'three' : r.bots} bots.</p>
    <div class="prize"><span class="big">🏆</span><span>Top the scoreboard<small>${r.replay ? 'Play as often as you like: your best score counts.' : 'One go per phone, so make it count!'}</small></span></div>
    ${r.best ? `<div class="chip" style="align-self:flex-start;background:#ffd54a;color:#1b1544">🔁 Your best so far: ${r.best.score} (${ordinal(r.best.place)} of ${r.count}) after ${r.best.goes} go${r.best.goes === 1 ? '' : 'es'}. Beat it!</div>` : ''}` : `<p class="lead">${r.questions ? r.questions : 'Twenty'} questions and games on your phone, against three bots, before quiz night.${(r.types || []).includes('about') ? ' Some are about YOU: watch out, your answers might come back on quiz night!' : ''}</p>
    <div class="prize"><span class="big">🏆</span><span>${r.bonus ? `Finish it for <u>${fmtPts(r.bonus.play)} bonus points</u> on quiz night, and the week's top score gets <u>${fmtPts(r.bonus.top)}</u>` : 'The top score starts the quiz <u>1,000 points</u> ahead'}<small>One go per phone, so make it count!</small></span></div>`}
    ${r.week && !solo(r) ? `<div class="chip" style="align-self:flex-start;background:#ffd54a;color:#1b1544">📅 Warm-up week ${r.week}${r.weeks ? ' of ' + r.weeks : ''}: a new one every Saturday at 5am, and the bonus points from every week add up</div>` : ''}
    ${r.test ? `<div class="chip" style="align-self:flex-start;background:#7ee0a8;color:#1b1544">🧪 Test game: nothing is saved and you can play as often as you like</div>` : ''}
    ${r.practice ? `<div class="chip" style="align-self:flex-start;background:#ffd54a;color:#1b1544">🧪 Practice go: your score of ${r.practice.score} stays on the scoreboard, whatever you get this time</div>` : ''}
    ${r.until ? `<div class="chip" style="align-self:flex-start;background:rgba(255,255,255,.16)">⏰ Closes ${esc(endsText(r.until))} · ${leftText(r.until)}</div>` : ''}
    ${solo(r) ? `<div class="chips">${typeChips(r)}</div>` : `<div class="chips"><span class="chip">💥 Wipeout</span><span class="chip">💣 Hot Potato</span><span class="chip">🏁 The Race</span><span class="chip">🕵️ 20 Questions</span><span class="chip">🎡 Wheel of Fortune</span><span class="chip">🧠 The 1% Club</span><span class="chip">🖼️ Picture Reveal</span><span class="chip">🔀 Answer Smash</span><span class="chip">📍 Drop the Pin</span>${(r.types || []).includes('task') ? '<span class="chip">📸 Taskmaster</span>' : ''}${(r.types || []).includes('about') ? '<span class="chip">🙋 About You</span>' : ''}<span class="chip">…and more</span></div>`}
    <div class="card"><h2>Who's playing?</h2>
      <form id="nf"><label for="nm">Your name (as it'll show on the scoreboard)</label><input type="text" id="nm" value="${esc(m.name)}" maxlength="20" autocomplete="nickname" placeholder="Your name">
      <label>Your emoji</label><div class="emopick">${LQ.EMOJIS.map((e) => `<button type="button" data-em="${e}" class="${e === emoji ? 'on' : ''}">${e}</button>`).join('')}</div>
      <div id="nerr"></div><button class="go">Let's play ▶</button></form>
      <p class="muted small" style="margin:10px 0 0">It all plays on your phone.${solo(r) ? '' : " Use the same name you'll use on Friday, so the bonus finds you."}</p></div>
    <div class="card"><h2>🏆 Top scores so far</h2>${boardHtml(r.top || [])}${r.count > 10 ? `<p class="muted small" style="margin:8px 0 0">${r.count} people have played.</p>` : ''}</div>
    <p class="note">Friends can join your game too: the code is on your screen once it starts.</p></div>`;
  $$('[data-em]').forEach((b) => b.onclick = () => { emoji = b.dataset.em; $$('[data-em]').forEach((x) => x.classList.toggle('on', x === b)); });
  $('#nf').onsubmit = (e) => {
    e.preventDefault();
    const name = $('#nm').value.replace(/\s+/g, ' ').trim();
    if (!name) { $('#nerr').innerHTML = '<div class="err" style="margin-top:10px">Tell us your name so it shows on the scoreboard.</div>'; $('#nm').focus(); return; }
    store('lq_player', { pid: me().pid || uid('p'), name, emoji });
    game();
  };
}
const fmtPts = (n) => Number(n || 0).toLocaleString('en-GB');
/** When it closes: "Friday 2 October at 5pm" (the day and time players need). */
const endsText = (iso) => new Date(iso).toLocaleString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', hour: 'numeric', minute: '2-digit', hour12: true }).replace(':00', '').replace(/ (am|pm)/, '$1').replace(' at ', ' at ');
const leftText = (iso) => { const ms = new Date(iso) - Date.now(); const h = Math.floor(ms / 3600e3); return h >= 48 ? Math.floor(h / 24) + ' days to go' : h >= 1 ? h + ' hour' + (h === 1 ? '' : 's') + ' to go' : Math.max(1, Math.ceil(ms / 60e3)) + ' minutes to go'; };
function closed(r) {
  const w = (r.top || [])[0];
  app.innerHTML = `<div class="land">${brand}<h1>${esc(r.title)}</h1>
    ${r.notYet ? `<div class="card played"><div class="em">⏳</div><h2 style="margin:4px 0 0">${r.week ? 'Week ' + r.week + ' of the warm-up' : 'The warm-up'} opens ${esc(endsText(r.opens))}</h2><p class="muted" style="margin:8px 0 0">Come back then for a fresh set of questions and games.</p></div>` : ''}
    ${!r.ended && !r.notYet ? `<div class="card played"><div class="em">⏸️</div><h2 style="margin:4px 0 0">${solo(r) ? 'This game is switched off for now' : 'The warm-up is switched off for now'}</h2><p class="muted" style="margin:8px 0 0">Check back soon!</p></div>` : ''}
    ${!r.ended ? '' : `<div class="card played"><div class="em">⏰</div><h2 style="margin:4px 0 0">${solo(r) ? 'This game has closed' : 'The warm-up has closed'}</h2>
      ${w ? `<p class="muted" style="margin:8px 0 0">Top of the table: <b>${esc(w.emoji || '')} ${esc(w.name)}</b> with ${w.score} points${solo(r) ? '.' : r.bonus ? `, who gets ${fmtPts(r.bonus.top)} bonus points on quiz night.` : ', who starts the quiz 1,000 points ahead.'}</p>` : `<p class="muted">${solo(r) ? 'Thanks for playing!' : 'See you at the quiz!'}</p>`}
      ${r.nextOpens ? `<p class="muted" style="margin:8px 0 0">⏳ The next warm-up opens <b>${esc(endsText(r.nextOpens))}</b>.</p>` : ''}</div>`}
    <div class="card"><h2>🏆 ${r.ended ? 'Final ' : ''}${solo(r) ? (r.ended ? 'scoreboard' : 'Scoreboard so far') : (r.ended ? 'warm-up scoreboard' : 'Warm-up scoreboard so far')}</h2>${boardHtml(r.board || r.top || [])}</div></div>`;
}
function played(r) {
  const p = r.played;
  app.innerHTML = `<div class="land">${brand}
    <div class="card played"><div class="em">${esc(p.emoji || '🎉')}</div><h2 style="margin:4px 0 0">You've had your go, ${esc(p.name)}!</h2>
      <div class="score">${p.score} points</div><p class="muted" style="margin:0">${ordinal(p.place)} of ${r.count} on the ${solo(r) ? '' : 'warm-up '}scoreboard${p.place === 1 ? ' · 🥇 top of the table!' : ''}</p>
      <p class="muted small" style="margin:10px 0 0">It's one go per phone.${solo(r) ? '' : r.bonus ? ` You've earned ${fmtPts(r.bonus.play)} bonus points for quiz night (use the same phone on the night and they're added for you). The top score${r.until ? ' when it closes on ' + esc(endsText(r.until)) : ''} gets ${fmtPts(r.bonus.top)} more.` : ` The top score${r.until ? ' when it closes on ' + esc(endsText(r.until)) : ''} gets 1,000 bonus points at the start of the quiz.`}</p></div>
    <div class="card"><h2>🏆 ${solo(r) ? 'Scoreboard' : 'Warm-up scoreboard'}${r.count ? ` · ${r.count} played` : ''}</h2>${boardHtml(r.board || r.top || [], p)}</div>
    <p class="note">Played on ${new Date(p.played_at).toLocaleString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', hour: 'numeric', minute: '2-digit' })}.</p></div>`;
  scrollToMe();
}

// ---------- the game: everything on the phone screen ----------
// The quiz runs in a hidden frame (host.html in warm-up mode: it keeps the clock, plays the bots and makes the sounds).
// You play in the phone view, which shows the whole of every question itself. There is no second screen to watch.
function game() {
  document.body.style.overflow = 'hidden';
  app.innerHTML = `<div class="game">
      <div class="playhead"><span id="who">🎮 Let's play</span><span><button id="fs" type="button" title="Full screen">⛶</button></span></div>
      <div class="playwrap"><div class="waiting" id="waiting">Setting up your game…</div><iframe id="playFrame" title="Your game" hidden></iframe></div>
    </div>
    <iframe class="engine" id="hostFrame" title="" aria-hidden="true" tabindex="-1" allow="autoplay"></iframe>`;
  const hostFrame = $('#hostFrame');
  hostFrame.src = 'host?quiz=warmup&w=' + encodeURIComponent(CODE) + (WEEK ? '&wk=' + WEEK : '') + '&x=' + Date.now().toString(36);
  // Sound comes from the hidden quiz frame, and phones only let it play after a tap: any tap in the game switches it on.
  const soundOn = () => { try { hostFrame.contentWindow.eval("sfx = sfx || new (window.AudioContext || window.webkitAudioContext)(); if (sfx.state === 'suspended') sfx.resume();"); } catch {} };
  document.addEventListener('pointerdown', soundOn);
  // Once the quiz has its game code, join it as a player (friends can join with the same code at letsquiz.uk/play).
  const wait = setInterval(() => {
    let code = null; try { code = hostFrame.contentWindow.eval('typeof G !== "undefined" && G ? G.code : null'); } catch {}
    if (!code) return;
    clearInterval(wait);
    const pf = $('#playFrame');
    pf.src = 'play?g=' + encodeURIComponent(code) + '&solo=1';
    pf.hidden = false; $('#waiting')?.remove();
    $('#who').textContent = '🎮 Friends join at letsquiz.uk/play · ' + code;
    pf.addEventListener('load', () => { try { pf.contentDocument.addEventListener('pointerdown', soundOn); } catch {} });
  }, 300);
  $('#fs').onclick = () => { const d = document.documentElement; if (document.fullscreenElement) document.exitFullscreen?.(); else d.requestFullscreen?.().catch(() => {}); };
}
start();
</script>
</body>
</html>
