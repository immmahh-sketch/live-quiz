<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1544">
<title>Earn points before the quiz begins! · Let's Quiz!</title>
<meta name="description" content="A warm-up game on your phone before quiz night. The top score gets 1,000 bonus points in the quiz.">
<meta property="og:title" content="Earn points before the quiz begins!">
<meta property="og:description" content="Twenty questions and games on your phone. The top score starts the quiz 1,000 points ahead.">
<meta property="og:image" content="https://letsquiz.uk/assets/brand/icon-1024.png">
<link rel="icon" type="image/png" sizes="64x64" href="assets/brand/icon-64.png">
<link rel="apple-touch-icon" href="assets/brand/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  /* The warm-up: first a landing screen (what it is, the prize, your name), then the game on one screen:
     the host screen (drawn at a TV-like 1024×576 and scaled to fit) with you as a player beside it. */
  :root { --stage: #1b1544; --stage-2: #2a1f6e; --sun: #ffd54a; --ink: #1b1544; --brand: #5b3df5; }
  html, body { margin: 0; min-height: 100%; background: radial-gradient(1200px 700px at 50% -10%, var(--stage-2), var(--stage) 70%) fixed; color: #fff; font-family: Nunito, system-ui, sans-serif; }
  button, input { font: inherit; }
  /* ---- landing ---- */
  .land { max-width: 560px; margin: 0 auto; padding: calc(18px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 14px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 1.2rem; }
  .brand img { width: 40px; height: 40px; }
  h1 { margin: 4px 0 0; font-size: clamp(2rem, 8.5vw, 2.9rem); line-height: 1.02; font-weight: 900; text-wrap: balance; }
  .lead { margin: 0; font-weight: 700; font-size: 1.08rem; opacity: .92; }
  .prize { background: linear-gradient(135deg, #ffd54a, #ffb020); color: var(--ink); border-radius: 18px; padding: 14px 16px; font-weight: 900; font-size: 1.15rem; display: flex; gap: 12px; align-items: center; box-shadow: 0 10px 30px rgba(255,176,32,.25); }
  .prize .big { font-size: 2.2rem; line-height: 1; }
  .prize small { display: block; font-weight: 800; font-size: .9rem; opacity: .8; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: rgba(255,255,255,.1); border-radius: 999px; padding: 5px 11px; font-weight: 800; font-size: .88rem; }
  .card { background: #fff; color: var(--ink); border-radius: 20px; padding: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  .card h2 { margin: 0 0 10px; font-size: 1.15rem; }
  label { display: block; font-weight: 800; font-size: .9rem; margin: 10px 0 5px; color: #5d5a78; }
  input[type=text] { width: 100%; box-sizing: border-box; border: 2px solid #dcd9ee; border-radius: 12px; padding: 12px; font-size: 1.1rem; font-weight: 800; color: var(--ink); }
  input[type=text]:focus { outline: none; border-color: var(--brand); }
  .emopick { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
  .emopick button { border: 2px solid transparent; background: #f2f0fb; border-radius: 10px; font-size: 1.35rem; padding: 4px 0; cursor: pointer; }
  .emopick button.on { border-color: var(--brand); background: #e7e1ff; }
  .go { width: 100%; margin-top: 14px; border: 0; border-radius: 14px; padding: 15px; background: var(--brand); color: #fff; font-weight: 900; font-size: 1.25rem; cursor: pointer; box-shadow: 0 6px 0 #3f27c4; }
  .go:active { transform: translateY(3px); box-shadow: 0 3px 0 #3f27c4; }
  .go:disabled { opacity: .6; }
  .err { background: #ffe3e7; color: #a3122c; border-radius: 12px; padding: 10px 12px; font-weight: 800; margin-bottom: 8px; }
  .board { margin: 0; padding: 0; list-style: none; }
  .board li { display: flex; gap: 10px; align-items: center; padding: 7px 4px; border-bottom: 1px solid #eeecf6; font-weight: 800; }
  .board li:last-child { border-bottom: 0; }
  .board .n { width: 1.6em; text-align: center; color: #8a86a6; }
  .board .s { margin-left: auto; font-weight: 900; }
  .board li.me { background: #fff7d6; border-radius: 10px; }
  .board li:first-child .n { color: #c9930a; }
  .muted { color: #6f6b8c; font-weight: 700; }
  .small { font-size: .9rem; }
  .note { font-size: .85rem; opacity: .7; font-weight: 700; text-align: center; }
  .played { text-align: center; }
  .played .em { font-size: 3.4rem; }
  .played .score { font-size: 2.6rem; font-weight: 900; color: var(--sun); }
  a { color: inherit; }
  /* ---- the game ---- */
  .game { position: fixed; inset: 0; display: flex; background: var(--stage); padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .hostside { position: relative; flex: 1 1 auto; min-width: 0; }
  .hostbox { position: absolute; overflow: hidden; border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.4); }
  .hostbox iframe { position: absolute; left: 0; top: 0; width: 1024px; height: 576px; border: 0; transform-origin: 0 0; background: var(--stage); }
  .playside { flex: 0 0 clamp(260px, 36vw, 420px); display: flex; flex-direction: column; border-left: 3px solid var(--sun); background: #f4f3fb; }
  .playhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 10px; background: var(--stage); font-weight: 800; font-size: .85rem; }
  .playhead button { color: #fff; background: rgba(255,255,255,.14); border: 0; border-radius: 8px; padding: 4px 10px; cursor: pointer; }
  .playside iframe { flex: 1 1 auto; width: 100%; border: 0; background: #f4f3fb; }
  .waiting { flex: 1 1 auto; display: grid; place-items: center; color: var(--ink); font-weight: 800; text-align: center; padding: 16px; }
  /* A big screen (a laptop, a tablet held sideways) gets a roomier player side. */
  @media (min-width: 1100px) and (min-height: 700px) { .playside { flex-basis: 400px; } }
  /* Upright phone: ask for sideways. */
  .turn { position: fixed; inset: 0; z-index: 10; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px; background: var(--stage); }
  .turn .ph { font-size: 4.5rem; animation: tilt 2.2s ease-in-out infinite; }
  .turn h1 { font-size: 1.6rem; } .turn p { margin: 0; opacity: .8; font-weight: 600; max-width: 22em; }
  @keyframes tilt { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  @media (orientation: portrait) and (max-width: 820px) { .game + .turn { display: flex; } }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/common.js"></script>
<script>
const { $, $$, esc, store, uid, ordinal } = LQ;
const app = $('#app');
const CODE = (new URLSearchParams(location.search).get('c') || new URLSearchParams(location.search).get('code') || 'WARMUP').toUpperCase().replace(/[^A-Z0-9]/g, '');
const me = () => { const p = store('lq_player') || {}; return { pid: /^p_[a-z0-9]{6,12}$/.test(p.pid || '') ? p.pid : '', name: p.name || '', emoji: LQ.EMOJIS.includes(p.emoji) ? p.emoji : '' }; };
const SAVE_KEY = 'lq_live_warmup';
const brand = `<div class="brand"><img src="assets/brand/mark.png" alt="">Let's Quiz!</div>`;
const boardHtml = (top, mine) => top.length ? `<ol class="board">${top.map((p, i) => `<li class="${mine && p.name === mine.name && p.score === mine.score ? 'me' : ''}"><span class="n">${i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : i + 1}</span><span>${esc(p.emoji || '')} ${esc(p.name)}</span><span class="s">${p.score}</span></li>`).join('')}</ol>` : '<p class="muted small" style="margin:0">No scores yet. Yours could be the first!</p>';

async function start() {
  // A game already going on this device carries straight on (a reload, a dropped connection).
  const g = store(SAVE_KEY);
  if (g?.warmup === CODE && g.phase && g.phase !== 'lobby' && g.phase !== 'final' && me().pid) return game();
  app.innerHTML = `<div class="land">${brand}<p class="muted" style="color:#fff;opacity:.7">Loading…</p></div>`;
  let r;
  try { r = await LQ.api('warmup_open', { code: CODE, pid: me().pid, peek: true }, { timeout: 20000 }); }
  catch (e) { return landError(e.message); }
  if (r.played) return played(r);
  if (!r.open) return closed(r);
  intro(r);
}
function landError(msg) {
  app.innerHTML = `<div class="land">${brand}<h1>Warm-up</h1><div class="card"><div class="err">${esc(msg)}</div>
    <form id="cf"><label>Warm-up code</label><input type="text" id="cc" value="${esc(CODE)}" maxlength="12" autocapitalize="characters"><button class="go">Try again</button></form></div></div>`;
  $('#cf').onsubmit = (e) => { e.preventDefault(); location.href = 'warmup?c=' + encodeURIComponent($('#cc').value.trim()); };
}
function intro(r) {
  const m = me(); let emoji = m.emoji || LQ.EMOJIS[Math.floor(Math.random() * LQ.EMOJIS.length)];
  app.innerHTML = `<div class="land">${brand}
    <h1>${esc(r.title)}</h1>
    <p class="lead">Twenty questions and games on your phone, against three bots, before quiz night.</p>
    <div class="prize"><span class="big">🏆</span><span>The top score starts the quiz <u>1,000 points</u> ahead<small>One go per phone, so make it count!</small></span></div>
    ${r.until ? `<div class="chip" style="align-self:flex-start;background:rgba(255,255,255,.16)">⏰ Closes ${esc(endsText(r.until))} · ${leftText(r.until)}</div>` : ''}
    <div class="chips"><span class="chip">💥 Wipeout</span><span class="chip">💣 Hot Potato</span><span class="chip">🏁 The Race</span><span class="chip">🕵️ 20 Questions</span><span class="chip">🎡 Wheel of Fortune</span><span class="chip">🧠 The 1% Club</span><span class="chip">🖼️ Picture Reveal</span><span class="chip">🔀 Answer Smash</span><span class="chip">📍 Drop the Pin</span><span class="chip">…and more</span></div>
    <div class="card"><h2>Who's playing?</h2>
      <form id="nf"><label for="nm">Your name (as it'll show on the scoreboard)</label><input type="text" id="nm" value="${esc(m.name)}" maxlength="20" autocomplete="nickname" placeholder="Your name">
      <label>Your emoji</label><div class="emopick">${LQ.EMOJIS.map((e) => `<button type="button" data-em="${e}" class="${e === emoji ? 'on' : ''}">${e}</button>`).join('')}</div>
      <div id="nerr"></div><button class="go">Let's play ▶</button></form>
      <p class="muted small" style="margin:10px 0 0">Best on a phone turned sideways, or on a computer. Use the same name you'll use on Friday, so the bonus finds you.</p></div>
    <div class="card"><h2>🏆 Top scores so far</h2>${boardHtml(r.top || [])}${r.count > 10 ? `<p class="muted small" style="margin:8px 0 0">${r.count} people have played.</p>` : ''}</div>
    <p class="note">Friends can join your game too: the code is on your screen once it starts.</p></div>`;
  $$('[data-em]').forEach((b) => b.onclick = () => { emoji = b.dataset.em; $$('[data-em]').forEach((x) => x.classList.toggle('on', x === b)); });
  $('#nf').onsubmit = (e) => {
    e.preventDefault();
    const name = $('#nm').value.replace(/\s+/g, ' ').trim();
    if (!name) { $('#nerr').innerHTML = '<div class="err" style="margin-top:10px">Tell us your name so it shows on the scoreboard.</div>'; $('#nm').focus(); return; }
    store('lq_player', { pid: me().pid || uid('p'), name, emoji });
    game();
  };
}
/** When it closes: "Friday 2 October at 5pm" (the day and time players need). */
const endsText = (iso) => new Date(iso).toLocaleString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', hour: 'numeric', minute: '2-digit', hour12: true }).replace(':00', '').replace(/ (am|pm)/, '$1').replace(' at ', ' at ');
const leftText = (iso) => { const ms = new Date(iso) - Date.now(); const h = Math.floor(ms / 3600e3); return h >= 48 ? Math.floor(h / 24) + ' days to go' : h >= 1 ? h + ' hour' + (h === 1 ? '' : 's') + ' to go' : Math.max(1, Math.ceil(ms / 60e3)) + ' minutes to go'; };
function closed(r) {
  const w = (r.top || [])[0];
  app.innerHTML = `<div class="land">${brand}<h1>${esc(r.title)}</h1>
    <div class="card played"><div class="em">⏰</div><h2 style="margin:4px 0 0">The warm-up has closed</h2>
      ${w ? `<p class="muted" style="margin:8px 0 0">Top of the table: <b>${esc(w.emoji || '')} ${esc(w.name)}</b> with ${w.score} points, who starts the quiz 1,000 points ahead.</p>` : '<p class="muted">See you at the quiz!</p>'}</div>
    <div class="card"><h2>🏆 Final warm-up scoreboard</h2>${boardHtml(r.top || [])}</div></div>`;
}
function played(r) {
  const p = r.played;
  app.innerHTML = `<div class="land">${brand}
    <div class="card played"><div class="em">${esc(p.emoji || '🎉')}</div><h2 style="margin:4px 0 0">You've had your go, ${esc(p.name)}!</h2>
      <div class="score">${p.score} points</div><p class="muted" style="margin:0">${ordinal(p.place)} of ${r.count} on the warm-up scoreboard${p.place === 1 ? ' · 🥇 top of the table!' : ''}</p>
      <p class="muted small" style="margin:10px 0 0">It's one go per phone. The top score${r.until ? ' when it closes on ' + esc(endsText(r.until)) : ''} gets 1,000 bonus points at the start of the quiz.</p></div>
    <div class="card"><h2>🏆 Warm-up scoreboard</h2>${boardHtml(r.top || [], p)}${r.count > 10 ? `<p class="muted small" style="margin:8px 0 0">${r.count} people have played.</p>` : ''}</div>
    <p class="note">Played on ${new Date(p.played_at).toLocaleString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', hour: 'numeric', minute: '2-digit' })}.</p></div>`;
}

// ---------- the game: host screen and your player screen side by side ----------
function game() {
  const W = 1024, H = 576;
  document.body.style.overflow = 'hidden';
  app.innerHTML = `<div class="game">
      <div class="hostside" id="hostside"><div class="hostbox" id="hostbox"><iframe id="hostFrame" title="The quiz screen" allow="autoplay; fullscreen"></iframe></div></div>
      <div class="playside"><div class="playhead"><span>🎮 You</span><span><button id="fs" type="button" title="Full screen">⛶</button></span></div>
        <div class="waiting" id="waiting">Setting up your game…</div><iframe id="playFrame" title="Your answers" hidden></iframe></div>
    </div>
    <div class="turn"><div class="ph">📱</div><h1>Turn your phone sideways</h1><p>The quiz screen and your answers sit side by side, so it needs the phone on its side.</p></div>`;
  const hostFrame = $('#hostFrame'), hostbox = $('#hostbox'), hostside = $('#hostside');
  hostFrame.src = 'host?quiz=warmup&w=' + encodeURIComponent(CODE) + '&x=' + Date.now().toString(36);
  const fit = () => {
    const r = hostside.getBoundingClientRect(), pad = 6;
    const s = Math.max(0.1, Math.min((r.width - pad * 2) / W, (r.height - pad * 2) / H));
    hostFrame.style.transform = `scale(${s})`;
    hostbox.style.width = W * s + 'px'; hostbox.style.height = H * s + 'px';
    hostbox.style.left = (r.width - W * s) / 2 + 'px'; hostbox.style.top = (r.height - H * s) / 2 + 'px';
  };
  addEventListener('resize', fit); addEventListener('orientationchange', () => setTimeout(fit, 250)); fit();
  // Phones only let a frame play sound after a tap inside that frame, and your taps land in the player frame.
  // So the quiz screen opens under a "tap to start" cover: tapping it switches its sound on.
  hostFrame.addEventListener('load', () => {
    const d = hostFrame.contentDocument; if (!d || d.getElementById('demoTap') || !/host/.test(hostFrame.contentWindow.location.pathname)) return;
    const o = d.createElement('div'); o.id = 'demoTap';
    o.style.cssText = 'position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;background:rgba(27,21,68,.78);color:#fff;font:900 46px Nunito,sans-serif;cursor:pointer;text-align:center';
    o.innerHTML = '🔊 Tap here to start<span style="font-size:26px;font-weight:700;opacity:.85">then answer on the right</span>';
    o.addEventListener('click', () => {
      try { hostFrame.contentWindow.eval("sfx = sfx || new (window.AudioContext || window.webkitAudioContext)(); if (sfx.state === 'suspended') sfx.resume();"); } catch {}
      o.remove();
    });
    d.body.appendChild(o);
  });
  // Once the quiz screen has its game code, join it as a player on the right.
  const wait = setInterval(() => {
    let code = null; try { code = hostFrame.contentWindow.eval('typeof G !== "undefined" && G ? G.code : null'); } catch {}
    if (!code) return;
    clearInterval(wait);
    const pf = $('#playFrame');
    pf.src = 'play?g=' + encodeURIComponent(code) + '&solo=1';
    pf.hidden = false; $('#waiting')?.remove();
  }, 300);
  $('#fs').onclick = () => { const d = document.documentElement; if (document.fullscreenElement) document.exitFullscreen?.(); else d.requestFullscreen?.().then(() => screen.orientation?.lock?.('landscape').catch(() => {})).catch(() => {}); };
}
start();
</script>
</body>
</html>
