<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Box Clever on the TV · Let's Quiz!</title>
<link rel="icon" type="image/png" sizes="64x64" href="assets/brand/icon-64.png">
<meta name="theme-color" content="#1b1544">
<script>if (!/[?&]hub=1/.test(location.search)) location.replace('choose?tv=1'); // Box Clever opens from the "Choose your quiz" page</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  /* Box Clever for two on the Fire TV: a menu, then the game on the whole screen. Everything is laid out on a 960x540 stage scaled to the screen. */
  :root { --stage: #1b1544; --stage-2: #2a1f6e; --sun: #ffd54a; --ink: #1b1544; --brand: #5b3df5; --s: 1; }
  html, body { margin: 0; height: 100%; background: var(--stage); color: #fff; font-family: Nunito, system-ui, sans-serif; overflow: hidden; }
  button { font: inherit; cursor: pointer; }
  #stage { position: fixed; left: 50%; top: 50%; width: 960px; height: 540px; transform: translate(-50%, -50%) scale(var(--s)); transform-origin: center; background: radial-gradient(900px 500px at 50% -10%, var(--stage-2), var(--stage) 70%); overflow: hidden; }
  #game { position: fixed; inset: 0; background: var(--stage); }
  #game iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; }
  #gameload { position: absolute; inset: 0; display: grid; place-items: center; font: 900 1.6rem Nunito, system-ui, sans-serif; color: rgba(255,255,255,.7); }
  #hostFrame { position: fixed; left: -3000px; top: 0; width: 1024px; height: 576px; border: 0; }
  [hidden] { display: none !important; }
  .menu { height: 100%; box-sizing: border-box; padding: 26px 44px 18px; display: flex; flex-direction: column; gap: 14px; }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 900; font-size: 1.05rem; opacity: .85; }
  .brand img { width: 34px; height: 34px; }
  h1 { margin: 0; font-size: 3rem; line-height: 1; font-weight: 900; }
  .sub { margin: 4px 0 0; font-weight: 700; font-size: 1.1rem; opacity: .85; }
  .row { display: flex; gap: 14px; align-items: stretch; }
  .btn { border: 3px solid rgba(255,255,255,.3); background: rgba(255,255,255,.1); color: #fff; border-radius: 16px; padding: 12px 20px; font-weight: 900; font-size: 1.15rem; }
  .btn.primary { background: var(--sun); color: var(--ink); border-color: var(--sun); box-shadow: 0 5px 0 #b8960a; }
  .btn.big { font-size: 1.5rem; padding: 16px 28px; }
  .btn.name { flex: 1 1 0; text-align: left; display: flex; align-items: center; gap: 10px; background: #fff; color: var(--ink); border-color: #fff; }
  .btn.name small { display: block; font-weight: 800; font-size: .8rem; opacity: .6; }
  .btn.name .em { font-size: 2rem; }
  .btn.name b { font-size: 1.5rem; }
  .card { background: rgba(255,255,255,.1); border: 3px solid rgba(255,255,255,.18); border-radius: 20px; padding: 14px 20px; }
  .card h2 { margin: 0 0 8px; font-size: 1.3rem; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 0; }
  .chip { background: rgba(255,255,255,.14); border-radius: 999px; padding: 6px 14px; font-weight: 800; font-size: 1.05rem; }
  .muted { opacity: .75; font-weight: 700; }
  .grow { flex: 1 1 auto; }
  .small { font-size: .85rem; }
  .banner { background: var(--sun); color: var(--ink); border-radius: 18px; padding: 12px 20px; display: flex; align-items: center; gap: 16px; font-weight: 900; font-size: 1.15rem; }
  .banner .btn { border-color: var(--ink); color: var(--ink); background: #fff; }
  .hint { text-align: center; font-weight: 700; font-size: .75rem; opacity: .5; }
  /* focus ring */
  :focus { outline: 4px solid var(--sun); outline-offset: 3px; border-radius: 14px; }
  .btn:focus { transform: scale(1.03); }
  /* overlays: the pause menu and the name keyboard */
  .modal-bg { position: fixed; inset: 0; background: rgba(10,6,40,.82); display: grid; place-items: center; z-index: 50; }
  .pop { background: #fff; color: var(--ink); border-radius: 24px; padding: 22px 30px; width: 600px; max-width: 92vw; box-sizing: border-box; transform: scale(var(--s)); text-align: center; }
  .pop h2 { margin: 0 0 6px; font-size: 1.9rem; } .pop p { margin: 0 0 14px; font-weight: 700; opacity: .75; }
  .pop .btn { color: var(--ink); background: #eeebff; border-color: #cfcbe6; display: block; width: 100%; margin: 8px 0; }
  .pop .btn.primary { background: var(--sun); border-color: var(--sun); }
  .kbtxt { background: #f4f3fb; border: 3px solid var(--brand); border-radius: 12px; min-height: 46px; padding: 6px 14px; font-weight: 900; font-size: 1.9rem; text-align: center; margin-bottom: 10px; }
  .kbtxt.empty::before { content: 'Type your name'; font-size: 1.1rem; opacity: .4; }
  .kb { display: flex; flex-direction: column; gap: 5px; }
  .kbrow { display: flex; justify-content: center; gap: 5px; }
  .pop .kbrow .btn { display: block; width: auto; min-width: 44px; margin: 0; padding: 7px 8px; font-size: 1.2rem; border-radius: 10px; }
  .pop .kbrow .btn.w { min-width: 130px; }
</style>
</head>
<body class="tv">
<div id="stage"><div class="menu" id="menu"></div></div>
<div id="game" hidden><div id="gameload">Setting up your game…</div><iframe id="playFrame" title="Box Clever" allow="autoplay"></iframe></div>
<iframe id="hostFrame" title="" aria-hidden="true" tabindex="-1" allow="autoplay"></iframe>
<div id="over"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/common.js"></script>
<script src="assets/hubkit.js?v=20261115b"></script>
<script src="assets/dpad.js"></script>
<script>
const { $, esc, store, uid } = LQ;
const KEY = 'lq_tvbox';                         // what this TV remembers: which games are played, the game part-played, the two names
const HOSTKEY = 'lq_live_tvbox';                // where host.html keeps a game under way (so a part-played game carries on)
const load = () => { const s = store(KEY); return s && typeof s === 'object' ? s : {}; };
let S = load(); S.played = S.played || {}; S.order = S.order || [];
const keep = () => store(KEY, S);
let INDEX = { games: [] }, offerAt = 0, inGame = false;
const AUTO = new URLSearchParams(location.search).get('auto') === '1'; // Box2p: straight into the game being played, or the next one
const fit = () => document.documentElement.style.setProperty('--s', String(Math.min(innerWidth / 960, innerHeight / 540)));
fit(); addEventListener('resize', fit);
// One list of played games for every device (the TV, the phone app): a game used anywhere is not offered again. The server (quiz-api: pool_state,
// pool_claim, pool_done) knows which games are played and which another device has started; if it cannot be reached, this device's own list is used.
const POOL = 'BOX2P';
const devId = () => { let d = ''; try { d = localStorage.getItem('lq_pooldev') || ''; if (!d) { d = 'd' + Math.random().toString(36).slice(2, 10); localStorage.setItem('lq_pooldev', d); } } catch {} return d || 'd0'; };
let SV = { played: new Set(), others: new Set(), ok: false };
async function refreshPool() {
  try { const r = await LQ.api('pool_state', { pool: POOL }, { timeout: 6000 }); SV = { played: new Set(r.played || []), others: new Set((r.claimed || []).filter((c) => c.dev !== devId()).map((c) => c.game)), ok: true }; for (const id of SV.played) S.played[id] = S.played[id] || 'elsewhere'; keep(); }
  catch { SV = { played: new Set(), others: new Set(), ok: false }; }
}
const poolSay = (action, game) => LQ.api(action, { pool: POOL, game, dev: devId() }, { timeout: 6000 }).catch(() => null);
const gm = (id) => INDEX.games.find((g) => g.id === id);
const num = (id) => parseInt(id.slice(1), 10);

// ---------------------------------------------------------------- names
const emoji = (i) => HUB.emojis()[i]; const emojiOld = (i) => { S.emojis = S.emojis || []; if (!S.emojis[i]) { const used = S.emojis.filter(Boolean); const pool = LQ.EMOJIS.filter((e) => !used.includes(e)); S.emojis[i] = pool[Math.floor(Math.random() * pool.length)]; keep(); } return S.emojis[i]; };
const names = () => HUB.names(); const namesOld = () => { if (!S.names) { const p = store('lq_player') || {}; let l = []; try { l = JSON.parse(localStorage.getItem('lq_locals') || '[]'); } catch {} S.names = [p.name || 'Player 1', l[0] || 'Player 2']; keep(); } return S.names; };

// ---------------------------------------------------------------- the menu
function order() { // every game once, in a mixed order that stays the same on this TV
  const ids = INDEX.games.map((g) => g.id);
  S.order = S.order.filter((id) => ids.includes(id)); for (const id of ids.slice().sort(() => Math.random() - 0.5)) if (!S.order.includes(id)) S.order.push(id);
  keep(); return S.order;
}
const unplayed = () => order().filter((id) => !S.played[id] && !SV.others.has(id));
async function menu() {
  inGame = false; await refreshPool(); $('#game').hidden = true; $('#stage').hidden = false; $('#hostFrame').src = 'about:blank'; $('#playFrame').src = 'about:blank';
  const left = unplayed(), total = INDEX.games.length, nm = names();
  if (offerAt >= left.length) offerAt = 0;
  const offer = gm(S.cur?.id) && S.cur ? null : gm(left[offerAt]), cur = S.cur && gm(S.cur.id);
  const cats = (g) => `<div class="chips">${g.cats.map((c) => `<span class="chip">${esc(c.e)} ${esc(c.n)}</span>`).join('')}</div>`;
  $('#menu').innerHTML = `<div class="brand"><img src="assets/brand/mark.png" alt="">Let's Quiz!</div>
    <div><h1>📦 Box Clever</h1><p class="sub">Two players, one remote. Take it in turns. No timer, so take your time.</p></div>
    <div class="row"><button class="btn name" id="n0"><span class="em">${emoji(0)}</span><span><small>Player 1</small><b>${esc(nm[0])}</b></span></button><button class="btn name" id="n1"><span class="em">${emoji(1)}</span><span><small>Player 2</small><b>${esc(nm[1])}</b></span></button></div>
    ${cur ? `<div class="banner"><span class="grow">⏸️ Game ${num(cur.id)} is part-played.</span><button class="btn" id="carry" data-autofocus>▶ Carry on</button><button class="btn" id="drop">Start a new one</button></div>` : ''}
    ${offer ? `<div class="card"><h2>Game ${num(offer.id)} of ${total}</h2>${cats(offer)}</div>
      <div class="row"><button class="btn primary big grow" id="play" data-autofocus>▶ Play this game</button><button class="btn big" id="other">↻ Another game</button></div>`
      : !cur ? `<div class="card"><h2>🎉 You have played all ${total} games!</h2><p class="muted" style="margin:0">Every game is used once. Start the pool again to play them all over.</p></div><div class="row"><button class="btn primary big grow" id="again" data-autofocus>↻ Play them all again</button></div>` : ''}
    <div class="row" style="align-items:center"><span class="muted small grow">${Object.keys(S.played).length} of ${total} games played · ${left.length} left${S.cur ? '' : ''}</span>${Object.keys(S.played).length ? '<button class="btn small" id="reset">Start the pool again</button>' : ''}</div>
    <div class="hint">◀ ▲ ▼ ▶ move · OK choose · Back to leave</div>`;
  const on = (id, f) => { const b = $('#' + id); if (b) b.onclick = f; };
  on('n0', () => rename(0)); on('n1', () => rename(1));
  on('play', () => start(offer.id)); on('other', () => { offerAt++; menu(); focusId('other'); });
  on('carry', () => start(cur.id)); on('drop', () => { retire(S.cur.id); menu(); });
  on('again', () => { S.played = {}; keep(); menu(); }); on('reset', () => confirmBox('Start the pool again?', 'All the games you have played will be available again.', 'Yes, start again', () => { S.played = {}; S.cur = null; keep(); try { localStorage.removeItem(HOSTKEY); } catch {} menu(); }));
  setTimeout(() => DPAD.focusFirst(), 50);
}
const focusId = (id) => setTimeout(() => { const b = $('#' + id); if (b) DPAD.focus(b); }, 60);
/** a game is retired (played or dropped): it is not offered again until the pool is started again */
function retire(id) { poolSay('pool_done', id); S.played[id] = new Date().toISOString(); if (S.cur?.id === id) S.cur = null; keep(); try { localStorage.removeItem(HOSTKEY); } catch {} }

// ---------------------------------------------------------------- a keyboard for the names (the remote walks over the keys)
function overlay(html) { const o = $('#over'); o.innerHTML = `<div class="modal-bg"><div class="modal pop">${html}</div></div>`; return o; }
const close = () => { $('#over').innerHTML = ''; };
function confirmBox(title, text, yes, fn) {
  overlay(`<h2>${esc(title)}</h2><p>${esc(text)}</p><button class="btn primary" id="yes" data-autofocus>${esc(yes)}</button><button class="btn" id="no">Cancel</button>`);
  $('#yes').onclick = () => { close(); fn(); }; $('#no').onclick = () => { close(); DPAD.focusFirst(); }; setTimeout(() => DPAD.focusFirst(), 30);
}
function rename(i) {
  let v = names()[i] === 'Player ' + (i + 1) ? '' : names()[i];
  const rows = ['1234567890', 'QWERTYUIOP', 'ASDFGHJKL', 'ZXCVBNM'];
  overlay(`<h2>Player ${i + 1}'s name</h2><div class="kbtxt" id="kbv"></div><div class="kb">${rows.map((r) => `<div class="kbrow">${[...r].map((c) => `<button class="btn" data-k="${c}">${c}</button>`).join('')}</div>`).join('')}
    <div class="kbrow"><button class="btn w" data-k=" ">SPACE</button><button class="btn w" data-k="⌫">⌫ DELETE</button></div>
    <div class="kbrow"><button class="btn primary w" id="kdone" data-autofocus>✔ Done</button></div></div>`);
  const show = () => { const e = $('#kbv'); e.textContent = v; e.classList.toggle('empty', !v); };
  const add = (c) => { if (c === '⌫') v = v.slice(0, -1); else if (v.length < 14) v += (v && v.slice(-1) !== ' ' ? c.toLowerCase() : c); show(); };
  document.querySelectorAll('[data-k]').forEach((b) => b.onclick = () => add(b.dataset.k));
  $('#kdone').onclick = () => { const n = v.trim() || 'Player ' + (i + 1); S.names = names().slice(); S.names[i] = n; keep(); HUB.setName(i, n); close(); menu(); focusId('n' + i); };
  show(); setTimeout(() => DPAD.focusFirst(), 30);
}

// ---------------------------------------------------------------- the game
let timer = null, finished = false;
async function start(id) {
  if (S.cur?.id !== id) { const c = await poolSay('pool_claim', id); if (c && c.taken) { await refreshPool(); const nx = unplayed().find((x) => x !== id); return nx ? start(nx) : menu(); } } // another device has it: take the next one
  const nm = names(), p = store('lq_player') || {};
  store('lq_player', { pid: /^p_[a-z0-9]{6,12}$/.test(p.pid || '') ? p.pid : uid('p'), name: nm[0], emoji: emoji(0) });
  try { localStorage.setItem('lq_locals', JSON.stringify([nm[1]])); } catch {}
  S.namesSet = true; const resuming = S.cur?.id === id;
  if (!resuming) { try { localStorage.removeItem(HOSTKEY); } catch {} S.cur = { id, at: new Date().toISOString() }; keep(); }
  inGame = true; finished = false; $('#stage').hidden = true; $('#game').hidden = false;
  histOk = false; ensureHist();
  const hf = $('#hostFrame'), pf = $('#playFrame');
  hf.src = 'host?quiz=tvbox&src=tvbox/games/' + id + '.json&tv=1&x=' + Date.now().toString(36);
  clearInterval(timer);
  const t0 = Date.now();
  timer = setInterval(() => {
    let code = null, phase = null;
    try { const w = hf.contentWindow; code = w.eval('typeof G !== "undefined" && G ? G.code : null'); phase = w.eval('typeof G !== "undefined" && G ? G.phase : null'); } catch {}
    if (code && !pf.dataset.code) { pf.dataset.code = code; pf.src = 'play?g=' + encodeURIComponent(code) + '&solo=1&tv=1'; pf.addEventListener('load', () => { sound(); try { pf.contentWindow.focus(); } catch {} }, { once: true }); }
    if (phase === 'final' && !finished) { finished = true; retire(id); }
    if (!code && Date.now() - t0 > 40000) { clearInterval(timer); inGame = false; overlay(`<h2>Hmm.</h2><p>The game would not start. Check the internet connection.</p><button class="btn primary" id="back" data-autofocus>Back to the menu</button>`); $('#back').onclick = () => { close(); menu(); }; setTimeout(() => DPAD.focusFirst(), 30); }
  }, 400);
  sound();
}
function retireNow() { if (S.cur && !finished) { finished = true; retire(S.cur.id); } }
// The test game (?test=1): tvbox/test.json, the same 5 questions every time. Not claimed, not retired, no game point; "play again" starts it afresh.
async function startTest() {
  const nm = names(), p = store('lq_player') || {};
  store('lq_player', { pid: /^p_[a-z0-9]{6,12}$/.test(p.pid || '') ? p.pid : uid('p'), name: nm[0], emoji: emoji(0) });
  try { localStorage.setItem('lq_locals', JSON.stringify([nm[1]])); localStorage.removeItem(HOSTKEY); } catch {}
  inGame = true; finished = true; $('#stage').hidden = true; $('#game').hidden = false; histOk = false; ensureHist();
  const hf = $('#hostFrame'), pf = $('#playFrame'); pf.dataset.code = '';
  hf.src = 'host?quiz=tvbox&src=tvbox/test.json&tv=1&x=' + Date.now().toString(36);
  clearInterval(timer); const t0 = Date.now();
  timer = setInterval(() => {
    let code = null; try { code = hf.contentWindow.eval('typeof G !== "undefined" && G ? G.code : null'); } catch {}
    if (code && !pf.dataset.code) { pf.dataset.code = code; pf.src = 'play?g=' + encodeURIComponent(code) + '&solo=1&tv=1&test=1'; pf.addEventListener('load', () => { sound(); try { pf.contentWindow.focus(); } catch {} }, { once: true }); }
    if (!code && Date.now() - t0 > 40000) { clearInterval(timer); location.href = 'choosetest?tv=1'; }
  }, 400);
  sound();
}
function sound() { try { $('#hostFrame').contentWindow.eval("sfx = sfx || new (window.AudioContext || window.webkitAudioContext)(); if (sfx.state === 'suspended') sfx.resume();"); } catch {} }
function leave() { if (HUB.test) { location.href = 'choosetest?tv=1'; return; } clearInterval(timer); $('#playFrame').dataset.code = ''; menu(); }
function pause() {
  if (!inGame || $('#over').innerHTML) return;
  overlay(`<h2>⏸️ Paused</h2><p>The game is saved. You can carry on later.</p><button class="btn primary" id="resume" data-autofocus>▶ Carry on playing</button><button class="btn" id="quit">Quit to the menu</button>`);
  $('#resume').onclick = () => { close(); ensureHist(); const pf = $('#playFrame'); try { pf.contentWindow.focus(); pf.contentWindow.DPAD.focusFirst(); } catch {} };
  $('#quit').onclick = () => { close(); leave(); };
  setTimeout(() => DPAD.focusFirst(), 30);
}
// Back on the remote: a history step in the Silk browser, a key in the Fire TV app, or a message from the game
// Back: the browser skips history steps a page added before anyone pressed a key, so the step is added once a key has been pressed (the game frame says so)
let histOk = false;
function ensureHist() { if (histOk || !inGame) return; if (navigator.userActivation && !navigator.userActivation.hasBeenActive) return; history.pushState({ game: 1 }, ''); histOk = true; }
addEventListener('popstate', () => { if (inGame) { histOk = false; ensureHist(); pause(); } });
addEventListener('message', (e) => {
  const m = e.data && e.data.lqtv; if (!m) return;
  if (m === 'key') ensureHist();
  else if (m === 'back') pause(); else if (m === 'menu') leave(); else if (m === 'hub') { if (HUB.test) { location.href = 'choosetest?tv=1'; return; } retireNow(); location.href = 'choose?tv=1'; }
  else if (m === 'next' && HUB.test) { clearInterval(timer); startTest(); }
  else if (m === 'next') { const nx = unplayed().find((x) => x !== S.cur?.id); leave(); if (nx) start(nx); else menu(); }
  else if (m === 'final' && !finished && inGame) { finished = true; const id = S.cur?.id; if (id) retire(id); }
});
document.addEventListener('keydown', (e) => { sound(); ensureHist(); if (!inGame && !$('#over').innerHTML && (e.key === 'Escape')) { /* the browser's own Back leaves the page */ } if (inGame && e.key === 'Escape') pause(); }, true);

(async function boot() {
  try { INDEX = await (await fetch('tvbox/index.json')).json(); } catch { $('#menu').innerHTML = '<h1>Hmm.</h1><p class="sub">The games could not be loaded. Check the internet connection and try again.</p>'; return; }
  history.replaceState({ menu: 1 }, '');
  if (HUB.test) return startTest();
  await menu();
  if (AUTO) { // the game being played, else the next one not played yet
    const id = S.cur && gm(S.cur.id) ? S.cur.id : unplayed()[0];
    if (id) setTimeout(() => start(id), 400);
  }
})();
</script>
</body>
</html>
