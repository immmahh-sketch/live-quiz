<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Quiz — Host</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body class="host">
<div class="stage" id="stage"><div class="stage-main"><span class="spinner"></span></div></div>
<div class="confetti hidden" id="confetti"></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="assets/common.js"></script>
<script src="assets/demo-quiz.js"></script>
<script>
const { $, $$, esc, uid, api, TYPES, COLORS, speedPoints, textMatch, similarity, shuffle, newCode, playUrl, shortPlayUrl, store, unstore, ordinal } = LQ;
const DEMO = new URLSearchParams(location.search).get('quiz') === 'demo';
const quizId = new URLSearchParams(location.search).get('quiz');
const SAVE_KEY = 'lq_live_' + quizId;
const stage = $('#stage');
let G = null, ch = null, sb = null, tickT = null, hbT = null, countT = null, helloT = null;
const present = new Map(); // pid -> name, from presence

let toastT;
function toast(msg, bad) { const t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (bad ? ' bad' : ''); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3000); }
const persist = () => store(SAVE_KEY, G);
const players = () => Object.values(G.players);
const ranked = () => players().slice().sort((a, b) => b.score - a.score || a.joinedAt - b.joinedAt);
const total = () => G.quiz.questions.length;
const question = () => G.quiz.questions[G.qIndex];
const roundOf = (i) => { const q = G.quiz.questions[i]; const ri = G.quiz.rounds.findIndex((r) => r.id === q?.round); return ri < 0 ? null : { n: ri + 1, ...G.quiz.rounds[ri], count: G.quiz.questions.filter((x) => x.round === q.round).length }; };
const startsRound = (i) => i === 0 || G.quiz.questions[i - 1]?.round !== G.quiz.questions[i]?.round;

// ------------------------------------------------------------------ boot
(async function boot() {
  if (!quizId) return fail('No quiz chosen. Open a quiz in the builder and press Host.');
  if (!DEMO && !LQ.hostPassword()) { location.href = 'index.html'; return; }
  const saved = store(SAVE_KEY);
  if (saved && saved.phase !== 'final' && saved.phase !== 'lobby' && Object.keys(saved.players).length) {
    const ok = await ask(`Carry on the game in progress?`, `Game ${saved.code} — ${Object.keys(saved.players).length} players, question ${saved.qIndex + 1} of ${saved.quiz.questions.length}.`, 'Carry on', 'Start fresh');
    if (ok) { G = saved; return connect(); }
  }
  let quiz;
  if (DEMO) quiz = JSON.parse(JSON.stringify(window.DEMO_QUIZ));
  else { try { quiz = (await api('get', { id: quizId })).quiz; } catch (e) { return fail(e.message); } }
  quiz = LQ.normalizeQuiz(quiz);
  quiz.questions = quiz.questions.filter((q) => LQ.validate(q).length === 0);
  quiz.rounds = quiz.rounds.filter((r) => quiz.questions.some((q) => q.round === r.id));
  if (!quiz.questions.length) return fail('This quiz has no finished questions to play.');
  G = { code: newCode(), quizId, quiz, phase: 'lobby', qIndex: -1, players: {}, startedAt: null, q: null, bots: [] };
  persist();
  connect();
  const nb = +new URLSearchParams(location.search).get('bots');
  if (nb > 0) setTimeout(() => addBots(Math.min(8, nb)), 0);
})();

// ------------------------------------------------------------------ test mode: bots
//
// Simulated players that live inside this page. They join like phones do, answer every
// question type after a realistic pause with a skill level, take their Wipeout turns and
// run the race — all through the same handlers a real phone's message would reach, so a
// game with bots exercises exactly the code a real game does.
const BOT_NAMES = [['Ada', '🦉'], ['Bo', '👾'], ['Cy', '🐙'], ['Dee', '🦖'], ['Eli', '🐸'], ['Fen', '🐼'], ['Gus', '🦄'], ['Ivy', '🐨']];
function addBots(n) {
  G.bots = G.bots || [];
  for (let i = 0; i < n && G.bots.length < 8; i++) {
    const [nm, em] = BOT_NAMES[G.bots.length];
    const bot = { pid: 'p_bot' + (G.bots.length + 1) + nm.toLowerCase().padEnd(4, 'x'), name: 'Bot ' + nm, emoji: em, skill: [0.85, 0.65, 0.5, 0.75, 0.6, 0.55, 0.7, 0.8][G.bots.length], pace: [0.35, 0.6, 0.9, 0.5, 0.7, 0.8, 0.45, 0.65][G.bots.length] };
    G.bots.push(bot); present.set(bot.pid, bot.name);
    onHello({ pid: bot.pid, name: bot.name, emoji: bot.emoji });
  }
  persist(); if (G.phase === 'lobby') renderLobby();
}
const botTimers = [];
function botLater(fn, ms) { botTimers.push(setTimeout(fn, ms)); }
function botClear() { while (botTimers.length) clearTimeout(botTimers.pop()); }
const rnd = (a, b) => a + Math.random() * (b - a);
const chance = (p) => Math.random() < p;
/** Called when a question goes live: every bot schedules its answer. */
function botsOnQuestion() {
  botClear();
  if (!G.bots?.length || !G.q) return;
  const q = question(), v = G.q.view;
  if (q.type === 'wipeout') return botWipeTurn(); // and again on every later turn (wipeNextTurn / wipeTimeout)
  if (q.type === 'race') { for (const b of G.bots) botRaceStep(b); return; }
  for (const b of G.bots) {
    const delay = 1200 + b.pace * q.time * 1000 * rnd(0.25, 0.8);
    botLater(() => { if (G.phase === 'question' && G.q?.view.id === v.id) onAnswer({ pid: b.pid, qId: v.id, answer: chance(0.07) ? 'skip' : botAnswer(b, q, v) }); }, Math.min(delay, q.time * 1000 - 800));
  }
}
function botAnswer(b, q, v) {
  const keys = G.q.keys, inv = {}; for (const [t, id] of Object.entries(keys)) inv[id] = t;
  const ok = chance(b.skill);
  if (q.type === 'choice' || q.type === 'tf') {
    const right = v.options.find((o) => keys[o.k] === LQ.correctId(q));
    const others = v.options.filter((o) => o !== right);
    return (ok || !others.length ? right : others[Math.floor(Math.random() * others.length)]).k;
  }
  if (q.type === 'text') {
    if (ok) { const a = q.answers[0]; return chance(0.3) && a.length > 4 ? a.slice(0, -1) + a.slice(-1).toLowerCase() + (chance(0.5) ? 'e' : '') : a; }
    return ['Pass', 'Not sure', 'Bob', 'Paris', '1966', 'The other one'][Math.floor(Math.random() * 6)];
  }
  if (q.type === 'order') {
    const right = q.items.filter((i) => i.text.trim()).map((i) => inv[i.id]);
    if (ok) return right;
    const r = right.slice(); const i = Math.floor(Math.random() * (r.length - 1)); [r[i], r[i + 1]] = [r[i + 1], r[i]]; return r;
  }
  if (q.type === 'match') {
    const out = {}; const rights = v.right.slice();
    for (const l of v.left) { const pid = keys[l.k].slice(2); const good = rights.find((r) => keys[r.k] === 'R:' + pid); const pick = chance(b.skill) && good ? good : rights[Math.floor(Math.random() * rights.length)]; out[l.k] = pick.k; rights.splice(rights.indexOf(pick), 1); }
    return out;
  }
  if (q.type === 'sort') {
    const out = {};
    for (const it of v.items) { const item = q.items.find((x) => 'I:' + x.id === keys[it.k]); const good = v.categories.find((c) => keys[c.k] === 'C:' + item.category); out[it.k] = (chance(b.skill) ? good : v.categories[Math.floor(Math.random() * v.categories.length)]).k; }
    return out;
  }
  if (q.type === 'pin') {
    const spread = ok ? q.radiusFull * 0.8 : q.radiusZero * rnd(0.5, 1.6);
    const ang = rnd(0, Math.PI * 2);
    return { x: LQ.clamp(q.pin.x + Math.cos(ang) * spread * rnd(0, 1), 0, 1), y: LQ.clamp(q.pin.y + Math.sin(ang) * spread * rnd(0, 1) / (G.aspect || 1), 0, 1) };
  }
  return null;
}
/** Wipeout: when the turn lands on a bot, it picks after a pause — usually a right one. */
function botWipeTurn() {
  const w = G.q?.wipe; if (!w || w.over) return;
  const b = (G.bots || []).find((x) => x.pid === w.turnPid); if (!b) return;
  const turnAt = w.turnDeadline;
  botLater(() => {
    if (G.phase !== 'question' || !G.q?.wipe || G.q.wipe.turnDeadline !== turnAt || G.q.wipe.over) return;
    const left = G.q.view.board.filter((t) => !G.q.wipe.gone.includes(t.k));
    const rights = left.filter((t) => String(G.q.keys[t.k]).startsWith('R:')), wrongs = left.filter((t) => !String(G.q.keys[t.k]).startsWith('R:'));
    const pool = chance(0.08 + (1 - b.skill) * 0.3) && wrongs.length ? wrongs : (rights.length ? rights : left);
    if (pool.length) onAnswer({ pid: b.pid, qId: G.q.view.id, answer: pool[Math.floor(Math.random() * pool.length)].k });
  }, rnd(900, Math.max(1200, question().time * 1000 * 0.7)));
}
/** The race: each bot answers its current question every few seconds until it is done or out. */
function botRaceStep(b) {
  botLater(() => {
    const race = G.q?.race; if (G.phase !== 'question' || !race || race.over) return;
    const r = race.players[b.pid]; if (!r || r.out || r.done) return;
    const item = G.q.view.bank[r.idx]; if (!item) return;
    const bid = String(G.q.keys[item.k]).slice(2);
    const right = item.options.find((o) => G.q.keys[o.k] === 'R:' + bid), others = item.options.filter((o) => o !== right);
    const k = chance(0.08) ? 'skip' : (chance(b.skill) || !others.length) ? right.k : others[Math.floor(Math.random() * others.length)].k;
    racePick(b.pid, { idx: r.idx, k });
    botRaceStep(b);
  }, rnd(1500, 2500) + b.pace * 3000);
}
function fail(msg) { stage.innerHTML = `<div class="stage-main"><h1 class="big">Hmm.</h1><p style="font-size:1.3rem">${esc(msg)}</p><a class="btn btn-primary" href="index.html">Back to the builder</a></div>`; }
function ask(title, body, yes, no) {
  return new Promise((res) => {
    const bg = document.createElement('div'); bg.className = 'modal-bg';
    bg.innerHTML = `<div class="modal" style="color:var(--ink)"><h3>${esc(title)}</h3><p class="muted">${esc(body)}</p><div class="row" style="justify-content:flex-end"><button class="btn btn-ghost" data-no style="color:var(--ink)">${esc(no)}</button><button class="btn btn-primary" data-yes style="background:var(--brand);color:#fff">${esc(yes)}</button></div></div>`;
    document.body.appendChild(bg);
    $('[data-no]', bg).onclick = () => { bg.remove(); res(false); };
    $('[data-yes]', bg).onclick = () => { bg.remove(); res(true); };
  });
}

// ------------------------------------------------------------------ realtime
function connect() {
  sb = LQ.client();
  ch = sb.channel('quiz-' + G.code, { config: { broadcast: { self: false }, presence: { key: 'host' } } });
  ch.on('broadcast', { event: 'hello' }, ({ payload }) => onHello(payload));
  ch.on('broadcast', { event: 'answer' }, ({ payload }) => onAnswer(payload));
  ch.on('presence', { event: 'sync' }, () => {
    present.clear();
    for (const entries of Object.values(ch.presenceState())) for (const e of entries) if (e.role === 'player' && e.pid) present.set(e.pid, e.name);
    for (const b of G.bots || []) present.set(b.pid, b.name);
    if (G.phase === 'lobby') renderLobbyPlayers();
    if (G.phase === 'question') { renderAnswered(); maybeAllAnswered(); }
  });
  ch.subscribe(async (status) => {
    if (status === 'SUBSCRIBED') { await ch.track({ role: 'host' }); render(); broadcastState(); startHeartbeat(); if (G.phase === 'question') startTick(); }
    else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') toast('Connection trouble — retrying…', true);
  });
}
function send(event, payload) { if (ch && ch.state === 'joined') ch.send({ type: 'broadcast', event, payload }); }
function startHeartbeat() { clearInterval(hbT); hbT = setInterval(broadcastState, 2000); }

/** Everything a phone needs to draw its screen. Never the right answers. */
function stateForPlayers() {
  const s = { phase: G.phase, code: G.code, qIndex: G.qIndex, total: total(), title: G.quiz.title, now: Date.now() };
  if (G.phase === 'question' && G.q) {
    s.q = G.q.view; s.remainingMs = Math.max(0, (G.q.deadline || 0) - Date.now()); s.answered = Object.keys(G.q.answers);
    if (G.q.wipe) { const w = G.q.wipe; s.wipe = { turnPid: w.turnPid, turnName: G.players[w.turnPid]?.name || '', remainingMs: Math.max(0, w.turnDeadline - Date.now()), gone: w.gone, out: w.out, over: w.over, last: w.last, scores: w.scores }; }
    if (G.q.race) { const r = G.q.race; s.race = { winner: r.winner, winnerName: r.winner ? G.players[r.winner]?.name : null, over: r.over, target: G.q.view.target, players: Object.fromEntries(Object.entries(r.players).map(([pid, p]) => [pid, { idx: p.idx, correct: p.correct, out: p.out, done: p.done }])) }; }
  }
  if (G.phase === 'countdown') s.next = { type: question().type, n: G.qIndex + 1 };
  if (G.phase === 'round') { const r = roundOf(G.qIndex); s.round = { n: r.n, title: r.title, count: r.count }; }
  if ((G.phase === 'reveal' || G.phase === 'scoreboard' || G.phase === 'final') && G.q?.results) {
    s.results = {}; s.qType = question()?.type;
    const rk = ranked();
    for (const p of rk) { const r = G.q.results.byPlayer[p.id]; s.results[p.id] = { correct: r?.correct || false, partial: r?.partial ?? (r?.correct ? 1 : 0), points: r?.points || 0, answered: !!r?.answered, skipped: !!r?.skipped, wiped: !!r?.wiped, raced: !!r?.raced, got: r?.got, out: !!r?.out, score: p.score, rank: rk.indexOf(p) + 1, of: rk.length }; }
    if (G.quiz.settings.showAnswersOnPhones !== false) s.answer = answerText(question());
  }
  if (G.phase === 'final') s.top = ranked().slice(0, 10).map((p, i) => ({ name: p.name, score: p.score, rank: i + 1 }));
  return s;
}
function broadcastState() { send('state', stateForPlayers()); }
function answerText(q) {
  if (q.type === 'choice') return q.options.find((o) => o.id === q.correct)?.text || '';
  if (q.type === 'text') return q.answers[0];
  if (q.type === 'order') return q.items.filter((i) => i.text.trim()).map((i) => i.text).join(' → ');
  if (q.type === 'match') return q.pairs.map((p) => p.left + (p.right.kind === 'text' ? ' – ' + p.right.value : '')).join(', ');
  if (q.type === 'pin') return q.place ? 'It was ' + q.place : 'See the screen';
  if (q.type === 'tf') return q.answer === false ? 'False' : 'True';
  if (q.type === 'sort') return q.categories.filter((c) => c.name.trim()).map((c) => `${c.name}: ${q.items.filter((i) => i.category === c.id && i.text.trim()).map((i) => i.text).join(', ')}`).join(' · ');
  if (q.type === 'wipeout') return 'Wrong ones: ' + q.wrong.filter((i) => i.text.trim()).map((i) => i.text).join(', ');
  if (q.type === 'race') { const w = G.q?.results?.stats?.winner; return w ? `${w.name} won the race` : 'Nobody finished the race'; }
  return '';
}

function onHello({ pid, name, emoji }) {
  if (typeof pid !== 'string' || !/^p_[a-z0-9]{6,12}$/.test(pid)) return;
  name = String(name || '').replace(/\s+/g, ' ').trim().slice(0, 20) || 'Player';
  emoji = LQ.EMOJIS.includes(emoji) ? emoji : '';
  if (!G.players[pid]) { G.players[pid] = { id: pid, name, emoji, score: 0, joinedAt: Date.now() }; persist(); if (G.phase === 'lobby') renderLobbyPlayers(); }
  else if ((G.players[pid].name !== name || G.players[pid].emoji !== emoji) && G.phase === 'lobby') { G.players[pid].name = name; G.players[pid].emoji = emoji; persist(); renderLobbyPlayers(); }
  clearTimeout(helloT); helloT = setTimeout(broadcastState, 150);
}
function onAnswer({ pid, qId, answer }) {
  if (G.phase !== 'question' || !G.q || qId !== G.q.view.id) return;
  if (!G.players[pid]) { onHello({ pid, name: present.get(pid) || 'Player' }); }
  if (G.q.wipe) return wipePick(pid, String(answer));
  if (G.q.race) return racePick(pid, answer);
  if (G.q.answers[pid]) return;
  G.q.answers[pid] = { answer, elapsed: Date.now() - G.q.startedAt };
  persist();
  send('ack', { pid, qId });
  renderAnswered();
  maybeAllAnswered();
}
function maybeAllAnswered() {
  if (G.phase !== 'question' || G.q?.wipe || G.q?.race) return;
  const live = [...present.keys()].filter((pid) => G.players[pid]);
  const pool = live.length ? live : Object.keys(G.players);
  if (pool.length && pool.every((pid) => G.q.answers[pid])) setTimeout(() => { if (G.phase === 'question') endQuestion(); }, 600);
}

// ------------------------------------------------------------------ game flow
function primaryAction() {
  if (G.phase === 'lobby') return players().length ? goTo(0) : toast('Waiting for at least one player.');
  if (G.phase === 'round') return startCountdown(G.qIndex);
  if (G.phase === 'countdown') return startQuestion();
  if (G.phase === 'question') return endQuestion();
  if (G.phase === 'reveal') return showScoreboard();
  if (G.phase === 'scoreboard') return G.qIndex + 1 < total() ? goTo(G.qIndex + 1) : finish();
}
/** Moves to question i, via a round title card when it starts a new round and the quiz has more than one. */
function goTo(i) {
  if (G.quiz.rounds.length > 1 && startsRound(i)) {
    clearInterval(tickT); clearInterval(countT);
    G.qIndex = i; G.phase = 'round'; G.q = null; if (!G.startedAt) G.startedAt = new Date().toISOString();
    persist(); render(); broadcastState(); return;
  }
  startCountdown(i);
}
function startCountdown(i) {
  clearInterval(tickT); clearInterval(countT);
  G.qIndex = i; G.phase = 'countdown'; G.q = null; if (!G.startedAt) G.startedAt = new Date().toISOString();
  persist(); render(); broadcastState();
  const q = question();
  // Pre-load the picture so the aspect ratio is known for pin scoring and the screen is instant.
  if (q.media?.kind === 'image' && q.media.url) { const im = new Image(); im.onload = () => { G.aspect = im.naturalHeight / im.naturalWidth; }; im.src = q.media.url; }
  let n = 3; const el = () => $('#count');
  countT = setInterval(() => { n--; if (n <= 0) { clearInterval(countT); startQuestion(); } else if (el()) el().textContent = n; }, 1000);
}
function buildView(q) {
  const keys = {}; const tok = (id) => { const t = uid('k'); keys[t] = id; return t; };
  const v = { id: q.id, type: q.type, text: q.text, time: q.time, hint: q.hint || '', media: q.media?.kind === 'image' && q.media.url ? { kind: 'image', url: q.media.url } : null, video: q.media?.kind === 'youtube' };
  if (q.type === 'choice') v.options = q.options.filter((o) => o.text.trim()).map((o, i) => ({ k: tok(o.id), text: o.text, c: q.options.indexOf(o) }));
  if (q.type === 'order') v.items = shuffle(q.items.filter((i) => i.text.trim())).map((i) => ({ k: tok(i.id), text: i.text }));
  if (q.type === 'match') {
    const ps = q.pairs.filter((p) => p.left.trim() && p.right?.value);
    v.left = ps.map((p) => ({ k: tok('L:' + p.id), text: p.left }));
    v.right = shuffle(ps).map((p) => ({ k: tok('R:' + p.id), kind: p.right.kind, value: p.right.value }));
  }
  if (q.type === 'tf') v.options = [{ k: tok('true'), text: 'True', c: 1 }, { k: tok('false'), text: 'False', c: 0 }];
  if (q.type === 'sort') {
    const cats = q.categories.filter((c) => c.name.trim());
    v.categories = cats.map((c) => ({ k: tok('C:' + c.id), name: c.name }));
    v.items = shuffle(q.items.filter((i) => i.text.trim() && cats.some((c) => c.id === i.category))).map((i) => ({ k: tok('I:' + i.id), text: i.text }));
  }
  if (q.type === 'wipeout') {
    const tiles = [...q.right.filter((i) => i.text.trim()).map((i) => ({ k: tok('R:' + i.id), text: i.text })), ...q.wrong.filter((i) => i.text.trim()).map((i) => ({ k: tok('W:' + i.id), text: i.text }))];
    v.board = shuffle(tiles).map((t, i, arr) => ({ ...t, ...scatter(i, arr.length) }));
    v.pickPoints = q.pickPoints ?? 200; v.penalty = q.penalty ?? 500;
  }
  if (q.type === 'race') {
    const good = q.bank.filter((b) => b.text.trim() && b.options[0].trim() && b.options.filter((o) => o.trim()).length >= 2);
    v.bank = good.map((b) => ({ k: tok('Q:' + b.id), text: b.text, options: shuffle(b.options.map((o, oi) => ({ o, oi })).filter((x) => x.o.trim())).map((x, i) => ({ k: tok((x.oi === 0 ? 'R:' : 'W:') + b.id), text: x.o, c: i })) }));
    v.target = q.target || 10; v.prize = q.prize ?? 5000;
  }
  return { view: v, keys };
}

// ------------------------------------------------------------------ the race
function raceStart() {
  G.q.race = { players: {}, winner: null, over: false };
  for (const pid of Object.keys(G.players)) if (present.has(pid)) G.q.race.players[pid] = { idx: 0, correct: 0, wrong: 0, skipped: 0, out: false, done: false };
  persist(); renderRace(); broadcastState();
}
function racePick(pid, answer) {
  const race = G.q.race, v = G.q.view, keys = G.q.keys;
  if (!race || race.over) return;
  const r = race.players[pid] || (race.players[pid] = { idx: 0, correct: 0, wrong: 0, skipped: 0, out: false, done: false });
  if (r.out || r.done) return;
  const idx = +answer?.idx, k = String(answer?.k || '');
  if (idx !== r.idx) return; // a duplicate or a stale pick
  const item = v.bank[idx]; if (!item) return;
  const bid = String(keys[item.k]).slice(2);
  const ok = k === 'skip' ? null : keys[k] === 'R:' + bid;
  if (ok === null) r.skipped++; else if (ok) r.correct++; else r.wrong++;
  r.idx++;
  if (r.correct >= v.target) { r.done = true; r.finishedAt = Date.now(); if (!race.winner) { race.winner = pid; race.over = true; } }
  else if (r.correct + (v.bank.length - r.idx) < v.target) r.out = true;
  send('race', { pid, idx, ok, correct: r.correct, wrong: r.wrong, skipped: r.skipped, out: r.out, done: r.done, idxNext: r.idx });
  persist(); renderRace(); broadcastState();
  if (race.over) setTimeout(() => endQuestion(), 2500);
  else if (Object.values(race.players).every((p) => p.out || p.done)) { race.over = true; setTimeout(() => endQuestion(), 1500); }
}
function raceStandings() {
  const race = G.q.race || { players: {} };
  return Object.entries(race.players).map(([pid, r]) => ({ pid, name: G.players[pid]?.name || 'Player', emoji: G.players[pid]?.emoji || '', ...r }))
    .sort((a, b) => (b.done - a.done) || (b.correct - a.correct) || ((a.finishedAt || Infinity) - (b.finishedAt || Infinity)) || (a.out - b.out));
}
/** A grid with jitter, so the board looks scattered but nothing overlaps. Positions in % of the board. */
function scatter(i, n) {
  const cols = n > 16 ? 5 : n > 9 ? 4 : 3, rows = Math.ceil(n / cols);
  const c = i % cols, r = Math.floor(i / cols);
  const jx = (Math.random() - 0.5) * (60 / cols), jy = (Math.random() - 0.5) * (40 / rows);
  return { x: +(((c + 0.5) / cols) * 100 + jx).toFixed(1), y: +(((r + 0.5) / rows) * 100 + jy).toFixed(1), rot: +((Math.random() - 0.5) * 10).toFixed(1) };
}

// ------------------------------------------------------------------ wipeout: turns
function wipeStart() {
  const q = question();
  const live = Object.keys(G.players).filter((pid) => present.has(pid));
  const order = shuffle(live.length ? live : Object.keys(G.players));
  G.q.wipe = { order, turnPid: null, turnDeadline: 0, gone: [], out: [], scores: {}, picks: [], over: false, last: null, seconds: q.time };
  wipeNextTurn();
}
function wipeNextTurn() {
  const w = G.q.wipe, q = question();
  const candidates = w.order.filter((pid) => !w.out.includes(pid));
  if (!candidates.length) { w.over = true; w.last = { text: 'Nobody left to pick', ok: null }; return endQuestion(); }
  const idx = w.turnPid ? candidates.indexOf(w.turnPid) : -1;
  // After a pick the turn moves on; after a timeout the timed-out player is already out of the list.
  w.turnPid = candidates[(idx + 1) % candidates.length];
  w.turnDeadline = Date.now() + q.time * 1000;
  persist(); renderWipe(); broadcastState(); botWipeTurn();
}
function wipeTimeout() {
  const w = G.q.wipe, pid = w.turnPid;
  w.out.push(pid); w.picks.push({ pid, name: G.players[pid]?.name || 'Player', text: 'ran out of time', ok: null });
  w.last = { name: G.players[pid]?.name, text: 'ran out of time', ok: null };
  const before = w.turnPid; w.turnPid = null;
  // Continue from where the order was, skipping the player who is now out.
  const after = w.order.filter((p) => !w.out.includes(p));
  if (!after.length) { w.over = true; return endQuestion(); }
  const pos = w.order.indexOf(before); let next = null;
  for (let s = 1; s <= w.order.length && !next; s++) { const cand = w.order[(pos + s) % w.order.length]; if (!w.out.includes(cand)) next = cand; }
  w.turnPid = next; w.turnDeadline = Date.now() + question().time * 1000;
  persist(); renderWipe(); broadcastState(); botWipeTurn();
}
function wipePick(pid, token) {
  const w = G.q.wipe, q = question(), v = G.q.view;
  if (!w || w.over || pid !== w.turnPid || w.gone.includes(token)) return;
  const tile = v.board.find((t) => t.k === token); if (!tile) return;
  const ok = String(G.q.keys[token] || '').startsWith('R:');
  w.gone.push(token);
  w.scores[pid] = (w.scores[pid] || 0) + (ok ? (q.pickPoints ?? 200) : -(q.penalty ?? 500));
  w.picks.push({ pid, name: G.players[pid]?.name || 'Player', text: tile.text, ok });
  w.last = { name: G.players[pid]?.name, text: tile.text, ok };
  send('ack', { pid, qId: v.id });
  if (!ok) { w.over = true; persist(); renderWipe(token); broadcastState(); setTimeout(() => endQuestion(), 2200); return; }
  const rightLeft = v.board.some((t) => String(G.q.keys[t.k]).startsWith('R:') && !w.gone.includes(t.k));
  if (!rightLeft) { w.over = true; w.last = { name: null, text: 'All found!', ok: true }; persist(); renderWipe(); broadcastState(); setTimeout(() => endQuestion(), 1500); return; }
  wipeNextTurn();
}
function startQuestion() {
  clearInterval(countT);
  const q = question();
  const { view, keys } = buildView(q);
  const now = Date.now();
  G.q = { view, keys, startedAt: now, deadline: q.type === 'wipeout' ? null : now + q.time * 1000, answers: {}, results: null };
  G.phase = 'question'; persist(); render();
  if (q.type === 'wipeout') wipeStart(); else if (q.type === 'race') raceStart(); else broadcastState();
  startTick(); botsOnQuestion();
}
function startTick() {
  clearInterval(tickT);
  tickT = setInterval(() => {
    if (G.phase !== 'question' || !G.q) return clearInterval(tickT);
    const wipe = G.q.wipe;
    const total = (question().time * 1000), rem = wipe ? wipe.turnDeadline - Date.now() : G.q.deadline - Date.now();
    const t = $('#timer'); if (t) { const p = Math.max(0, rem / total) * 100; t.style.setProperty('--p', p + '%'); t.dataset.s = Math.max(0, Math.ceil(rem / 1000)); t.classList.toggle('low', rem < 5000 && !wipe); }
    if (rem <= 0) { if (wipe) { if (!wipe.over) wipeTimeout(); } else endQuestion(); }
  }, 100);
}
async function endQuestion() {
  if (G.phase !== 'question') return;
  clearInterval(tickT); botClear();
  G.phase = 'grading'; persist(); render(); broadcastState();
  try { G.q.results = await grade(); }
  catch (e) { console.error(e); toast('Scoring hit a snag: ' + e.message, true); G.q.results = await grade(true); }
  for (const [pid, r] of Object.entries(G.q.results.byPlayer)) if (G.players[pid]) G.players[pid].score += r.points;
  G.phase = 'reveal'; persist(); render(); broadcastState();
}
function showScoreboard() { G.phase = 'scoreboard'; persist(); render(); broadcastState(); }
async function finish() {
  G.phase = 'final'; persist(); render(); broadcastState(); confetti();
  const rk = ranked();
  api('save_game', { game: { code: G.code, quiz_id: G.quizId, title: G.quiz.title, questions: total(), started_at: G.startedAt,
    players: rk.map((p, i) => ({ name: p.name, score: p.score, rank: i + 1 })) } }).catch(() => {});
}
function endEarly() { ask('End the game now?', 'The scores so far will be shown as the final result.', 'End game', 'Keep going').then((ok) => { if (ok) { clearInterval(tickT); clearInterval(countT); finish(); } }); }
function playAgain() { unstore(SAVE_KEY); location.reload(); }

// ------------------------------------------------------------------ grading
async function grade(noAi) {
  const q = question(), v = G.q.view, keys = G.q.keys, set = G.quiz.settings, timeMs = q.time * 1000;
  const byPlayer = {}; const stats = { counts: {}, right: 0, answered: 0, pins: [], texts: [] };
  const all = Object.entries(G.q.answers).filter(([pid]) => G.players[pid]);
  // A skip counts as an answer (so the question can close) but scores nothing and takes no part in the type's scoring.
  const entries = all.filter(([pid, a]) => { if (a.answer === 'skip') { byPlayer[pid] = { answered: true, skipped: true, correct: false, partial: 0, points: 0 }; return false; } return true; });
  stats.answered = all.length; stats.skipped = all.length - entries.length;
  if (q.type === 'text') stats.texts = all.filter(([, a]) => a.answer === 'skip').map(([pid]) => ({ name: G.players[pid].name, text: 'skipped', ok: null }));
  const sp = (elapsed) => speedPoints(elapsed, timeMs, set);
  const res = (pid, correct, partial, elapsed, extra = {}) => {
    const frac = correct ? 1 : (q.partial ? partial : 0);
    byPlayer[pid] = { answered: true, correct, partial: correct ? 1 : partial, points: Math.round(sp(elapsed) * frac), ...extra };
    if (correct) stats.right++;
  };

  if (q.type === 'choice' || q.type === 'tf') {
    for (const [pid, a] of entries) { const id = keys[a.answer]; stats.counts[id] = (stats.counts[id] || 0) + 1; res(pid, id === LQ.correctId(q), 0, a.elapsed, { choice: id }); }
  }
  if (q.type === 'sort') {
    const n = v.items.length;
    for (const [pid, a] of entries) {
      const placed = a.answer && typeof a.answer === 'object' ? a.answer : {};
      let hits = 0;
      for (const [it, ct] of Object.entries(placed)) { const I = keys[it], C = keys[ct]; if (!I || !C) continue; const item = q.items.find((x) => 'I:' + x.id === I); if (item && 'C:' + item.category === C) hits++; }
      res(pid, hits === n, hits / n, a.elapsed);
    }
  }
  if (q.type === 'race') {
    const race = G.q.race || { players: {}, winner: null };
    const standings = raceStandings();
    let winner = race.winner;
    if (!winner && standings.length) {
      // Time ran out: the clear leader on right answers takes it; a tie means nobody does.
      const top = standings[0].correct;
      if (top > 0 && standings.filter((s) => s.correct === top).length === 1) winner = standings[0].pid;
    }
    for (const s of standings) { const won = s.pid === winner; byPlayer[s.pid] = { answered: true, correct: won, partial: won ? 1 : 0, points: won ? (v.prize ?? 5000) : 0, raced: true, got: s.correct, out: s.out, done: s.done }; if (won) stats.right++; }
    stats.answered = standings.length;
    stats.standings = standings; stats.winner = winner ? { pid: winner, name: G.players[winner]?.name || 'Player', emoji: G.players[winner]?.emoji || '' } : null;
  }
  if (q.type === 'wipeout') {
    const w = G.q.wipe || { scores: {}, picks: [] };
    for (const [pid, pts] of Object.entries(w.scores)) { byPlayer[pid] = { answered: true, correct: pts > 0, partial: pts > 0 ? 1 : 0, points: pts, wiped: w.picks.some((p) => p.pid === pid && p.ok === false) }; if (pts > 0) stats.right++; }
    stats.answered = Object.keys(w.scores).length;
    stats.picks = w.picks;
  }
  if (q.type === 'text') {
    const accepted = q.answers.filter((s) => s.trim());
    const unsure = [];
    for (const [pid, a] of entries) {
      const text = String(a.answer ?? '').slice(0, 200);
      const m = textMatch(text, accepted);
      if (m === 'unsure') unsure.push({ id: pid, text });
      else res(pid, m === 'right', 0, a.elapsed, { text, how: 'match' });
    }
    if (unsure.length) {
      let verdicts = null;
      if (q.ai !== false && !noAi) { try { verdicts = (await api('check_text', { question: q.text, accepted, answers: unsure }, { timeout: 45000 })).results; } catch (e) { toast('AI check unavailable — using closest match.', true); } }
      for (const u of unsure) {
        const a = G.q.answers[u.id];
        const ok = verdicts?.[u.id] ? verdicts[u.id].correct : accepted.some((acc) => similarity(LQ.normText(u.text), LQ.normText(acc)) >= 0.72);
        res(u.id, ok, 0, a.elapsed, { text: u.text, how: verdicts?.[u.id]?.how || 'fuzzy' });
      }
    }
    stats.texts = entries.map(([pid]) => ({ name: G.players[pid].name, text: byPlayer[pid].text, ok: byPlayer[pid].correct })).concat(stats.texts || []);
  }
  if (q.type === 'order') {
    const right = q.items.filter((i) => i.text.trim()).map((i) => i.id);
    for (const [pid, a] of entries) {
      const got = Array.isArray(a.answer) ? a.answer.map((t) => keys[t]) : [];
      let hits = 0; right.forEach((id, i) => { if (got[i] === id) hits++; });
      res(pid, hits === right.length && got.length === right.length, hits / right.length, a.elapsed);
    }
  }
  if (q.type === 'match') {
    const n = v.left.length;
    for (const [pid, a] of entries) {
      const pairs = a.answer && typeof a.answer === 'object' ? a.answer : {};
      let hits = 0;
      for (const [lt, rt] of Object.entries(pairs)) { const L = keys[lt], R = keys[rt]; if (L && R && L.slice(2) === R.slice(2)) hits++; }
      res(pid, hits === n, hits / n, a.elapsed);
    }
  }
  if (q.type === 'pin') {
    const asp = G.aspect || 1;
    const dist = (p) => Math.hypot((p.x - q.pin.x), (p.y - q.pin.y) * asp);
    const list = [];
    for (const [pid, a] of entries) {
      const p = a.answer && isFinite(a.answer.x) && isFinite(a.answer.y) ? { x: LQ.clamp(+a.answer.x, 0, 1), y: LQ.clamp(+a.answer.y, 0, 1) } : null;
      if (!p) { byPlayer[pid] = { answered: true, correct: false, partial: 0, points: 0 }; continue; }
      const d = dist(p);
      const acc = d <= q.radiusFull ? 1 : d >= q.radiusZero ? 0 : 1 - (d - q.radiusFull) / (q.radiusZero - q.radiusFull);
      byPlayer[pid] = { answered: true, correct: d <= q.radiusFull, partial: +acc.toFixed(3), points: Math.round(sp(a.elapsed) * acc), pin: p, d };
      if (byPlayer[pid].correct) stats.right++;
      list.push({ pid, name: G.players[pid].name, d, ...p });
    }
    list.sort((a, b) => a.d - b.d);
    if (list.length) { byPlayer[list[0].pid].closest = true; }
    stats.pins = list;
  }
  for (const p of players()) if (!byPlayer[p.id]) byPlayer[p.id] = { answered: false, correct: false, partial: 0, points: 0 };
  return { byPlayer, stats };
}

/** The Wipeout board and whose turn it is. Re-drawn on every turn; `boomToken` flashes the wrong pick. */
function renderWipe(boomToken) {
  const q = question(), v = G.q.view, w = G.q.wipe;
  const lastHtml = w?.last ? `<span class="last ${w.last.ok === true ? 'ok' : w.last.ok === false ? 'no' : ''}">${w.last.name ? esc(w.last.name) + ': ' : ''}${esc(w.last.text)}${w.last.ok === true ? ' ✔' : w.last.ok === false ? ' ✘ Wiped out!' : ''}</span>` : '';
  const turn = !w ? '' : w.over ? `<div class="turnbar">${lastHtml || '<span>Round over</span>'}</div>` : `<div class="turnbar"><span>Your pick,</span><span class="who">${esc(G.players[w.turnPid]?.name || '…')}</span>${lastHtml}</div>`;
  const found = w ? w.gone.filter((k) => String(G.q.keys[k]).startsWith('R:')).length : 0, totalRight = v.board.filter((t) => String(G.q.keys[t.k]).startsWith('R:')).length;
  stage.innerHTML = `${topBar(`<div class="pillbox"><span class="hpill">${found} of ${totalRight} found</span><div class="timer" id="timer" data-s="${q.time}" style="--p:100%"></div></div>`)}
    <div class="stage-main" style="gap:8px"><h1 class="qtext" style="font-size:clamp(1.3rem,2.6vw,2.2rem)">${esc(q.text)}</h1>${turn}
      <div class="wboard">${v.board.map((t) => `<div class="wtile ${w?.gone.includes(t.k) ? (t.k === boomToken ? 'boom' : 'gone') : ''}" style="left:${t.x}%;top:${t.y}%;--r:${t.rot}deg">${esc(t.text)}</div>`).join('')}</div></div>
    ${hostBar(`<button class="btn btn-ghost" data-act="end">End game</button><button class="btn btn-primary" data-act="primary">Stop the round ■</button>`)}`;
  bind();
}
function renderGrading() {
  stage.innerHTML = `${topBar()}<div class="stage-main"><h1 class="big">Time's up!</h1><p style="font-size:1.4rem;font-weight:800"><span class="spinner"></span> &nbsp;Checking the answers…</p></div>`;
}
function renderReveal() {
  const q = question(), v = G.q.view, R = G.q.results, n = players().length;
  let body = '';
  if (q.type === 'sort') body = `<div class="cats">${q.categories.filter((c) => c.name.trim()).map((c) => `<div class="cat"><h3>${esc(c.name)}</h3>${q.items.filter((i) => i.category === c.id && i.text.trim()).map((i) => `<div class="item ok">${esc(i.text)}</div>`).join('')}</div>`).join('')}</div>`;
  if (q.type === 'race') { const st = R.stats; body = `<div class="turnbar">${st.winner ? `<span class="who">🏆 ${st.winner.emoji || ''} ${esc(st.winner.name)} wins ${v.prize} points</span>` : '<span>Nobody finished — no prize this time</span>'}</div>` + trackHtml(st.standings || [], v.target, st.winner?.pid); }
  if (q.type === 'wipeout') {
    const w = G.q.wipe || { picks: [] };
    body = `<div class="wboard" style="height:52vh">${v.board.map((t) => `<div class="wtile ${String(G.q.keys[t.k]).startsWith('R:') ? 'right' : 'wrong'} ${w.gone?.includes(t.k) ? 'gone' : ''}" style="left:${t.x}%;top:${t.y}%;--r:${t.rot}deg">${esc(t.text)}</div>`).join('')}</div>
      <div class="textlist mt">${(R.stats.picks || []).map((p) => `<span class="tl ${p.ok === true ? 'ok' : p.ok === false ? 'no' : ''}">${esc(p.name)}: ${esc(p.text)}</span>`).join('')}</div>`;
  }
  if (q.type === 'choice' || q.type === 'tf') {
    const max = Math.max(1, ...Object.values(R.stats.counts));
    body = `<div class="answers">${v.options.map((o) => { const id = G.q.keys[o.k], c = R.stats.counts[id] || 0, ok = id === LQ.correctId(q); return `<div class="ans ${ok ? '' : 'dim'}" style="background:${COLORS[o.c].hex}"><div class="bar" style="width:${(c / max) * 100}%"></div><span class="shape" style="position:relative">${COLORS[o.c].shape}</span><span style="position:relative">${esc(o.text)}</span><span class="count" style="position:relative">${c}</span>${ok ? '<span class="tick" style="position:relative">✔</span>' : ''}</div>`; }).join('')}</div>`;
  }
  if (q.type === 'text') {
    body = `<div class="item ok" style="justify-content:center;font-size:1.8rem">✔ ${esc(q.answers[0])}${q.answers.length > 1 ? `<span style="opacity:.7;font-size:.7em"> (or ${esc(q.answers.slice(1, 4).join(', '))})</span>` : ''}</div>
      <div class="textlist mt">${R.stats.texts.slice(0, 30).map((t) => `<span class="tl ${t.ok === null ? '' : t.ok ? 'ok' : 'no'}">${esc(t.text || '—')} <span style="opacity:.7;font-size:.85em">· ${esc(t.name)}</span></span>`).join('')}</div>`;
  }
  if (q.type === 'order') body = `<div class="items">${q.items.filter((i) => i.text.trim()).map((it, i) => `<div class="item ok"><span class="k">${i + 1}</span>${esc(it.text)}</div>`).join('')}</div>`;
  if (q.type === 'match') body = `<div class="items">${q.pairs.filter((p) => p.left.trim() && p.right?.value).map((p) => `<div class="item ok">${esc(p.left)} ⇄ ${p.right.kind === 'image' ? `<img src="${esc(p.right.value)}">` : esc(p.right.value)}</div>`).join('')}</div>`;
  if (q.type === 'pin') {
    const best = R.stats.pins[0];
    body = `<div class="center"><div class="pinboard" id="pinboard"><img src="${esc(q.media.url)}"></div>
      <div class="mt">${best ? `<span class="badge-closest">🎯 Closest: ${esc(best.name)}</span>` : '<span class="muted">Nobody dropped a pin.</span>'}${q.place ? ` &nbsp; <span style="font-weight:800">It was ${esc(q.place)}</span>` : ''}</div></div>`;
  }
  const media = q.type === 'pin' ? '' : (q.media?.kind === 'image' ? mediaHtml(q, false) : '');
  const inMain = q.type === 'pin' || q.type === 'wipeout' || q.type === 'race';
  stage.innerHTML = `${topBar(`<span class="hpill">${q.type === 'wipeout' ? `${R.stats.right} scored` : q.type === 'race' ? `${(R.stats.standings || []).filter((s) => s.done).length} finished` : `${R.stats.right} of ${n} got it right${R.stats.skipped ? ` · ${R.stats.skipped} skipped` : ''}`}</span>`)}
    <div class="stage-main"><h1 class="qtext"${inMain && q.type !== 'pin' ? ' style="font-size:clamp(1.3rem,2.6vw,2.2rem)"' : ''}>${esc(q.text)}</h1>${inMain ? body : media}</div>
    ${inMain ? '' : `<div>${body}</div>`}
    ${hostBar(`<button class="btn btn-ghost" data-act="end">End game</button><button class="btn btn-primary" data-act="primary">Scores ▶</button>`)}`;
  if (q.type === 'pin') drawPins();
  bind();
}
function drawPins() {
  const q = question(), R = G.q.results, board = $('#pinboard'), img = $('img', board);
  const draw = () => {
    const w = img.clientWidth, h = img.clientHeight; if (!w) return;
    $$('.pp, .target', board).forEach((e) => e.remove());
    R.stats.pins.forEach((p, i) => { const el = document.createElement('div'); el.className = 'pp' + (i === 0 ? ' best' : ''); el.style.left = p.x * w + 'px'; el.style.top = p.y * h + 'px'; el.textContent = p.name.slice(0, 2).toUpperCase(); el.title = p.name; board.appendChild(el); });
    const t = document.createElement('div'); t.className = 'target'; t.style.left = q.pin.x * w + 'px'; t.style.top = q.pin.y * h + 'px';
    t.innerHTML = `<svg viewBox="0 0 24 24" width="34" height="34"><path fill="#e21b3c" stroke="#fff" stroke-width="1.5" d="M12 1.5a7.5 7.5 0 0 0-7.5 7.5c0 5.6 7.5 13.5 7.5 13.5S19.5 14.6 19.5 9A7.5 7.5 0 0 0 12 1.5z"/><circle cx="12" cy="9" r="3" fill="#fff"/></svg>`;
    board.appendChild(t);
  };
  img.onload = draw; if (img.complete) draw(); window.onresize = draw;
}
function renderScoreboard() {
  const rk = ranked().slice(0, 8), top = Math.max(1, rk[0]?.score || 1), R = G.q?.results?.byPlayer || {};
  stage.innerHTML = `${topBar()}<div class="stage-main"><h1 class="big" style="font-size:2.6rem">Scoreboard</h1><div class="board">${rk.map((p, i) => `<div class="brow"><div class="fill" data-w="${(p.score / top) * 100}"></div><div class="rank">${i + 1}</div><div>${p.emoji ? p.emoji + ' ' : ''}${esc(p.name)}${R[p.id]?.points ? `<span class="delta" ${R[p.id].points < 0 ? 'style="color:#ffb3c0"' : ''}>${R[p.id].points > 0 ? '+' : ''}${R[p.id].points}</span>` : ''}</div><div>${p.score}</div></div>`).join('')}</div></div>
    ${hostBar(`<button class="btn btn-ghost" data-act="end">End game</button><button class="btn btn-primary" data-act="primary">${G.qIndex + 1 < total() ? 'Next question ▶' : 'Final results 🏆'}</button>`)}`;
  requestAnimationFrame(() => $$('.fill').forEach((f) => f.style.width = f.dataset.w + '%'));
  bind();
}
function renderFinal() {
  const rk = ranked();
  const pod = (i, cls) => rk[i] ? `<div class="pod ${cls}"><div class="name">${rk[i].emoji ? `<div style="font-size:1.6em">${rk[i].emoji}</div>` : ''}${esc(rk[i].name)}</div><div class="score">${rk[i].score} pts</div><div class="block">${i + 1}</div></div>` : '';
  stage.innerHTML = `<div class="stage-top"><div class="pillbox"><span class="hpill">${esc(G.quiz.title)}</span><span class="hpill">Final results</span></div></div>
    <div class="stage-main"><h1 class="big" style="font-size:2.6rem">🏆 ${rk[0] ? esc(rk[0].name) + ' wins!' : 'Game over'}</h1>
      <div class="podium">${pod(1, 'p2')}${pod(0, 'p1')}${pod(2, 'p3')}</div>
      ${rk.length > 3 ? `<div class="textlist">${rk.slice(3, 15).map((p, i) => `<span class="tl">${i + 4}. ${esc(p.name)} · ${p.score}</span>`).join('')}</div>` : ''}</div>
    ${hostBar(`<button class="btn btn-ghost" data-act="builder">Back to builder</button><button class="btn btn-primary" data-act="again">Play again ↻</button>`)}`;
  bind();
}
function confetti() {
  const c = $('#confetti'); c.classList.remove('hidden'); c.innerHTML = '';
  const cols = ['#e21b3c', '#1368ce', '#ffd54a', '#26890c', '#fff', '#ff7ab6'];
  for (let i = 0; i < 140; i++) { const s = document.createElement('i'); s.style.left = Math.random() * 100 + 'vw'; s.style.background = cols[i % cols.length]; s.style.animationDuration = (2.5 + Math.random() * 3) + 's'; s.style.animationDelay = Math.random() * 2 + 's'; s.style.transform = `rotate(${Math.random() * 360}deg)`; c.appendChild(s); }
  setTimeout(() => c.classList.add('hidden'), 9000);
}
document.addEventListener('keydown', (e) => {
  if (e.target.matches('input, textarea')) return;
  if (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowRight') { e.preventDefault(); if (!document.querySelector('.modal-bg')) primaryAction(); }
});
window.addEventListener('beforeunload', (e) => { if (G && G.phase !== 'lobby' && G.phase !== 'final') { e.preventDefault(); e.returnValue = ''; } });
</script>
</body>
