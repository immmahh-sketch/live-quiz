<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Let's Quiz! — Host</title>
<link rel="icon" type="image/png" sizes="64x64" href="assets/brand/icon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body class="host">
<div class="stage" id="stage"><div class="stage-main"><span class="spinner"></span></div></div>
<div class="confetti hidden" id="confetti"></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="assets/common.js"></script>
<script src="assets/dpad.js"></script>
<script src="assets/demo-quiz.js"></script>
<script>
const { $, $$, esc, uid, api, TYPES, COLORS, speedPoints, textMatch, similarity, shuffle, newCode, playUrl, shortPlayUrl, store, unstore, ordinal } = LQ;
const DEMO = new URLSearchParams(location.search).get('quiz') === 'demo';
// On a TV (the Fire TV app, or ?tv=1): D-pad focus ring, self-play on, Back goes to the TV home.
const TV = new URLSearchParams(location.search).get('tv') === '1' || /LetsQuizTV/.test(navigator.userAgent);
if (TV) document.body.classList.add('tv');
const quizId = new URLSearchParams(location.search).get('quiz');
const SAVE_KEY = 'lq_live_' + quizId;
const stage = $('#stage');
let G = null, ch = null, sb = null, tickT = null, hbT = null, countT = null, helloT = null;
const present = new Map(); // pid -> name, from presence

let toastT;
/** Test by myself: three bots for company and a player panel docked on this page (play.html in an iframe, joined as "Me"). */
function toggleSolo() {
  if (G.solo) { G.solo = false; document.body.classList.remove('solo'); $('#solopanel')?.remove(); renderLobby(); return; }
  G.solo = true; document.body.classList.add('solo');
  if (!G.bots?.length) addBots(3);
  const p = document.createElement('div'); p.id = 'solopanel'; p.className = 'solopanel';
  p.innerHTML = `<div class="solohead"><b>🧪 You, as a player</b><button class="btn btn-ghost btn-sm" id="soloClose">Close</button></div><iframe src="play?g=${G.code}&solo=1" allow="camera"></iframe>`;
  document.body.appendChild(p);
  $('#soloClose').onclick = toggleSolo;
  renderLobby();
}
/** After a test run: every question goes back into the bank as unused (AI-written ones are added) and the quiz is deleted. Two presses, so a stray click on the remote does nothing. */
async function returnToBank() {
  const b = $('[data-act="restock"]'); if (!b || !G.quizId) return;
  if (!b.dataset.armed) { b.dataset.armed = '1'; b.textContent = 'Press again to return them and delete this quiz'; b.classList.add('on'); setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = '↩ Return questions to the bank'; b.classList.remove('on'); } }, 6000); return; }
  b.disabled = true; b.textContent = 'Returning…';
  try {
    const r = await api('bank_restock', { id: G.quizId });
    const n = Object.values(r.result || {}).reduce((a, v) => a + (v.restored || 0) + (v.added || 0), 0);
    toast(`${n} question${n === 1 ? '' : 's'} back in the bank. The quiz has been deleted.`);
    b.remove(); $$('[data-act="again"]').forEach((x) => x.remove());
  } catch (e) { toast(e.message, true); b.disabled = false; b.textContent = '↩ Return questions to the bank'; }
}
function toast(msg, bad) { const t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (bad ? ' bad' : ''); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3000); }
const persist = () => store(SAVE_KEY, G);
const players = () => Object.values(G.players);
const ranked = () => players().slice().sort((a, b) => b.score - a.score || a.joinedAt - b.joinedAt);
const isSlide = (q) => q?.type === 'slide';
/** How many questions the game has; slides are not counted. */
const total = () => G.quiz.questions.filter((q) => !isSlide(q)).length;
/** The question number of item i, not counting slides. */
const qNum = (i) => G.quiz.questions.slice(0, i + 1).filter((q) => !isSlide(q)).length;
const question = () => G.quiz.questions[G.qIndex];
/** A practice question (or a question in a practice round): played in full, scores nothing. */
const practiceQ = (i = G.qIndex) => LQ.isPractice(G.quiz, G.quiz.questions[i]);
const roundOf = (i) => { const q = G.quiz.questions[i]; const ri = G.quiz.rounds.findIndex((r) => r.id === q?.round); return ri < 0 ? null : { n: ri + 1, ...G.quiz.rounds[ri], count: G.quiz.questions.filter((x) => x.round === q.round).length }; };
const startsRound = (i) => i === 0 || G.quiz.questions[i - 1]?.round !== G.quiz.questions[i]?.round;

// ------------------------------------------------------------------ boot
(async function boot() {
  if (!quizId) return fail('No quiz chosen. Open a quiz in the builder and press Host.');
  if (!DEMO && !LQ.hostPassword()) { location.href = 'index.html'; return; }
  const saved = store(SAVE_KEY);
  if (saved && saved.phase !== 'final' && saved.phase !== 'lobby' && Object.keys(saved.players).length) {
    const ok = await ask(`Carry on the game in progress?`, `Game ${saved.code} — ${Object.keys(saved.players).length} players, question ${saved.qIndex + 1} of ${saved.quiz.questions.length}.`, 'Carry on', 'Start fresh');
    if (ok) { G = saved; return connect(); }
  }
  let quiz;
  if (DEMO) quiz = JSON.parse(JSON.stringify(window.DEMO_QUIZ));
  else { try { quiz = (await api('get', { id: quizId })).quiz; } catch (e) { return fail(e.message); } }
  quiz = LQ.normalizeQuiz(quiz);
  quiz.questions = quiz.questions.filter((q) => LQ.validate(q).length === 0);
  quiz.rounds = quiz.rounds.filter((r) => quiz.questions.some((q) => q.round === r.id));
  if (!quiz.questions.length) return fail('This quiz has no finished questions to play.');
  G = { code: newCode(), quizId, quiz, phase: 'lobby', qIndex: -1, players: {}, startedAt: null, q: null, bots: [], auto: autoWanted() };
  persist();
  connect();
  if (musicOn()) loadYT().catch(() => {});
  const nb = +new URLSearchParams(location.search).get('bots');
  if (nb > 0) setTimeout(() => addBots(Math.min(MAX_BOTS, nb)), 0);
})();

// ------------------------------------------------------------------ test mode: bots
//
// Simulated players that live inside this page. They join like phones do, answer every
// question type after a realistic pause with a skill level, take their Wipeout turns and
// run the race — all through the same handlers a real phone's message would reach, so a
// game with bots exercises exactly the code a real game does.
const BOT_NAMES = [['Ada', '🦉'], ['Bo', '👾'], ['Cy', '🐙'], ['Dee', '🦖'], ['Eli', '🐸'], ['Fen', '🐼'], ['Gus', '🦄'], ['Ivy', '🐨'], ['Jax', '🦊'], ['Kit', '🐯'], ['Lou', '🐧'], ['Max', '🦁'], ['Nia', '🐝'], ['Oz', '🐢'], ['Pip', '🐹'], ['Quin', '🦋'], ['Rex', '🐶'], ['Sky', '🐬'], ['Tam', '🦩'], ['Uma', '🐰']];
const MAX_BOTS = BOT_NAMES.length;
const BOT_SKILL = [0.85, 0.65, 0.5, 0.75, 0.6, 0.55, 0.7, 0.8, 0.45, 0.9, 0.6, 0.7, 0.5, 0.65, 0.8, 0.55, 0.75, 0.4, 0.7, 0.6];
const BOT_PACE = [0.35, 0.6, 0.9, 0.5, 0.7, 0.8, 0.45, 0.65, 0.85, 0.4, 0.55, 0.75, 0.6, 0.95, 0.5, 0.7, 0.3, 0.8, 0.65, 0.55];
function addBots(n) {
  G.bots = G.bots || [];
  for (let i = 0; i < n && G.bots.length < MAX_BOTS; i++) {
    const [nm, em] = BOT_NAMES[G.bots.length];
    const bot = { pid: 'p_bot' + (G.bots.length + 1) + nm.toLowerCase().padEnd(4, 'x'), name: 'Bot ' + nm, emoji: em, skill: BOT_SKILL[G.bots.length], pace: BOT_PACE[G.bots.length] };
    G.bots.push(bot); present.set(bot.pid, bot.name);
    onHello({ pid: bot.pid, name: bot.name, emoji: bot.emoji });
  }
  persist(); if (G.phase === 'lobby') renderLobby();
}
const botTimers = [];
function botLater(fn, ms) { botTimers.push(setTimeout(fn, ms)); }
function botClear() { while (botTimers.length) clearTimeout(botTimers.pop()); }
const rnd = (a, b) => a + Math.random() * (b - a);
const chance = (p) => Math.random() < p;
/** Called when a question goes live: every bot schedules its answer. */
function botsOnQuestion() {
  botClear();
  if (!G.bots?.length || !G.q) return;
  const q = question(), v = G.q.view;
  if (q.type === 'wipeout') return botWipeTurn(); // and again on every later turn (wipeNextTurn / wipeTimeout)
  if (q.type === 'race') { for (const b of G.bots) botRaceStep(b); return; }
  for (const b of G.bots) {
    const delay = 1200 + b.pace * q.time * 1000 * rnd(0.25, 0.8);
    if (q.type === 'highlow' && chance(0.5)) botLater(() => { if (G.phase === 'question' && G.q?.view.id === v.id) onHint({ pid: b.pid, qId: v.id }); }, Math.max(800, delay * 0.5));
    botLater(() => { if (G.phase === 'question' && G.q?.view.id === v.id) onAnswer({ pid: b.pid, qId: v.id, answer: chance(0.07) ? 'skip' : botAnswer(b, q, v) }); }, Math.min(delay, q.time * 1000 - 800));
  }
}
function botAnswer(b, q, v) {
  const keys = G.q.keys, inv = {}; for (const [t, id] of Object.entries(keys)) inv[id] = t;
  const ok = chance(b.skill);
  if (q.type === 'choice' || q.type === 'tf') {
    const right = v.options.find((o) => keys[o.k] === LQ.correctId(q));
    const others = v.options.filter((o) => o !== right);
    return (ok || !others.length ? right : others[Math.floor(Math.random() * others.length)]).k;
  }
  if (q.type === 'text' || q.type === 'smash' || q.type === 'wheel' || q.type === 'highlow' || q.type === 'rhyme' || q.type === 'club' || q.type === 'dingbat' || q.type === 'tune') {
    if (ok) { const a = q.type === 'smash' ? q.smash : q.type === 'wheel' ? q.phrase : q.type === 'rhyme' ? `${q.answer1} ${q.answer2}` : q.answers[0]; return chance(0.3) && a.length > 4 ? a.slice(0, -1) + a.slice(-1).toLowerCase() + (chance(0.5) ? 'e' : '') : a; }
    return ['Pass', 'Not sure', 'Bob', 'Paris', '1966', 'The other one'][Math.floor(Math.random() * 6)];
  }
  if (q.type === 'pin' && q.mode === 'area') {
    const t = q.target || { x: 0.4, y: 0.4, w: 0.2, h: 0.2 };
    return ok ? { x: t.x + t.w * rnd(0.1, 0.9), y: t.y + t.h * rnd(0.1, 0.9) } : { x: rnd(0, 1), y: rnd(0, 1) };
  }
  if (q.type === 'order') {
    const right = q.items.filter((i) => i.text.trim()).map((i) => inv[i.id]);
    if (ok) return right;
    const r = right.slice(); const i = Math.floor(Math.random() * (r.length - 1)); [r[i], r[i + 1]] = [r[i + 1], r[i]]; return r;
  }
  if (q.type === 'match') {
    const out = {}; const rights = v.right.slice();
    for (const l of v.left) { const pid = keys[l.k].slice(2); const good = rights.find((r) => keys[r.k] === 'R:' + pid); const pick = chance(b.skill) && good ? good : rights[Math.floor(Math.random() * rights.length)]; out[l.k] = pick.k; rights.splice(rights.indexOf(pick), 1); }
    return out;
  }
  if (q.type === 'sort') {
    const out = {};
    for (const it of v.items) { const item = q.items.find((x) => 'I:' + x.id === keys[it.k]); const good = v.categories.find((c) => keys[c.k] === 'C:' + item.category); out[it.k] = (chance(b.skill) ? good : v.categories[Math.floor(Math.random() * v.categories.length)]).k; }
    return out;
  }
  if (q.type === 'pin') {
    const spread = ok ? q.radiusFull * 0.8 : q.radiusZero * rnd(0.5, 1.6);
    const ang = rnd(0, Math.PI * 2);
    return { x: LQ.clamp(q.pin.x + Math.cos(ang) * spread * rnd(0, 1), 0, 1), y: LQ.clamp(q.pin.y + Math.sin(ang) * spread * rnd(0, 1) / (G.aspect || 1), 0, 1) };
  }
  return null;
}
/** Wipeout: when the turn lands on a bot, it picks after a pause — usually a right one. */
function botWipeTurn() {
  const w = G.q?.wipe; if (!w || w.over) return;
  const b = (G.bots || []).find((x) => x.pid === w.turnPid); if (!b) return;
  const turnAt = w.turnDeadline;
  botLater(() => {
    if (G.phase !== 'question' || !G.q?.wipe || G.q.wipe.turnDeadline !== turnAt || G.q.wipe.over) return;
    const left = G.q.view.board.filter((t) => !G.q.wipe.gone.includes(t.k));
    const rights = left.filter((t) => String(G.q.keys[t.k]).startsWith('R:')), wrongs = left.filter((t) => !String(G.q.keys[t.k]).startsWith('R:'));
    const pool = chance(0.08 + (1 - b.skill) * 0.3) && wrongs.length ? wrongs : (rights.length ? rights : left);
    if (pool.length) onAnswer({ pid: b.pid, qId: G.q.view.id, answer: pool[Math.floor(Math.random() * pool.length)].k });
  }, rnd(900, Math.max(1200, question().time * 1000 * 0.7)));
}
/** The race: each bot answers its current question every few seconds until it is done or out. */
function botRaceStep(b) {
  botLater(() => {
    const race = G.q?.race; if (G.phase !== 'question' || !race || race.over) return;
    const r = race.players[b.pid]; if (!r || r.out || r.done) return;
    const item = G.q.view.bank[r.idx]; if (!item) return;
    const bid = String(G.q.keys[item.k]).slice(2);
    const right = item.options.find((o) => G.q.keys[o.k] === 'R:' + bid), others = item.options.filter((o) => o !== right);
    const k = chance(0.08) ? 'skip' : (chance(b.skill) || !others.length) ? right.k : others[Math.floor(Math.random() * others.length)].k;
    racePick(b.pid, { idx: r.idx, k });
    botRaceStep(b);
  }, rnd(1500, 2500) + b.pace * 3000);
}
function fail(msg) { stage.innerHTML = `<div class="stage-main"><h1 class="big">Hmm.</h1><p style="font-size:1.3rem">${esc(msg)}</p><a class="btn btn-primary" href="index.html">Back to the builder</a></div>`; }
function ask(title, body, yes, no) {
  return new Promise((res) => {
    const bg = document.createElement('div'); bg.className = 'modal-bg';
    bg.innerHTML = `<div class="modal" style="color:var(--ink)"><h3>${esc(title)}</h3><p class="muted">${esc(body)}</p><div class="row" style="justify-content:flex-end"><button class="btn btn-ghost" data-no style="color:var(--ink)">${esc(no)}</button><button class="btn btn-primary" data-yes style="background:var(--brand);color:#fff">${esc(yes)}</button></div></div>`;
    document.body.appendChild(bg);
    $('[data-no]', bg).onclick = () => { bg.remove(); res(false); };
    $('[data-yes]', bg).onclick = () => { bg.remove(); res(true); };
  });
}

// ------------------------------------------------------------------ realtime
function connect() {
  sb = LQ.client();
  ch = sb.channel('quiz-' + G.code, { config: { broadcast: { self: false }, presence: { key: 'host' } } });
  ch.on('broadcast', { event: 'hello' }, ({ payload }) => onHello(payload));
  ch.on('broadcast', { event: 'answer' }, ({ payload }) => onAnswer(payload));
  ch.on('broadcast', { event: 'ctrl' }, ({ payload }) => onCtrl(payload || {}));
  ch.on('broadcast', { event: 'hint' }, ({ payload }) => onHint(payload || {}));
  ch.on('presence', { event: 'sync' }, () => {
    present.clear();
    for (const entries of Object.values(ch.presenceState())) for (const e of entries) if (e.role === 'player' && e.pid) present.set(e.pid, e.name);
    for (const b of G.bots || []) present.set(b.pid, b.name);
    if (G.phase === 'lobby') renderLobbyPlayers();
    if (G.phase === 'question') { renderAnswered(); maybeAllAnswered(); }
  });
  ch.subscribe(async (status) => {
    if (status === 'SUBSCRIBED') { await ch.track({ role: 'host' }); render(); broadcastState(); startHeartbeat(); if (G.phase === 'question') startTick(); }
    else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') toast('Connection trouble — retrying…', true);
  });
}
function send(event, payload) { if (ch && ch.state === 'joined') ch.send({ type: 'broadcast', event, payload }); }
function startHeartbeat() { clearInterval(hbT); hbT = setInterval(broadcastState, 2000); }

/** Everything a phone needs to draw its screen. Never the right answers. */
function stateForPlayers() {
  const s = { phase: G.phase, code: G.code, qIndex: G.qIndex, num: qNum(G.qIndex), practice: G.qIndex >= 0 && practiceQ(), total: total(), more: G.qIndex + 1 < G.quiz.questions.length, title: G.quiz.title, now: Date.now(), auto: !!G.auto, paused: !!G.paused };
  const nowT = G.paused ? G.pausedAt : Date.now(); // a paused clock reads the same until it is picked up again
  if (G.phase === 'slide') { const q = question(); s.slide = { title: q.text || '', body: q.body || '', image: q.media?.kind === 'image' ? q.media.url || '' : '' }; if (G.brk) s.brk = { remainingMs: Math.max(0, G.brk.endsAt - nowT), totalMs: G.brk.totalMs }; }
  if (G.phase === 'question' && G.q) {
    s.q = G.q.view; s.remainingMs = Math.max(0, (G.q.deadline || 0) - nowT); s.answered = Object.keys(G.q.answers);
    if (G.q.wipe) { const w = G.q.wipe; s.wipe = { turnPid: w.turnPid, turnName: G.players[w.turnPid]?.name || '', remainingMs: Math.max(0, (w.studyUntil || w.turnDeadline) - nowT), studyMs: w.studyUntil ? Math.max(0, w.studyUntil - nowT) : 0, gone: w.gone, out: w.out, over: w.over, last: w.last, scores: w.scores, order: w.order.filter((p) => !w.out.includes(p)) }; }
    if (G.q.potato) { const p = G.q.potato, q = question(); s.potato = { holder: p.holder, stage: p.stage, row: p.stage === 'answer' && !p.exploded ? rowForPhone(potatoRow(p), p.row) : null, players: livePids().map((x) => ({ pid: x, name: pname(x), emoji: pem(x) })), passes: p.passes, last: p.last, exploded: p.exploded, scores: p.scores, penalty: q.penalty ?? 300, perCorrect: q.perCorrect ?? 50 }; }
    if (G.q.koth) {
      const g = G.q.koth, q = question(), frow = g.fff ? kothRow(g.fff.row) : null, hrow = g.h2h ? kothRow(g.h2h.row) : null;
      s.koth = { step: g.step, remainingMs: g.until ? Math.max(0, g.until - nowT) : 0, totalMs: g.total, target: q.target || 3, prize: q.prize ?? 1000, pts: g.pts, king: g.king, pair: g.pair, judges: kothJudges(), result: g.result, winner: g.winner,
        fff: frow && (g.step === 'fff' || g.step === 'fffShow') ? { row: rowForPhone(frow, g.next), eligible: g.fff.eligible, answered: Object.keys(g.fff.answered), through: g.fff.through, need: g.fff.need, right: g.step === 'fffShow' ? frow.right : null } : null,
        h2h: hrow && ['h2h', 'noBuzz', 'answer', 'claxon', 'judge', 'result'].includes(g.step) ? { text: hrow.text, buzz: g.h2h.buzz, answer: ['noBuzz', 'judge', 'result'].includes(g.step) ? hrow.right : null } : null };
    }
    if (G.q.bb) {
      const g = G.q.bb, q = question();
      s.bb = { step: g.step, remainingMs: g.until ? Math.max(0, g.until - nowT) : 0, totalMs: g.total, teams: q.teams, teamOf: g.teams, hexes: g.hexes.map((h, i) => ({ letter: h.letter, owner: g.owner[i] })), picker: g.picker, hot: g.hot, letter: g.hot >= 0 ? g.hexes[g.hot]?.letter : '', text: g.step === 'ask' ? G.q.rows[g.hexes[g.hot].row].text : '', answered: Object.keys(g.answered), claim: g.claim, winner: g.winner, path: g.path, scores: g.scores, prize: q.prize ?? 500 };
    }
    if (G.q.chase) {
      const g = G.q.chase, q = question(), row = g.row ? chaseRow(g) : null;
      s.chase = { step: g.step, remainingMs: g.until ? Math.max(0, g.until - nowT) : 0, totalMs: g.total, chaser: g.chaser, team: g.team, teamSteps: g.teamSteps, chaserSteps: g.chaserSteps, headStart: q.headStart ?? 2, target: q.target || 5, teamPrize: q.teamPrize ?? 1000, chaserPrize: q.chaserPrize ?? 200,
        row: g.step === 'q' && row ? rowForPhone(row, g.next) : null, answered: Object.keys(g.answered), first: g.first, right: g.step === 'show' && row ? row.right : null, result: g.result };
    }
    if (s.potato || s.koth || s.bb || s.chase) s.names = Object.fromEntries(Object.values(G.players).map((p) => [p.id, { name: p.name, emoji: p.emoji || '' }]));
    if (G.q.race) { const r = G.q.race; s.race = { winner: r.winner, winnerName: r.winner ? G.players[r.winner]?.name : null, over: r.over, target: G.q.view.target, maxWrong: G.q.view.maxWrong ?? 10, players: Object.fromEntries(Object.entries(r.players).map(([pid, p]) => [pid, { idx: p.idx, correct: p.correct, wrong: p.wrong, out: p.out, why: p.why, done: p.done }])) }; }
  }
  if (G.phase === 'countdown') s.next = { type: question().kind || question().type, n: qNum(G.qIndex) };
  if (G.phase === 'countdown' && G.raceIntro) s.raceIntro = { kind: G.raceIntro.kind || 'race', title: TYPES[question().type]?.label, icon: TYPES[question().type]?.icon, sub: introSub(question()), step: G.raceIntro.step, n: G.raceIntro.n, topic: raceTopic(question()), target: +question().target || 10, maxWrong: question().maxWrong ?? 10 };
  if (G.phase === 'typecard') s.typecard = { type: question().kind || question().type, n: qNum(G.qIndex), run: typeRun(G.qIndex) };
  if (G.phase === 'round') { const r = roundOf(G.qIndex); s.round = { n: r.n, title: r.title, practice: !!r.practice, intro: r.intro || '', count: r.count }; }
  if (G.phase === 'question' && G.q?.wheelRevealed !== undefined) s.wheel = { revealed: G.q.wheelRevealed, category: question().category, layout: G.q.view.layout };
  if (G.phase === 'question' && G.q && question().type === 'highlow') s.hl = { asked: Object.keys(G.q.low || {}).length };

// ---- King of the Hill ----
function kothStart() {
  G.q.koth = { step: 'fff', pts: {}, king: null, pair: [], next: 0, fff: null, h2h: null, result: null, winner: null, until: 0, total: 0 };

function kothNextRow() { const g = G.q.koth; return G.q.rows[g.next++ % G.q.rows.length]; }

    if (ok && f.through.length < f.need) { f.through.push(pid); sound('ding'); }
    if (f.through.length >= f.need || f.eligible.every((x) => f.answered[x])) return kothFffDone();
    persist(); renderKoth(); broadcastState(); return;

}
function kothFffDone() {

  const have = g.king ? [g.king] : (g.carry || []);

}

function kothJudges() {
  const g = G.q.koth; if (!G.auto || !g?.h2h?.buzz) return [];
  const others = livePids().filter((x) => !g.pair.includes(x)); return others.length ? others : g.pair.filter((x) => x !== g.h2h.buzz);
}
function kothStepDone() {

  if (g.step === 'fff') return kothFffDone();
  if (g.step === 'fffShow') { const have = g.king ? [g.king, ...(g.carry || [])] : (g.carry || []); if (have.length >= 2) return kothH2h(have.slice(0, 2)); return kothFff(); }

    const bot = (G.bots || []).find((b) => b.pid === g.h2h.buzz);
    if (bot && G.auto) setTimeout(() => { if (G.q?.koth === g && g.step === 'judge') kothJudge(g.h2h.says === kothRow(g.h2h.row).right); }, 2200);

function botKothFff() {

// ---- Blockbusters ----
/** The letter a hexagon shows: the first letter of the answer, skipping a leading "The", "A" or "An". */
function bbLetter(answer) { const s = String(answer || '').trim().replace(/^(the|a|an)\s+/i, ''); const m = s.normalize('NFD').match(/[A-Za-z0-9]/); return m ? m[0].toUpperCase() : '?'; }
function bbStart() {
  const q = question(), rows = G.q.rows, n = LQ.BB_COLS * LQ.BB_ROWS;
  // One question per letter where the bank allows, so the board shows as many different letters as possible.
  const byLetter = {}; rows.forEach((r, i) => { (byLetter[bbLetter(r.right)] = byLetter[bbLetter(r.right)] || []).push(i); });
  const first = shuffle(Object.values(byLetter).map((l) => l[0])).slice(0, n);
  const rest = shuffle(rows.map((_, i) => i).filter((i) => !first.includes(i)));
  const onBoard = shuffle([...first, ...rest.slice(0, n - first.length)]);
  G.q.bb = { step: 'teams', teams: {}, owner: Array(n).fill(-1), hexes: onBoard.map((ri) => ({ row: ri, letter: bbLetter(rows[ri].right) })), spare: rest.slice(n - first.length), picker: 0, hot: -1, answered: {}, claim: null, scores: {}, winner: -1, path: [], until: 0, total: 0, feed: [] };
  stepTo(G.q.bb, 'teams', 20000);
  persist(); renderBB(); broadcastState(); botBBTeams();
}
const bbTeam = (pid) => G.q.bb?.teams[pid];
function bbTeamsFinal() {
  const g = G.q.bb, pids = livePids(), count = (t) => pids.filter((x) => g.teams[x] === t).length;
  for (const pid of shuffle(pids)) if (g.teams[pid] === undefined) g.teams[pid] = count(0) <= count(1) ? 0 : 1;
  // Nobody on one side: move one across so both sides have someone.
  for (const t of [0, 1]) if (pids.length > 1 && !count(t)) { const from = pids.find((x) => g.teams[x] === 1 - t); if (from) g.teams[from] = t; }
  g.picker = Math.random() < 0.5 ? 0 : 1;
  bbPick();
}
function bbPick() { const g = G.q.bb; stepTo(g, 'pick', 15000); g.hot = -1; persist(); renderBB(); broadcastState(); botBBPick(); }
function bbAsk(i) {
  const g = G.q.bb; if (g.owner[i] !== -1) return;
  g.hot = i; g.answered = {}; g.claim = null; g.feed = [];
  stepTo(g, 'ask', question().time * 1000); sound('beep');
  persist(); renderBB(); broadcastState(); botBBAnswer();
}
function bbAnswer(pid, a) {
  const g = G.q.bb; if (!g) return;
  if (g.step === 'teams' && a && (a.team === 0 || a.team === 1)) { g.teams[pid] = a.team; persist(); renderBB(); broadcastState(); return; }
  if (g.teams[pid] === undefined && g.step !== 'teams') { const pids = livePids(); g.teams[pid] = pids.filter((x) => g.teams[x] === 0).length <= pids.filter((x) => g.teams[x] === 1).length ? 0 : 1; }
  if (g.step === 'pick' && a && Number.isInteger(a.hex) && g.teams[pid] === g.picker) return bbAsk(a.hex);
  if (g.step === 'ask' && a && typeof a.text === 'string' && !g.answered[pid]) {
    const row = G.q.rows[g.hexes[g.hot].row], text = a.text.slice(0, 80);
    g.answered[pid] = true; send('ack', { pid, qId: G.q.view.id });
    const m = textMatch(text, [row.right]);
    const ok = m === 'right' || (m === 'unsure' && similarity(LQ.normText(text), LQ.normText(row.right)) >= 0.78);
    if (ok) return bbClaim(pid);
    g.feed.push({ pid, text }); sound('wrong');
    if (livePids().every((x) => g.answered[x])) { g.until = 0; return bbStepDone(); }
    persist(); renderBB(); broadcastState();
  }
}
function bbClaim(pid) {
  const g = G.q.bb, q = question(), team = g.teams[pid];
  g.owner[g.hot] = team; g.scores[pid] = (g.scores[pid] || 0) + (q.hexPoints ?? 50); g.claim = { pid, team, hex: g.hot, answer: G.q.rows[g.hexes[g.hot].row].right };
  g.picker = team;
  const path = LQ.bbPath(g.owner, team);
  if (path) { g.winner = team; g.path = path; stepTo(g, 'won', 7000); sound('fanfare'); confetti(); }
  else { stepTo(g, 'claim', 2800); sound('ding'); }
  persist(); renderBB(); broadcastState();
}
function bbStepDone() {
  const g = G.q.bb;
  if (g.step === 'teams') return bbTeamsFinal();
  if (g.step === 'pick') { const open = g.owner.map((o, i) => o === -1 ? i : -1).filter((i) => i >= 0); if (!open.length) return endQuestion(); return bbAsk(open[Math.floor(Math.random() * open.length)]); }
  if (g.step === 'ask') {
    g.claim = { miss: true, answer: G.q.rows[g.hexes[g.hot].row].right, hex: g.hot };
    // A fresh question for the same hexagon: the same letter if the spares have one, otherwise any spare (the letter changes).
    const L = g.hexes[g.hot].letter, si = g.spare.findIndex((ri) => bbLetter(G.q.rows[ri].right) === L), take = si >= 0 ? si : g.spare.length ? 0 : -1;
    if (take >= 0) { const ri = g.spare.splice(take, 1)[0]; g.hexes[g.hot] = { row: ri, letter: bbLetter(G.q.rows[ri].right) }; }
    stepTo(g, 'miss', 3500); sound('trombone'); persist(); renderBB(); broadcastState(); return;
  }
  if (g.step === 'claim' || g.step === 'miss') { if (g.owner.every((o) => o !== -1)) { const n0 = g.owner.filter((o) => o === 0).length; g.winner = n0 * 2 > g.owner.length ? 0 : 1; stepTo(g, 'won', 6000); persist(); renderBB(); broadcastState(); return; } return bbPick(); }
  if (g.step === 'won') return endQuestion();
}
function botBBTeams() { const g = G.q.bb; for (const b of G.bots || []) botLater(() => { if (G.q?.bb === g && g.step === 'teams' && g.teams[b.pid] === undefined) bbAnswer(b.pid, { team: Math.random() < 0.5 ? 0 : 1 }); }, rnd(1200, 5000)); }
function botBBPick() {
  const g = G.q.bb, bots = (G.bots || []).filter((b) => g.teams[b.pid] === g.picker); if (!bots.length) return;
  const b = bots[Math.floor(Math.random() * bots.length)];
  botLater(() => {
    if (G.q?.bb !== g || g.step !== 'pick') return;
    const open = g.owner.map((o, i) => o === -1 ? i : -1).filter((i) => i >= 0);
    const near = open.filter((i) => LQ.bbNeighbours(i).some((j) => g.owner[j] === g.picker));
    const pool = near.length && chance(0.7) ? near : open; if (pool.length) bbAnswer(b.pid, { hex: pool[Math.floor(Math.random() * pool.length)] });
  }, rnd(1800, 4200));
}
function botBBAnswer() {
  const g = G.q.bb, hot = g.hot, q = question();

function playTune(q) {

  const step = (p, place, prize) => `<div class="pod p${place}">${place === 1 ? '<div class="pod-rays"></div>' : ''}${p ? `<div class="pod-who">${place === 1 ? '<div class="pod-crown">👑</div>' : ''}<div class="pod-av">${p.emoji || '🙂'}</div><div class="pod-name">${esc(p.name)}</div><div class="pod-pts">${got(p.pid)} right · +${prize} bonus</div></div>` : '<div class="pod-who empty"></div>'}<div class="pod-block"><span>${place}</span></div></div>`;
  const sparks = [[12, 18, 0], [84, 12, .5], [24, 52, 1], [76, 44, .3], [50, 4, .8], [6, 70, 1.2], [94, 64, .6]].map(([x, y, d]) => `<span class="pod-spark" style="left:${x}%;top:${y}%;animation-delay:${2.4 + d}s">✨</span>`).join('');
  const notes = [st.loser ? `<span class="last no">💨 ${st.loser.emoji || ''} ${esc(st.loser.name)} finishes last: −${v.forfeit}</span>` : '', `<span class="last" style="opacity:.7">${v.perCorrect} per right answer</span>`].join('');
  return `<div class="podium">${sparks}${step(p2, 2, v.prize2 ?? 200)}${step(st.winner, 1, v.prize ?? 500)}${step(p3, 3, v.prize3 ?? 100)}</div><div class="turnbar podnote" style="flex-wrap:wrap"><span class="who">🏆 ${esc(st.winner.name)} wins the race!</span>${notes}</div>`;
}
function drawPins() {
  const q = question(), R = G.q.results, board = $('#pinboard'), img = $('img', board);
  const draw = () => {
    const w = img.clientWidth, h = img.clientHeight; if (!w) return;
    $$('.pp, .target, .rect', board).forEach((e) => e.remove());
    if (q.mode === 'area') {
      const r = document.createElement('div'); r.className = 'rect'; const tg = q.target || { x: 0, y: 0, w: 0, h: 0 }; r.style.left = tg.x * w + 'px'; r.style.top = tg.y * h + 'px'; r.style.width = tg.w * w + 'px'; r.style.height = tg.h * h + 'px'; board.appendChild(r);
      R.stats.pins.forEach((p) => { const el = document.createElement('div'); el.className = 'pp ' + (p.hit ? 'hit' : 'miss'); el.style.left = p.x * w + 'px'; el.style.top = p.y * h + 'px'; el.textContent = p.name.slice(0, 2).toUpperCase(); el.title = p.name; board.appendChild(el); });
      return;
    }
    R.stats.pins.forEach((p, i) => { const el = document.createElement('div'); el.className = 'pp' + (i === 0 ? ' best' : ''); el.style.left = p.x * w + 'px'; el.style.top = p.y * h + 'px'; el.textContent = p.name.slice(0, 2).toUpperCase(); el.title = p.name; board.appendChild(el); });
    const t = document.createElement('div'); t.className = 'target'; t.style.left = q.pin.x * w + 'px'; t.style.top = q.pin.y * h + 'px';
    t.innerHTML = `<svg viewBox="0 0 24 24" width="34" height="34"><path fill="#e21b3c" stroke="#fff" stroke-width="1.5" d="M12 1.5a7.5 7.5 0 0 0-7.5 7.5c0 5.6 7.5 13.5 7.5 13.5S19.5 14.6 19.5 9A7.5 7.5 0 0 0 12 1.5z"/><circle cx="12" cy="9" r="3" fill="#fff"/></svg>`;
    board.appendChild(t);
  };
  img.onload = draw; if (img.complete) draw(); window.onresize = draw;
}
function renderScoreboard() {
  const rk = ranked().slice(0, 7), top = Math.max(1, rk[0]?.score || 1), R = G.q?.results?.byPlayer || {};
  stage.innerHTML = `${topBar()}<div class="stage-main"><h1 class="big" style="font-size:2.6rem">Scoreboard <span class="small" style="opacity:.45;font-size:.85rem;font-weight:700">· click a name to remove a player who has left</span></h1><div class="board">${rk.map((p, i) => `<div class="brow"><div class="fill" data-w="${(p.score / top) * 100}"></div><div class="rank">${i + 1}</div><div><span data-kick="${p.id}">${p.emoji ? p.emoji + ' ' : ''}${esc(p.name)}</span>${R[p.id]?.points ? `<span class="delta" ${R[p.id].points < 0 ? 'style="color:#ffb3c0"' : ''}>${R[p.id].points > 0 ? '+' : ''}${R[p.id].points}</span>` : ''}</div><div>${p.score}</div></div>`).join('')}</div></div>
    ${hostBar(`<button class="btn btn-ghost" data-act="end">End game</button><button class="btn btn-primary" data-act="primary">${G.qIndex + 1 < G.quiz.questions.length ? 'Next ▶' : 'Final results 🏆'}</button>`)}`;
  requestAnimationFrame(() => $$('.fill').forEach((f) => f.style.width = f.dataset.w + '%'));
  bind();
}
function renderFinal() {
  const rk = ranked();
  const pod = (i, cls) => rk[i] ? `<div class="pod ${cls}"><div class="name">${rk[i].emoji ? `<div style="font-size:1.6em">${rk[i].emoji}</div>` : ''}${esc(rk[i].name)}</div><div class="score">${rk[i].score} pts</div><div class="block">${i + 1}</div></div>` : '';
  stage.innerHTML = `<div class="stage-top"><div class="pillbox"><span class="hpill">${esc(G.quiz.title)}</span><span class="hpill">Final results</span></div></div>
    <div class="stage-main"><h1 class="big" style="font-size:2.6rem">🏆 ${rk[0] ? esc(rk[0].name) + ' wins!' : 'Game over'}</h1>
      <div class="podium">${pod(1, 'p2')}${pod(0, 'p1')}${pod(2, 'p3')}</div>
      ${rk.length > 3 ? `<div class="textlist">${rk.slice(3, 15).map((p, i) => `<span class="tl">${i + 4}. ${p.emoji ? p.emoji + ' ' : ''}${esc(p.name)} · ${p.score}</span>`).join('')}</div>` : ''}
      <p class="small" style="opacity:.5;margin-top:10px">Players can be removed from the scoreboard during the game by clicking their name.</p></div>
    ${hostBar(`<a class="btn btn-ghost ${G.reportId ? '' : 'hidden'}" id="reportBtn" href="index.html?game=${G.reportId || ''}" target="_blank">📊 Report</a><button class="btn btn-ghost" data-act="builder">${TV ? '🏠 Home' : 'Back to builder'}</button>${G.quizId ? '<button class="btn btn-ghost" data-act="restock" title="Just testing? Put every question back into the bank as unused and delete this quiz">↩ Return questions to the bank</button>' : ''}<button class="btn btn-primary" data-act="again">Play again ↻</button>`)}`;
  bind();
}
function confetti() {
  const c = $('#confetti'); c.classList.remove('hidden'); c.innerHTML = '';
  const cols = ['#e21b3c', '#1368ce', '#ffd54a', '#26890c', '#fff', '#ff7ab6'];
  for (let i = 0; i < 140; i++) { const s = document.createElement('i'); s.style.left = Math.random() * 100 + 'vw'; s.style.background = cols[i % cols.length]; s.style.animationDuration = (2.5 + Math.random() * 3) + 's'; s.style.animationDelay = Math.random() * 2 + 's'; s.style.transform = `rotate(${Math.random() * 360}deg)`; c.appendChild(s); }
  setTimeout(() => c.classList.add('hidden'), 9000);
}
document.addEventListener('keydown', (e) => {
  if ((e.key === 'm' || e.key === 'M') && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName || '')) { e.preventDefault(); toggleMusic(); return; }
  if ((e.key === 'p' || e.key === 'P') && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName || '') && typeof G !== 'undefined' && G && G.auto && !['lobby', 'final'].includes(G.phase)) { e.preventDefault(); togglePause(); return; }
  if (G?.phase === 'slide' && G.brk && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName || '') && ['+', '=', '-', '_'].includes(e.key)) { e.preventDefault(); adjustBreak(e.key === '-' || e.key === '_' ? -1 : 1); return; }
  if (e.target.matches('input, textarea, button, a, select')) return; // a focused control handles its own key
  if (TV && e.key === 'ArrowRight') return; // on a TV the arrows move the focus ring
  if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight' || e.code === 'Space') { e.preventDefault(); if (!document.querySelector('.modal-bg')) primaryAction(); }
});
if (!TV) window.addEventListener('beforeunload', (e) => { if (G && G.phase !== 'lobby' && G.phase !== 'final') { e.preventDefault(); e.returnValue = ''; } });
</script>
