<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Childcare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@900&display=swap" rel="stylesheet">
<style>
  /* A wind-up for a friend: one huge link, and what's behind it. */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: Nunito, system-ui, sans-serif; font-weight: 900; display: grid; place-items: center; text-align: center; padding: 24px; background: #fff; color: #1b1544; overflow-x: hidden; }
  a.sell { color: #1368ce; font-size: clamp(2.6rem, 11vw, 8rem); line-height: 1.02; text-decoration: underline; text-underline-offset: .12em; text-wrap: balance; }
  a.sell:hover { color: #0b4f9e; }
  .gotcha { display: none; }
  body.caught { background: #e21b3c; color: #fff; }
  body.caught a.sell { display: none; }
  body.caught .gotcha { display: block; animation: pop .4s cubic-bezier(.2, 1.6, .4, 1); }
  .gotcha h1 { margin: 0; font-size: clamp(3rem, 13vw, 10rem); line-height: 1; text-wrap: balance; }
  .gotcha p { margin: .4em 0 0; font-size: clamp(1.8rem, 7vw, 5rem); line-height: 1.05; text-wrap: balance; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
</style>
</head>
<body>
<a class="sell" href="#caught" id="sell">Click here to sell your Children</a>
<div class="gotcha"><h1>You're sick MALVE!</h1><p>Get your own childcare!</p></div>
<script>
  const caught = () => document.body.classList.toggle('caught', location.hash === '#caught');
  window.addEventListener('hashchange', caught); caught();
</script>
</body>
</html>
