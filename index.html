<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Quiz — Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body class="builder">
<div class="topbar">
  <div class="logo"><span>LQ</span> Live Quiz</div>
  <div class="grow"></div>
  <div id="topRight"></div>
</div>
<div class="wrap" id="view"></div>
<div class="toast" id="toast"></div>

<script src="assets/common.js"></script>
<script>
const { $, $$, esc, uid, api, TYPES, COLORS, DEFAULT_SETTINGS, newQuestion, validate, youtubeId, resizeImage, normalizeQuiz, orderQuestions, quizForSave, timeFor } = LQ;
const view = $('#view');
const S = { quizzes: [], quiz: null, sel: 0, ai: false, saveTimer: null, saving: false, dirty: false };

let toastT;
function toast(msg, bad) {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (bad ? ' bad' : '');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), bad ? 5000 : 2500);
}
function modal(html) {
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal">${html}</div>`;
  bg.addEventListener('click', (e) => { if (e.target === bg) bg.remove(); });
  document.body.appendChild(bg);
  return bg;
}
function confirmBox(title, body, okLabel = 'Delete') {
  return new Promise((res) => {
    const m = modal(`<h3>${esc(title)}</h3><p class="muted">${esc(body)}</p><div class="row" style="justify-content:flex-end"><button class="btn btn-ghost" data-x>Cancel</button><button class="btn btn-danger" data-ok>${esc(okLabel)}</button></div>`);
    $('[data-x]', m).onclick = () => { m.remove(); res(false); };
    $('[data-ok]', m).onclick = () => { m.remove(); res(true); };
  });
}
const fmtDate = (s) => new Date(s).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });

// ------------------------------------------------------------------ boot
(async function boot() {
  if (!LQ.hostPassword()) return viewLogin();
  try { const r = await api('login'); S.ai = !!r.ai; }
  catch (e) { if (e.status === 401) { LQ.setHostPassword(''); return viewLogin('Wrong password.'); } view.innerHTML = `<div class="error">${esc(e.message)}</div>`; return; }
  const id = new URLSearchParams(location.search).get('quiz');
  if (id) return openQuiz(id);
  loadList();
})();

// ------------------------------------------------------------------ login
function viewLogin(msg) {
  $('#topRight').innerHTML = '';
  view.innerHTML = `<div class="card login"><h2>Host sign-in</h2><p class="muted">This is the host's portal. Players don't sign in — they scan the code on the screen.</p>
    ${msg ? `<div class="error" style="margin-bottom:12px">${esc(msg)}</div>` : ''}
    <form id="loginForm"><div class="field"><label>Password</label><input type="password" id="pw" autocomplete="current-password" autofocus></div>
    <button class="btn btn-primary btn-block">Sign in</button></form>
    <p class="center small mt" style="margin-bottom:0"><a href="host.html?quiz=demo" target="_blank">Try the demo quiz without signing in</a></p></div>`;
  $('#loginForm').onsubmit = async (e) => {
    e.preventDefault();
    const pw = $('#pw').value;
    try { const r = await api('login', {}, { password: pw }); LQ.setHostPassword(pw); S.ai = !!r.ai; loadList(); }
    catch (err) { viewLogin(err.status === 401 ? 'Wrong password.' : err.message); }
  };
}

// ------------------------------------------------------------------ quiz list
async function loadList() {
  view.innerHTML = '<p class="muted">Loading…</p>';
  try { const r = await api('list'); S.quizzes = r.quizzes; } catch (e) { view.innerHTML = `<div class="error">${esc(e.message)}</div>`; return; }
  renderList();
  api('games').then((r) => renderGames(r.games)).catch(() => {});
}
function renderList() {
  history.replaceState(null, '', location.pathname);
  S.quiz = null;
  $('#topRight').innerHTML = `<button class="btn btn-ghost btn-sm" id="logout">Sign out</button>`;
  $('#logout').onclick = () => { LQ.setHostPassword(''); viewLogin(); };
  view.innerHTML = `
    <div class="row" style="margin-bottom:18px"><h1 style="margin:0">Your quizzes</h1><div class="grow"></div>
      <button class="btn btn-ghost" id="aiNew">✨ Write one with AI</button>
      <button class="btn btn-primary" id="newQuiz">+ New quiz</button></div>
    <div class="quizgrid">${S.quizzes.map(quizCard).join('')}
      ${S.quizzes.length ? '' : '<div class="card newcard" id="newQuiz2">Create your first quiz</div>'}</div>
    <div id="games" class="mt"></div>`;
  $('#newQuiz').onclick = newQuiz;
  if ($('#newQuiz2')) $('#newQuiz2').onclick = newQuiz;
  $('#aiNew').onclick = () => aiModal(true);
  $$('[data-open]').forEach((b) => b.onclick = () => openQuiz(b.dataset.open));
  $$('[data-host]').forEach((b) => b.onclick = () => window.open('host.html?quiz=' + b.dataset.host, '_blank'));
  $$('[data-dup]').forEach((b) => b.onclick = () => duplicateQuiz(b.dataset.dup));
  $$('[data-del]').forEach((b) => b.onclick = async () => {
    const q = S.quizzes.find((x) => x.id === b.dataset.del);
    if (!(await confirmBox('Delete this quiz?', `“${q.title}” and its ${q.count} questions will be gone for good.`))) return;
    try { await api('delete', { id: q.id }); toast('Deleted'); loadList(); } catch (e) { toast(e.message, true); }
  });
}
function quizCard(q) {
  return `<div class="card quizcard"><h3>${esc(q.title)}</h3>
    <div class="muted small">${q.count} question${q.count === 1 ? '' : 's'} · updated ${fmtDate(q.updated_at)}</div>
    <div class="types">${q.types.map((t) => `<span class="tag">${esc(TYPES[t]?.label || t)}</span>`).join('')}</div>
    <div class="actions"><button class="btn btn-primary btn-sm" data-host="${q.id}" ${q.count ? '' : 'disabled'}>▶ Host</button>
      <button class="btn btn-sm" data-open="${q.id}">Edit</button>
      <button class="btn btn-ghost btn-sm" data-dup="${q.id}">Duplicate</button>
      <button class="btn btn-ghost btn-sm" data-del="${q.id}" style="color:var(--bad)">Delete</button></div></div>`;
}
function renderGames(games) {
  const el = $('#games'); if (!el || !games?.length) return;
  el.innerHTML = `<h2 style="font-size:1.2rem">Recent games</h2><div class="card">${games.slice(0, 12).map((g) => {
    const win = (g.players || [])[0];
    return `<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)"><b>${esc(g.title || 'Quiz')}</b><span class="muted small">${fmtDate(g.ended_at)} · ${(g.players || []).length} players</span><div class="grow"></div>${win ? `<span>🏆 ${esc(win.name)} <span class="muted">${win.score} pts</span></span>` : ''}</div>`;
  }).join('')}</div>`;
}
async function duplicateQuiz(id) {
  try {
    const r = await api('get', { id });
    const copy = quizForSave(normalizeQuiz(r.quiz)); copy.id = null; copy.title += ' (copy)';
    await api('save', { quiz: copy }); toast('Duplicated'); loadList();
  } catch (e) { toast(e.message, true); }
}

// ------------------------------------------------------------------ editor
async function openQuiz(id) {
  view.innerHTML = '<p class="muted">Loading…</p>';
  try { const r = await api('get', { id }); S.quiz = normalizeQuiz(r.quiz); S.sel = 0; renderEditor(); }
  catch (e) { view.innerHTML = `<div class="error">${esc(e.message)}</div><p class="mt"><a href="index.html">Back to quizzes</a></p>`; }
}
function newQuiz() {
  S.quiz = normalizeQuiz({ title: 'New quiz', questions: [] }); S.sel = 0; renderEditor(); pickType(S.quiz.rounds[0].id);
}
const cur = () => S.quiz.questions[S.sel];
const roundOf = (q) => S.quiz.rounds.find((r) => r.id === q.round) || S.quiz.rounds[0];
const roundIndex = (id) => S.quiz.rounds.findIndex((r) => r.id === id);

function renderEditor() {
  const q = S.quiz;
  if (q.id) history.replaceState(null, '', '?quiz=' + q.id);
  $('#topRight').innerHTML = '';
  view.innerHTML = `
    <div class="row" style="margin-bottom:14px">
      <button class="btn btn-ghost btn-sm" id="back">← Quizzes</button>
      <input type="text" id="title" value="${esc(q.title)}" style="font-weight:900;font-size:1.15rem;max-width:460px" placeholder="Quiz title">
      <span id="saveState" class="muted small"></span>
      <div class="grow"></div>
      <button class="btn btn-ghost btn-sm" id="settings">⚙ Settings</button>
      <button class="btn btn-ghost btn-sm" id="aiAdd">✨ Add with AI</button>
      <button class="btn btn-ghost btn-sm" id="checkAll" title="Fact-check every question with AI">✔ Check all</button>
      <button class="btn btn-sm" id="save">Save</button>
      <button class="btn btn-primary btn-sm" id="host">▶ Host live</button>
    </div>
    <div class="editor"><div class="card qlist" id="qlist"></div><div class="card" id="qform"></div></div>`;
  $('#back').onclick = async () => { if (S.dirty) await save(); loadList(); };
  $('#title').oninput = (e) => { q.title = e.target.value; touch(); };
  $('#settings').onclick = settingsModal;
  $('#aiAdd').onclick = () => aiModal(false, cur()?.round || q.rounds[0].id);
  $('#checkAll').onclick = () => checkRounds(q.rounds.map((r) => r.id));
  $('#save').onclick = () => save(true);
  $('#host').onclick = hostNow;
  renderQList(); renderQForm();
}
function touch() { S.dirty = true; orderQuestions(S.quiz); $('#saveState').textContent = 'Unsaved changes'; clearTimeout(S.saveTimer); S.saveTimer = setTimeout(() => save(), 2000); }
async function save(explicit) {
  if (S.saving || !S.quiz) return;
  S.saving = true; const st = $('#saveState'); if (st) st.textContent = 'Saving…';
  try {
    const r = await api('save', { quiz: quizForSave(S.quiz) });
    S.quiz.id = r.quiz.id; S.dirty = false;
    history.replaceState(null, '', '?quiz=' + S.quiz.id);
    if (st) st.textContent = 'Saved';
    if (explicit) toast('Saved');
  } catch (e) { if (st) st.textContent = 'Not saved'; toast('Could not save: ' + e.message, true); }
  S.saving = false;
}
async function hostNow() {
  const bad = S.quiz.questions.map((q, i) => ({ i, p: validate(q) })).filter((x) => x.p.length);
  if (!S.quiz.questions.length) return toast('Add a question first.', true);
  if (bad.length) { S.sel = bad[0].i; renderQList(); renderQForm(); return toast(`Question ${bad[0].i + 1} isn't finished: ${bad[0].p[0]}`, true); }
  await save();
  if (!S.quiz.id) return;
  window.open('host.html?quiz=' + S.quiz.id, '_blank');
}

function renderQList() {
  const qs = S.quiz.questions, rounds = S.quiz.rounds;
  let html = '';
  rounds.forEach((r, ri) => {
    const inRound = qs.map((q, i) => [q, i]).filter(([q]) => q.round === r.id);
    html += `<div class="roundhead"><div class="rt"><small>Round ${ri + 1}${r.brief ? ' · ✨' : ''}</small>${esc(r.title) || '<span class="muted">Untitled round</span>'}</div>
      <div class="ra"><button data-rup="${ri}" title="Move round up" ${ri === 0 ? 'disabled' : ''}>▲</button><button data-rdown="${ri}" title="Move round down" ${ri === rounds.length - 1 ? 'disabled' : ''}>▼</button><button data-redit="${r.id}" title="Round name and AI brief">✎</button><button data-check="${r.id}" title="Fact-check this round with AI" ${inRound.length ? '' : 'disabled'}>✔</button></div></div>`;
    html += inRound.map(([q, i]) => {
      const probs = validate(q), ck = checkState(q);
      return `<div class="qtile ${i === S.sel ? 'active' : ''}" data-i="${i}">
        <div class="n">${i + 1}</div>
        <div class="t"><small>${TYPES[q.type].icon} ${esc(TYPES[q.type].label)} · ${q.time}s${q.media?.kind === 'youtube' ? ' · ▶ video' : q.media?.kind === 'image' ? ' · 🖼' : ''}</small>${esc(q.text) || '<span class="muted">Untitled question</span>'}</div>
        <div class="mv">${probs.length ? '<span class="warn" title="' + esc(probs.join(' ')) + '">!</span>' : ''}${ck ? `<span class="chk ${ck}" title="${esc(q.check.note || '')}">${{ ok: '✓', doubt: '?', wrong: '✗', stale: '~' }[ck]}</span>` : ''}<button data-up="${i}" title="Move up" ${inRound[0][1] === i ? 'disabled' : ''}>▲</button><button data-down="${i}" title="Move down" ${inRound[inRound.length - 1][1] === i ? 'disabled' : ''}>▼</button></div></div>`;
    }).join('');
    html += `<div class="row" style="gap:6px;margin:4px 0 14px"><button class="btn btn-ghost btn-sm grow" data-addq="${r.id}">+ Question</button><button class="btn btn-ghost btn-sm grow" data-ai="${r.id}">✨ Write with AI</button></div>`;
  });
  $('#qlist').innerHTML = html + `<button class="btn btn-block" id="addRound">+ Add a round</button>`;
  $$('.qtile', $('#qlist')).forEach((t) => t.onclick = (e) => { if (e.target.closest('button')) return; S.sel = +t.dataset.i; renderQList(); renderQForm(); });
  $$('[data-up]').forEach((b) => b.onclick = () => moveQ(+b.dataset.up, -1));
  $$('[data-down]').forEach((b) => b.onclick = () => moveQ(+b.dataset.down, 1));
  $$('[data-rup]').forEach((b) => b.onclick = () => moveRound(+b.dataset.rup, -1));
  $$('[data-rdown]').forEach((b) => b.onclick = () => moveRound(+b.dataset.rdown, 1));
  $$('[data-redit]').forEach((b) => b.onclick = () => roundModal(b.dataset.redit));
  $$('[data-addq]').forEach((b) => b.onclick = () => pickType(b.dataset.addq));
  $$('[data-check]').forEach((b) => b.onclick = () => checkRounds([b.dataset.check]));
  $$('[data-ai]').forEach((b) => b.onclick = () => aiModal(false, b.dataset.ai));
  $('#addRound').onclick = () => roundModal(null);
}
function moveQ(i, d) {
  const qs = S.quiz.questions; const j = i + d;
  if (j < 0 || j >= qs.length || qs[j].round !== qs[i].round) return;
  [qs[i], qs[j]] = [qs[j], qs[i]]; S.sel = j; touch(); renderQList(); renderQForm();
}
function moveRound(i, d) {
  const rs = S.quiz.rounds; const j = i + d; if (j < 0 || j >= rs.length) return;
  const selId = cur()?.id; [rs[i], rs[j]] = [rs[j], rs[i]]; touch();
  if (selId) S.sel = S.quiz.questions.findIndex((q) => q.id === selId);
  renderQList(); renderQForm();
}
function pickType(roundId) {
  const m = modal(`<h3>What kind of question?</h3><div class="typepicker">${Object.entries(TYPES).map(([k, t]) => `<button class="typetile" data-t="${k}"><div class="ic">${t.icon}</div><b>${esc(t.label)}</b><small>${esc(t.blurb)} ${timeFor(k, S.quiz.settings)}s.</small></button>`).join('')}</div>
    <p class="muted small mt">Any question can have a picture or a YouTube video on the screen. A video question is just a question with a video — for “name the singer”, pick <b>Type the answer</b> or <b>Multiple choice</b> and add the video below. Time limits per type are in Settings.</p>`);
  $$('.typetile', m).forEach((b) => b.onclick = () => {
    m.remove();
    const q = newQuestion(b.dataset.t, S.quiz.settings); q.round = roundId || cur()?.round || S.quiz.rounds[0].id;
    S.quiz.questions.push(q); touch(); S.sel = S.quiz.questions.findIndex((x) => x.id === q.id); renderQList(); renderQForm(); $('#f_text')?.focus();
  });
}

// ------------------------------------------------------------------ rounds
function roundModal(id) {
  const r = id ? S.quiz.rounds.find((x) => x.id === id) : { id: null, title: `Round ${S.quiz.rounds.length + 1}`, brief: '' };
  const n = id ? S.quiz.questions.filter((q) => q.round === id).length : 0;
  const m = modal(`<h3>${id ? 'Round' : 'Add a round'}</h3>
    <div class="field"><label>Round name <span class="muted">— shown on the screen before it starts</span></label><input type="text" id="r_title" value="${esc(r.title)}" placeholder="e.g. Sports, Picture round, Music"></div>
    <div class="field"><label>Brief for the AI <span class="muted">— optional</span></label><textarea id="r_brief" placeholder="What this round should be about, as you'd tell a quizmaster. e.g. A sports round where every question is about Harry Kane: his clubs, records, goals and England career.">${esc(r.brief)}</textarea>
      <div class="help">Used whenever you write questions for this round with AI. Questions added by hand ignore it.</div></div>
    ${id && n ? `<p class="muted small">${n} question${n === 1 ? '' : 's'} in this round.</p>` : ''}
    <div class="row mt" style="justify-content:space-between">
      <div>${id && S.quiz.rounds.length > 1 ? `<button class="btn btn-ghost btn-sm" data-del style="color:var(--bad)">Delete round</button>` : ''}</div>
      <div class="row"><button class="btn btn-ghost" data-x>Cancel</button>${id ? '' : '<button class="btn" data-ok-ai>Add and write with AI</button>'}<button class="btn btn-primary" data-ok>${id ? 'Done' : 'Add round'}</button></div></div>`);
  const read = () => { r.title = $('#r_title', m).value.trim() || r.title; r.brief = $('#r_brief', m).value.trim(); };
  const commit = () => { read(); if (!id) { r.id = uid('r'); S.quiz.rounds.push(r); } touch(); m.remove(); renderQList(); renderQForm(); };
  $('[data-x]', m).onclick = () => m.remove();
  $('[data-ok]', m).onclick = commit;
  if ($('[data-ok-ai]', m)) $('[data-ok-ai]', m).onclick = () => { commit(); aiModal(false, r.id); };
  if ($('[data-del]', m)) $('[data-del]', m).onclick = async () => {
    m.remove();
    if (n && !(await confirmBox('Delete this round?', `Its ${n} question${n === 1 ? '' : 's'} will be deleted too.`))) return;
    S.quiz.questions = S.quiz.questions.filter((q) => q.round !== id);
    S.quiz.rounds = S.quiz.rounds.filter((x) => x.id !== id);
    S.sel = Math.max(0, Math.min(S.sel, S.quiz.questions.length - 1)); touch(); renderQList(); renderQForm();
  };
  setTimeout(() => $('#r_title', m).select(), 50);
}

// ------------------------------------------------------------------ question form
function renderQForm() {
  const q = cur(); const box = $('#qform');
  if (!q) { const rid = S.quiz.rounds[0].id; box.innerHTML = `<div class="center" style="padding:40px 10px"><h3>No questions yet</h3><p class="muted">Add one by hand, or let AI write a round for you. Set up your rounds on the left first if you want more than one.</p><div class="row" style="justify-content:center"><button class="btn btn-primary" id="add1">+ Add question</button><button class="btn" id="ai1">✨ Write with AI</button></div></div>`; $('#add1').onclick = () => pickType(rid); $('#ai1').onclick = () => aiModal(false, rid); return; }
  const n = S.sel + 1, ck = checkState(q);
  box.innerHTML = `
    <div class="row" style="justify-content:space-between;margin-bottom:10px"><h3 style="margin:0">Question ${n} <span class="muted">· ${TYPES[q.type].icon} ${esc(TYPES[q.type].label)}</span></h3>
      <div class="row"><button class="btn btn-ghost btn-sm" id="dupQ">Duplicate</button><button class="btn btn-ghost btn-sm" id="delQ" style="color:var(--bad)">Delete</button></div></div>
    ${ck ? `<div class="checknote ${ck}"><b>${{ ok: '✓ Checked: looks right.', doubt: '? Worth a look.', wrong: '✗ Looks wrong.', stale: '~ Changed since it was checked.' }[ck]}</b> ${esc(q.check.note || '')}${q.check.fix && ck !== 'ok' ? `<div class="mt" style="margin-top:6px"><b>Suggested answer:</b> ${esc(q.check.fix)}</div>` : ''}<div class="row" style="margin-top:8px;gap:6px"><button class="btn btn-ghost btn-sm" id="recheck">Check again</button><button class="btn btn-ghost btn-sm" id="clearCheck">Dismiss</button></div></div>` : ''}
    <div class="field"><label>Question</label><textarea id="f_text" placeholder="${esc(placeholderFor(q.type))}">${esc(q.text)}</textarea></div>
    <div id="typeBox"></div>
    <div class="field"><label>${q.type === 'pin' ? 'Picture to drop the pin on' : 'On the screen'}</label><div id="mediaBox"></div></div>
    <div class="row" style="align-items:flex-end">
      <div class="field" style="max-width:180px"><label>${q.type === 'wipeout' ? 'Seconds per turn' : 'Time limit (seconds)'}</label><input type="number" id="f_time" min="${q.type === 'wipeout' ? 3 : 5}" max="180" value="${q.time}"></div>
      ${q.type === 'wipeout' ? `<div class="field" style="max-width:160px"><label>Points per right pick</label><input type="number" id="f_pick" min="0" max="5000" value="${q.pickPoints ?? 200}"></div><div class="field" style="max-width:160px"><label>Wipeout penalty</label><input type="number" id="f_penalty" min="0" max="5000" value="${q.penalty ?? 500}"></div>` : ''}
      ${S.quiz.rounds.length > 1 ? `<div class="field" style="max-width:240px"><label>Round</label><select id="f_round">${S.quiz.rounds.map((r, i) => `<option value="${r.id}" ${r.id === q.round ? 'selected' : ''}>${i + 1}. ${esc(r.title || 'Untitled round')}</option>`).join('')}</select></div>` : ''}
      ${q.type === 'order' || q.type === 'match' || q.type === 'sort' ? `<label class="check" style="margin-bottom:14px"><input type="checkbox" id="f_partial" ${q.partial ? 'checked' : ''}> Partial credit for partly right</label>` : ''}
      ${q.type === 'text' ? `<label class="check" style="margin-bottom:14px"><input type="checkbox" id="f_ai" ${q.ai !== false ? 'checked' : ''}> Let AI judge spelling and wording</label>` : ''}
    </div>
    <div id="problems"></div>`;
  $('#f_text').oninput = (e) => { q.text = e.target.value; touch(); refreshTile(); };
  $('#f_time').onchange = (e) => { q.time = LQ.clamp(+e.target.value || 30, q.type === 'wipeout' ? 3 : 5, 180); e.target.value = q.time; touch(); renderQList(); };
  if ($('#f_pick')) $('#f_pick').onchange = (e) => { q.pickPoints = LQ.clamp(+e.target.value || 0, 0, 5000); touch(); };
  if ($('#f_penalty')) $('#f_penalty').onchange = (e) => { q.penalty = LQ.clamp(+e.target.value || 0, 0, 5000); touch(); };
  if ($('#f_round')) $('#f_round').onchange = (e) => { q.round = e.target.value; touch(); S.sel = S.quiz.questions.findIndex((x) => x.id === q.id); renderQList(); renderQForm(); };
  if ($('#f_partial')) $('#f_partial').onchange = (e) => { q.partial = e.target.checked; touch(); };
  if ($('#f_ai')) $('#f_ai').onchange = (e) => { q.ai = e.target.checked; touch(); };
  if ($('#recheck')) $('#recheck').onclick = () => checkQuestions([q]);
  if ($('#clearCheck')) $('#clearCheck').onclick = () => { delete q.check; touch(); renderQList(); renderQForm(); };

function renderPinPick() {
  const q = cur(); const box = $('#pinpick'); if (!box) return;

  const wrap = $('.pinpick', box), img = $('img', wrap);
  const place = () => {
    const w = img.clientWidth, h = img.clientHeight; if (!w) return;
    $('.pin', wrap).style.left = (q.pin.x * w) + 'px'; $('.pin', wrap).style.top = (q.pin.y * h) + 'px';
    for (const [cls, r] of [['full', q.radiusFull], ['zero', q.radiusZero]]) { const el = $('.ring.' + cls, wrap); el.style.left = (q.pin.x * w) + 'px'; el.style.top = (q.pin.y * h) + 'px'; el.style.width = el.style.height = (r * 2 * w) + 'px'; }
  };
  img.onload = place; if (img.complete) place();
  wrap.onclick = (e) => { const r = img.getBoundingClientRect(); q.pin = { x: LQ.clamp((e.clientX - r.left) / r.width, 0, 1), y: LQ.clamp((e.clientY - r.top) / r.height, 0, 1) }; touch(); place(); showProblems(); };
}

function pickImage(cb) {

// ------------------------------------------------------------------ AI fact-check
/** The question as the checker sees it — also what a check is tied to, so an edit makes it stale. */
function summaryOf(q) {
  const lines = [`Type: ${TYPES[q.type].label}`, `Question: ${q.text}`];
  if (q.type === 'choice') lines.push('Options: ' + q.options.filter((o) => o.text.trim()).map((o) => o.text + (o.id === q.correct ? ' [MARKED CORRECT]' : '')).join(' | '));  if (q.type === 'text') lines.push('Accepted answers: ' + q.answers.filter((a) => a.trim()).join(' | '));
  if (q.type === 'order') lines.push(`Correct order${q.hint ? ` (${q.hint})` : ''}: ` + q.items.filter((i) => i.text.trim()).map((i, n) => `${n + 1}. ${i.text}`).join(' | '));
  if (q.type === 'tf') lines.push(`Marked as: ${q.answer === false ? 'FALSE' : 'TRUE'}`);
  if (q.type === 'sort') lines.push('Categories and the answers placed in each: ' + q.categories.filter((c) => c.name.trim()).map((c) => `${c.name}: ${q.items.filter((i) => i.category === c.id && i.text.trim()).map((i) => i.text).join(', ') || '(none)'}`).join(' | '));
  if (q.type === 'wipeout') lines.push('Marked RIGHT (each must genuinely fit the question): ' + q.right.filter((i) => i.text.trim()).map((i) => i.text).join(' | '), 'Marked WRONG (each must genuinely NOT fit): ' + q.wrong.filter((i) => i.text.trim()).map((i) => i.text).join(' | '));
  if (q.type === 'match') lines.push('Pairs (left → right): ' + q.pairs.map((p) => `${p.left} → ${p.right.kind === 'image' ? '[a picture — cannot be checked here, treat as fine]' : p.right.value}`).join(' | '));
  if (q.type === 'pin') {
    if (q.media?.url?.includes('/maps/world') && q.pin) lines.push(`Target on a world map: ${q.place || 'unnamed'} at roughly latitude ${(90 - q.pin.y * 180).toFixed(1)}, longitude ${(q.pin.x * 360 - 180).toFixed(1)}`);
    else lines.push('Target is a spot on a custom picture; only check the question wording makes sense.');
  }
  if (q.media?.kind === 'image') lines.push(`Has a picture${q.media.credit ? ` (${q.media.credit})` : ''}; it is on screen while the question is asked.`);
  return lines.join('\n');
}
function hashOf(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return String(h); }
/** 'ok' | 'doubt' | 'wrong' | 'stale' | null */
function checkState(q) { if (!q.check) return null; return q.check.hash === hashOf(summaryOf(q)) ? q.check.verdict : 'stale'; }

function checkRounds(roundIds) {
  const qs = S.quiz.questions.filter((q) => roundIds.includes(q.round) && !validate(q).length);
  if (!qs.length) return toast('Nothing finished to check yet.', true);
  checkQuestions(qs);
}
async function checkQuestions(qs) {
  if (!S.ai) return toast('AI isn\'t switched on for this server yet.', true);
  const m = modal(`<h3>✔ Checking with AI</h3><p class="muted">Each question is looked up independently, with web search, and marked in the list: <b style="color:var(--ok)">✓</b> looks right, <b style="color:var(--warn)">?</b> worth a look, <b style="color:var(--bad)">✗</b> looks wrong.</p>
    <div class="gen-progress"><span class="spinner"></span><span id="c_step">Starting…</span></div><div id="c_done" class="mt"></div>
    <div class="row mt" style="justify-content:flex-end"><button class="btn btn-ghost" data-x>Stop</button></div>`);
  let stop = false; $('[data-x]', m).onclick = () => { stop = true; m.remove(); };
  const BATCH = 4, tally = { ok: 0, doubt: 0, wrong: 0 };
  let done = 0;
  try {
    for (let i = 0; i < qs.length && !stop; i += BATCH) {
      const batch = qs.slice(i, i + BATCH);
      const step = $('#c_step', m); if (step) step.textContent = `Checking ${i + 1}–${Math.min(qs.length, i + BATCH)} of ${qs.length}…`;
      const r = await api('verify', { questions: batch.map((q) => ({ id: q.id, summary: summaryOf(q) })) }, { timeout: 170000 });
      if (stop) break;
      for (const q of batch) {
        const c = r.checks[q.id];
        q.check = c ? { ...c, hash: hashOf(summaryOf(q)), at: new Date().toISOString() } : { verdict: 'doubt', note: 'The checker did not return a verdict for this one.', hash: hashOf(summaryOf(q)), at: new Date().toISOString() };
        tally[q.check.verdict]++;
      }
      done += batch.length; touch(); renderQList(); renderQForm();
      const d = $('#c_done', m); if (d) d.innerHTML = `<span style="color:var(--ok)">✓ ${tally.ok}</span> &nbsp; <span style="color:var(--warn)">? ${tally.doubt}</span> &nbsp; <span style="color:var(--bad)">✗ ${tally.wrong}</span> &nbsp; <span class="muted">of ${done}</span>`;
    }
    if (!stop) {
      const step = $('#c_step', m); if (step) step.textContent = 'Done.';
      $('.spinner', m)?.remove(); $('[data-x]', m).textContent = 'Close';
      const first = qs.find((q) => q.check?.verdict === 'wrong') || qs.find((q) => q.check?.verdict === 'doubt');
      if (first) { S.sel = S.quiz.questions.indexOf(first); renderQList(); renderQForm(); }
      save();
    }
  } catch (e) {
    const step = $('#c_step', m); if (step) step.textContent = e.message; $('.spinner', m)?.remove(); $('[data-x]', m).textContent = 'Close';
  }
}

// ------------------------------------------------------------------ AI writer
function aiModal(fresh, roundId) {
  const round = !fresh && S.quiz ? (S.quiz.rounds.find((r) => r.id === roundId) || roundOf(cur() || {}) || S.quiz.rounds[0]) : null;
  const m = modal(`<h3>✨ Write questions with AI${round ? ` <span class="muted">· Round ${roundIndex(round.id) + 1}</span>` : ''}</h3>
    ${S.ai ? '' : '<div class="error" style="margin-bottom:12px">AI isn\'t switched on for this server yet. Add an <b>ANTHROPIC_API_KEY</b> secret to the Supabase project and it will light up.</div>'}
    <div class="field"><label>${round ? 'Round name' : 'Topic or round'}</label><input type="text" id="g_topic" value="${esc(round ? round.title : '')}" placeholder="e.g. 1990s music, British geography, Christmas films, general knowledge" ${round && round.title ? '' : 'autofocus'}></div>
    <div class="field"><label>Brief for the AI <span class="muted">— optional</span></label><textarea id="g_brief" placeholder="Tell it what you want, as you'd tell a quizmaster. e.g. A sports round where every question is about Harry Kane: clubs, records, goals, England career.">${esc(round ? round.brief : '')}</textarea>${round ? '<div class="help">Saved on the round, so writing more later follows the same brief.</div>' : ''}</div>
    <div class="row"><div class="field grow"><label>How many</label><input type="number" id="g_count" value="8" min="1" max="40"></div>
      <div class="field grow"><label>Difficulty</label><select id="g_diff"><option value="mixed">Mixed</option><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option></select></div></div>
    <div class="field"><label>Question types</label><div class="row">${Object.entries(TYPES).map(([k, t]) => `<label class="check"><input type="checkbox" data-gt="${k}" ${['choice', 'text'].includes(k) ? 'checked' : ''}> ${t.icon} ${esc(t.label)}</label>`).join('')}</div>
      <div class="help">Drop-the-pin questions use a world map, so they suit places. Match-up questions get pictures when the pictures box is ticked.</div></div>
    <label class="check"><input type="checkbox" id="g_pics" checked> Find pictures for the questions (from Wikipedia)</label><br>
    <label class="check" style="margin-top:8px"><input type="checkbox" id="g_web" checked> Search the web to check facts and cover recent events</label>
    <div id="g_prog" class="mt hidden"></div>
    <div class="row mt" style="justify-content:flex-end"><button class="btn btn-ghost" data-x>Cancel</button><button class="btn btn-primary" data-ok ${S.ai ? '' : 'disabled'}>Write them</button></div>`);
  $('[data-x]', m).onclick = () => m.remove();
  $('[data-ok]', m).onclick = async () => {
    const topic = $('#g_topic', m).value.trim(), brief = $('#g_brief', m).value.trim();
    const types = $$('[data-gt]', m).filter((c) => c.checked).map((c) => c.dataset.gt);
    if (!types.length) return toast('Tick at least one question type.', true);
    if (!topic && !brief) return toast('Give it a topic or a brief.', true);
    if (round) { round.title = topic || round.title; round.brief = brief; touch(); renderQList(); }
    const btn = $('[data-ok]', m); btn.disabled = true; $('[data-x]', m).disabled = true;
    const prog = $('#g_prog', m); prog.classList.remove('hidden');
    const total = LQ.clamp(+$('#g_count', m).value || 8, 1, 40), BATCH = 4;
    // "topic" is what an older server reads; "brief" is the full instruction for the current one.
    const usedPictures = S.quiz ? S.quiz.questions.flatMap((q) => [q.media?.source, q.media?.url, ...(q.pairs || []).flatMap((p) => [p.right?.source, p.right?.value])]).filter((s) => typeof s === 'string' && /^https?:/.test(s)) : [];
    const opts = { topic: (brief ? `${topic}. ${brief}` : topic).slice(0, 200), title: topic, brief, usedPictures, difficulty: $('#g_diff', m).value, types, pictures: $('#g_pics', m).checked, web: $('#g_web', m).checked };
    // Written in batches of four: one edge-function request has a time limit, and with web
    // search and pictures a big round does not fit in it. Each batch lands in the quiz as it
    // arrives, and later batches are told what's already been written so they don't repeat it.
    const steps = ['thinking about the topic', 'searching the web', 'writing', 'finding pictures'];
    // Seeded with what the quiz already has, so "Add with AI" on an existing quiz doesn't repeat it.
    let written = 0, si = 0, start = null; const warnings = [], avoid = (!fresh && S.quiz) ? S.quiz.questions.map((q) => q.text).filter(Boolean) : [];
    const status = () => { const el = $('#g_step', m); if (el) el.textContent = `Writing questions ${written + 1}–${Math.min(total, written + BATCH)} of ${total} (${steps[si]})…`; };
    prog.innerHTML = `<div class="gen-progress"><span class="spinner"></span><span id="g_step"></span></div>`; status();
    const tick = setInterval(() => { si = Math.min(si + 1, steps.length - 1); status(); }, 10000);
    try {
      while (written < total) {
        si = 0; status();
        const r = await api('generate', { ...opts, count: Math.min(BATCH, total - written), avoid }, { timeout: 170000 });
        if (!r.questions.length) break;
        let rid = round?.id;
        if (fresh && start === null) {
          const name = topic ? topic.charAt(0).toUpperCase() + topic.slice(1) : 'AI quiz';
          S.quiz = normalizeQuiz({ title: name, questions: [] }); S.quiz.rounds[0].title = name; S.quiz.rounds[0].brief = brief; renderEditor();
        }
        rid = rid || S.quiz.rounds[0].id;
        let firstId = null;
        for (const q of r.questions) { q.round = rid; q.time = timeFor(q.type, S.quiz.settings); S.quiz.questions.push(q); avoid.push(q.text); firstId = firstId || q.id; }
        written += r.questions.length; warnings.push(...(r.warnings || []));
        touch(); if (start === null) { start = S.quiz.questions.findIndex((q) => q.id === firstId); } S.sel = start; renderQList(); renderQForm(); save();
      }
      clearInterval(tick); m.remove();
      toast(`Added ${written} question${written === 1 ? '' : 's'}. Read them through before you host — AI can be wrong.`);
      if (warnings.length) setTimeout(() => toast(warnings[0] + (warnings.length > 1 ? ` (+${warnings.length - 1} more)` : ''), true), 2800);
    } catch (e) {
      clearInterval(tick);
      prog.innerHTML = `<div class="error">${esc(e.message)}${written ? ` The ${written} question${written === 1 ? '' : 's'} written so far ${written === 1 ? 'is' : 'are'} in the quiz.` : ''}</div>`;
      btn.disabled = false; $('[data-x]', m).disabled = false;
    }
  };
}
window.addEventListener('beforeunload', (e) => { if (S.dirty) { e.preventDefault(); e.returnValue = ''; } });
</script>
