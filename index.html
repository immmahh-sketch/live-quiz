<script>
const { $, $$, esc, uid, api, TYPES, COLORS, DEFAULT_SETTINGS, newQuestion, validate, youtubeId, resizeImage, normalizeQuiz, orderQuestions, quizForSave, timeFor, composeCollage, buildCollageFor } = LQ;
const view = $('#view');
const S = { quizzes: [], quiz: null, sel: 0, ai: false, saveTimer: null, saving: false, dirty: false, planner: false };

let toastT;
function toast(msg, bad) {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (bad ? ' bad' : '');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), bad ? 5000 : 2500);
}
function modal(html) {
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal">${html}</div>`;
  // Clicking off only dismisses a pop-up with nothing to lose. Anything with a form or work in progress
  // stays until its own Cancel/Close, and gives a little nudge to say so.
  bg.addEventListener('click', (e) => {
    if (e.target !== bg) return;
    const box = bg.querySelector('.modal');
    if (!box || !box.querySelector('input, textarea, select, .spinner')) { bg.remove(); return; }
    box.classList.remove('nudge'); void box.offsetWidth; box.classList.add('nudge');
  });
  document.body.appendChild(bg);
  return bg;
}
function confirmBox(title, body, okLabel = 'Delete') {
  return new Promise((res) => {
    const m = modal(`<h3>${esc(title)}</h3><p class="muted">${esc(body)}</p><div class="row" style="justify-content:flex-end"><button class="btn btn-ghost" data-x>Cancel</button><button class="btn btn-danger" data-ok>${esc(okLabel)}</button></div>`);
    $('[data-x]', m).onclick = () => { m.remove(); res(false); };
    $('[data-ok]', m).onclick = () => { m.remove(); res(true); };
  });
}
const fmtDate = (s) => new Date(s).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });

// ------------------------------------------------------------------ boot
(async function boot() {
  if (!LQ.hostPassword()) return viewLogin();
  try { const r = await api('login'); S.ai = !!r.ai; }
  catch (e) { if (e.status === 401) { LQ.setHostPassword(''); return viewLogin('Wrong password.'); } view.innerHTML = `<div class="error">${esc(e.message)}</div>`; return; }
  const params = new URLSearchParams(location.search);
  if (params.get('game')) return openReport(params.get('game'));
  const id = params.get('quiz');
  if (id) return openQuiz(id);
  loadList();
})();

// ------------------------------------------------------------------ reports
async function openReport(id) {
  history.replaceState(null, '', '?game=' + id);
  $('#topRight').innerHTML = '';
  view.innerHTML = '<p class="muted">Loading the report…</p>';
  let g;
  try { g = (await api('game', { id })).game; } catch (e) { view.innerHTML = `<div class="error">${esc(e.message)}</div><p class="mt"><a href="index.html">Back to quizzes</a></p>`; return; }
  const rep = g.report, when = new Date(g.ended_at).toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  if (!rep) { view.innerHTML = `<div class="row" style="margin-bottom:14px"><button class="btn btn-ghost btn-sm" id="back">← Quizzes</button><h1 style="margin:0">${esc(g.title || 'Quiz')}</h1></div><div class="card"><p>This game was played before reports were kept, so only the scoreboard is here.</p><ol>${(g.players || []).map((p) => `<li>${esc(p.name)} — ${p.score}</li>`).join('')}</ol></div>`; $('#back').onclick = () => loadList(); return; }
  const ps = rep.players, qs = rep.questions;
  const cell = (e, pid) => { const a = e.players[pid]; if (!a) return '<td class="muted">—</td>'; const cls = a.skipped ? 'r-skip' : a.correct ? 'r-ok' : a.partial > 0 ? 'r-part' : a.answered ? 'r-no' : 'r-none'; return `<td class="${cls}"><div class="ans-t">${esc(a.answer)}</div><div class="ans-p">${a.points > 0 ? '+' : ''}${a.points}</div></td>`; };
  view.innerHTML = `
    <div class="row" style="margin-bottom:14px"><button class="btn btn-ghost btn-sm" id="back">← Quizzes</button><h1 style="margin:0">📊 ${esc(g.title || 'Quiz')}</h1><span class="muted small">${when} · game ${esc(g.code)} · ${qs.length} questions · ${ps.length} players</span><div class="grow"></div><button class="btn btn-ghost btn-sm" id="csv">⬇ Download CSV</button><button class="btn btn-ghost btn-sm" onclick="window.print()">🖨 Print</button></div>
    <div class="card" style="margin-bottom:16px"><h2 style="font-size:1.15rem">Final scores</h2><table class="rtable"><thead><tr><th>#</th><th>Player</th><th>Score</th><th>Right</th><th>Answered</th></tr></thead><tbody>${ps.map((p) => `<tr><td>${p.rank}</td><td>${p.emoji ? p.emoji + ' ' : ''}${esc(p.name)}${(rep.bots || []).includes(p.pid) ? ' <span class="tag">bot</span>' : ''}</td><td><b>${p.score}</b></td><td>${p.correct} of ${qs.length}</td><td>${p.answered} of ${qs.length}</td></tr>`).join('')}</tbody></table></div>
    <div class="card" style="overflow:auto"><h2 style="font-size:1.15rem">Every answer</h2><p class="muted small">Green is right, amber partly right, red wrong, grey skipped or not answered. The figure under each answer is the points it scored.</p>
      <table class="rtable answers-t"><thead><tr><th>#</th><th>Question</th><th>Answer</th>${ps.map((p) => `<th>${p.emoji ? p.emoji + ' ' : ''}${esc(p.name)}</th>`).join('')}</tr></thead>
      <tbody>${qs.map((e) => `<tr><td>${e.n}</td><td><div class="small muted">${esc(TYPES[e.type]?.label || e.type)}${e.round ? ' · ' + esc(e.round) : ''}</div>${esc(e.text)}</td><td class="small"><b>${esc(e.answer)}</b></td>${ps.map((p) => cell(e, p.pid)).join('')}</tr>`).join('')}</tbody></table></div>`;
  $('#back').onclick = () => loadList();
  $('#csv').onclick = () => {
    const esc2 = (s) => `"${String(s ?? '').replace(/"/g, '""')}"`;
    const rows = [['Question #', 'Round', 'Type', 'Question', 'Correct answer', 'Player', 'Answer', 'Result', 'Points']];
    for (const e of qs) for (const p of ps) { const a = e.players[p.pid]; if (!a) continue; rows.push([e.n, e.round, TYPES[e.type]?.label || e.type, e.text, e.answer, p.name, a.answer, a.skipped ? 'skipped' : a.correct ? 'right' : a.partial > 0 ? 'partly right' : a.answered ? 'wrong' : 'no answer', a.points]); }
    rows.push([]); rows.push(['Final scores']); rows.push(['Rank', 'Player', 'Score', 'Right', 'Answered']);
    for (const p of ps) rows.push([p.rank, p.name, p.score, p.correct, p.answered]);
    const blob = new Blob(['﻿' + rows.map((r) => r.map(esc2).join(',')).join('\r\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `${(g.title || 'quiz').replace(/[^\w\- ]+/g, '')} ${new Date(g.ended_at).toISOString().slice(0, 10)}.csv`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
}

// ------------------------------------------------------------------ login
function viewLogin(msg) {
  $('#topRight').innerHTML = '';
  view.innerHTML = `<div class="hero"><img src="assets/brand/logo.png" alt="Let's Quiz!"><h1>Let's Quiz!</h1><p>Build the quiz here. Share your screen on the call. Everyone plays on their phone.</p></div>
    <div class="card login"><h2>Host sign-in</h2><p class="muted">This is the host's portal. Players don't sign in — they scan the code on the screen.</p>
    ${msg ? `<div class="error" style="margin-bottom:12px">${esc(msg)}</div>` : ''}
    <form id="loginForm"><div class="field"><label>Password</label><input type="password" id="pw" autocomplete="current-password" autofocus></div>
    <button class="btn btn-primary btn-block">Sign in</button></form>
    <p class="center small mt" style="margin-bottom:0"><a href="host.html?quiz=demo" target="_blank">Try the demo quiz without signing in</a></p></div>`;
  $('#loginForm').onsubmit = async (e) => {
    e.preventDefault();
    const pw = $('#pw').value;
    try { const r = await api('login', {}, { password: pw }); LQ.setHostPassword(pw); S.ai = !!r.ai; loadList(); }
    catch (err) { viewLogin(err.status === 401 ? 'Wrong password.' : err.message); }
  };
}

// ------------------------------------------------------------------ quiz list
async function loadList() {
  view.innerHTML = '<p class="muted">Loading…</p>';
  try { const r = await api('list'); S.quizzes = r.quizzes; } catch (e) { view.innerHTML = `<div class="error">${esc(e.message)}</div>`; return; }
  renderList();
  api('games').then((r) => renderGames(r.games)).catch(() => {});
  api('bank_status').then((r) => renderBankPanel(r)).catch(() => {});
}
// ------------------------------------------------------------------ the question bank
/** Counts per type, with a warning when a type is running low. Click a type to browse it. */
function renderBankPanel(r) {
  const el = $('#bankpanel'); if (!el) return;
  S.bank = r.bank || {};
  const types = Object.keys(TYPES).filter((t) => S.bank[t]);
  const low = types.filter((t) => S.bank[t].low);
  el.innerHTML = `<div class="banksec"><div class="row" style="margin-bottom:6px"><h2 style="margin:0">🏦 Question bank</h2><span class="muted small">Pre-written questions the AI writer uses first, free. Each is marked off once it goes into a quiz and never comes round again.</span></div>
    ${low.length ? `<div class="error" style="margin-bottom:10px">⚠ Running low: ${low.map((t) => `${TYPES[t].label} (${S.bank[t].unused} left)`).join(', ')}. Time to top the bank up.</div>` : ''}
    <div class="bankgrid">${types.map((t) => `<button class="bankcell ${S.bank[t].low ? 'low' : ''}" data-bank="${t}"><span>${TYPES[t].icon} ${esc(TYPES[t].label)}</span><b>${S.bank[t].unused}</b><small>of ${S.bank[t].total} unused</small>${mixLine(S.bank[t].mix)}</button>`).join('')}${types.length ? '' : '<p class="muted small">Empty. Import a bank to get started.</p>'}</div>
    <div id="bankcats"></div></div>`;
  $$('[data-bank]').forEach((b) => b.onclick = () => bankBrowse(b.dataset.bank));
  if (low.length && !S.bankWarned) { S.bankWarned = true; toast(`Question bank running low: ${low.map((t) => TYPES[t].label).join(', ')}`, true); }
  renderBankCats(r.categories || {});
}
const mixLine = (mix) => mix ? `<small class="mix">${mix.easy} easy · ${mix.medium} medium · ${mix.hard} hard${mix.unrated ? ` · ${mix.unrated} unrated` : ''}</small>` : '';
/** The same bank cut by category (the topic each question was written for), grouped as bank/topics.json groups them. */
async function renderBankCats(cats) {
  const el = $('#bankcats'); if (!el) return;
  S.bankCats = cats;
  if (!S.topicGroups) {
    try { const t = await (await fetch('bank/topics.json')).json(); S.topicGroups = new Map(t.map((x) => [x.name, x.group])); S.topicOrder = t.map((x) => x.name); }
    catch { S.topicGroups = new Map(); S.topicOrder = []; }
  }
  const names = Object.keys(cats);
  if (!names.length) { el.innerHTML = ''; return; }
  const at = (n) => { const i = S.topicOrder.indexOf(n); return i < 0 ? 1e9 : i; };
  names.sort((a, b) => at(a) - at(b) || a.localeCompare(b));
  const groups = new Map();
  for (const n of names) { const g = n ? S.topicGroups.get(n) || 'Other' : 'Uncategorised'; if (!groups.has(g)) groups.set(g, []); groups.get(g).push(n); }
  let open = true; try { open = localStorage.getItem('lq_bankcats') !== 'closed'; } catch {}
  el.innerHTML = `<details class="bankcats" ${open ? 'open' : ''}><summary><b>📚 By category</b> <span class="muted small">· ${names.length} categories. Click one to see its question types.</span></summary>
    ${[...groups].map(([g, ns]) => `<div class="bankgroup">${esc(g)}</div><div class="bankgrid">${ns.map((n) => { const c = cats[n]; return `<button class="bankcell" data-bankcat="${esc(n)}"><span>${esc(n || 'Uncategorised')}</span><b>${c.unused}</b><small>of ${c.total} unused · ${Object.keys(c.types).length} types</small>${mixLine(c.mix)}</button>`; }).join('')}</div>`).join('')}</details>`;
  $('details', el).ontoggle = (e) => { try { localStorage.setItem('lq_bankcats', e.target.open ? 'open' : 'closed'); } catch {} };
  $$('[data-bankcat]', el).forEach((b) => b.onclick = () => bankCategory(b.dataset.bankcat));
}
/** One category's questions, type by type. Click a type to browse just this category's questions of that type. */
function bankCategory(name) {
  const c = S.bankCats?.[name]; if (!c) return;
  const types = Object.keys(TYPES).filter((t) => c.types[t]);
  const none = Object.keys(TYPES).filter((t) => !c.types[t] && S.bank?.[t]);
  const m = modal(`<h3>📚 ${esc(name || 'Uncategorised')} <span class="muted small">· ${c.unused} unused of ${c.total}</span></h3>
    <div class="bankgrid">${types.map((t) => `<button class="bankcell" data-bct="${t}"><span>${TYPES[t].icon} ${esc(TYPES[t].label)}</span><b>${c.types[t].unused}</b><small>of ${c.types[t].total} unused</small></button>`).join('')}</div>
    ${none.length ? `<p class="muted small" style="margin:10px 0 0">None yet: ${none.map((t) => esc(TYPES[t].label)).join(', ')}.</p>` : ''}
    <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn btn-primary btn-sm" data-x>Close</button></div>`);
  $('[data-x]', m).onclick = () => m.remove();
  $$('[data-bct]', m).forEach((b) => b.onclick = () => { m.remove(); bankBrowse(b.dataset.bct, name); });
}
async function bankBrowse(type, cat = null) {
  const m = modal(`<h3>🏦 ${TYPES[type].icon} ${esc(TYPES[type].label)} bank</h3><p class="muted small">Loading…</p>`);
  let list = [];
  try { list = (await api('bank_list', { type })).questions; } catch (e) { $('p', m).textContent = e.message; return; }
  let filter = '', show = 'all', diff = 'all';
  const draw = () => {
    list = list.filter((q) => !q.gone);
    const pool = cat === null ? list : list.filter((q) => (q.category || '') === cat);
    const rows = pool.filter((q) => (show === 'all' || (show === 'rejected' ? q.rejected : show === 'fresh' ? !q.used : q.used && !q.rejected)) && (diff === 'all' || (diff === 'unrated' ? !q.difficulty : q.difficulty === diff)) && (!filter || (q.text + ' ' + q.answer + ' ' + q.category).toLowerCase().includes(filter)));
    const unused = pool.filter((q) => !q.used).length, rejected = pool.filter((q) => q.rejected).length;
    $('.modal', m).innerHTML = `<h3>🏦 ${TYPES[type].icon} ${esc(TYPES[type].label)} bank <span class="muted small">· ${unused} unused of ${pool.length}</span>${cat === null ? '' : ` <button class="tag" data-allcat title="Show every category">📚 ${esc(cat || 'Uncategorised')} ✕</button>`}</h3>
      <div class="row" style="margin-bottom:8px"><input type="text" id="bk_f" class="grow" placeholder="Search the bank" value="${esc(filter)}"><select id="bk_show"><option value="all" ${show === 'all' ? 'selected' : ''}>Everything</option><option value="fresh" ${show === 'fresh' ? 'selected' : ''}>Fresh (${unused})</option><option value="used" ${show === 'used' ? 'selected' : ''}>Used in a quiz</option><option value="rejected" ${show === 'rejected' ? 'selected' : ''}>👎 Rejected (${rejected})</option></select><select id="bk_diff"><option value="all" ${diff === 'all' ? 'selected' : ''}>Any difficulty</option><option value="easy" ${diff === 'easy' ? 'selected' : ''}>Easy</option><option value="medium" ${diff === 'medium' ? 'selected' : ''}>Medium</option><option value="hard" ${diff === 'hard' ? 'selected' : ''}>Hard</option><option value="unrated" ${diff === 'unrated' ? 'selected' : ''}>Unrated</option></select><button class="btn btn-ghost btn-sm" data-x>Close</button></div>
      ${show === 'rejected' ? '<p class="muted small" style="margin:0 0 8px">Questions a host turned down. Click one to see it, then ✏️ Edit to put it right and send it back into stock. ↺ restores one as it is; ✕ drops it for good.</p>' : ''}
      <div class="banklist">${rows.slice(0, 400).map((q) => `<div class="bankrow ${q.used ? 'used' : ''}" data-bv="${esc(q.id)}" style="cursor:pointer" title="Click to see the whole question"><div><div class="t">${q.media === 'youtube' ? '<span title="Has a video clip: click to watch">🎬</span> ' : q.media === 'audio' ? '<span title="Has a music clip: click to listen">🎵</span> ' : ''}${esc(q.text || (q.answer ? '' : ''))}${q.pct ? ` <span class="tag">${q.pct}%</span>` : ''}${q.difficulty ? ` <span class="tag dif-${q.difficulty}">${q.difficulty}</span>` : ''}</div><div class="a">${esc(q.answer || '')}${q.category ? ` <span class="muted">· ${esc(q.category)}</span>` : ''}${q.used ? ` <span class="usedtag">${q.rejected ? '👎 rejected' : 'used'} ${esc((q.used.at || '').slice(0, 10))}</span>` : ''}</div></div><div class="row" style="gap:4px">${q.used ? `<button class="btn btn-ghost btn-sm" data-br="${esc(q.id)}" title="Back into stock as a fresh question">↺</button>` : ''}<button class="btn btn-ghost btn-sm" data-bd="${esc(q.id)}" title="Remove from the bank">✕</button></div></div>`).join('')}${rows.length > 400 ? `<p class="muted small">Showing 400 of ${rows.length}; narrow the search.</p>` : ''}</div>`;
    $('#bk_f', m).oninput = (e) => { filter = e.target.value.toLowerCase(); draw(); $('#bk_f', m).focus(); $('#bk_f', m).setSelectionRange(filter.length, filter.length); };
    $('[data-x]', m).onclick = () => m.remove();
    if ($('[data-allcat]', m)) $('[data-allcat]', m).onclick = () => { cat = null; draw(); };
    $('#bk_show', m).onchange = (e) => { show = e.target.value; draw(); };
    $('#bk_diff', m).onchange = (e) => { diff = e.target.value; draw(); };
    $$('[data-bd]', m).forEach((b) => b.onclick = async () => { try { await api('bank_delete', { type, id: b.dataset.bd }); list = list.filter((q) => q.id !== b.dataset.bd); draw(); } catch (e) { toast(e.message, true); } });
    $$('[data-bv]', m).forEach((r) => r.onclick = (e) => { if (e.target.closest('button')) return; bankView(type, r.dataset.bv, list.find((q) => q.id === r.dataset.bv), draw); });
    $$('[data-br]', m).forEach((b) => b.onclick = async () => { try { await api('bank_restore', { type, id: b.dataset.br }); const q = list.find((x) => x.id === b.dataset.br); if (q) { q.used = null; q.rejected = false; } draw(); } catch (e) { toast(e.message, true); } });
  };
  draw();
}
/** The whole of one bank question, read-only: every option, accepted answer, item, category, picture and tag. */
async function bankView(type, id, summary, after) {
  const m = modal(`<h3>${TYPES[type].icon} ${esc(TYPES[type].label)}</h3><p class="muted small">Loading…</p>`);
  let q;
  try { q = (await api('bank_get', { type, id })).question; } catch (e) { $('p', m).textContent = e.message; return; }
  const li = (arr) => `<ol style="margin:4px 0 0 18px;padding:0">${arr.map((x) => `<li>${esc(x)}</li>`).join('')}</ol>`;
  const kv = (k, v) => v ? `<div style="margin-top:8px"><div class="muted small">${esc(k)}</div><div>${v}</div></div>` : '';
  let body = '';
  if (q.type === 'choice') body = kv('Options', `<ul style="margin:4px 0 0 18px;padding:0">${(q.options || []).map((o) => `<li>${o.id === q.correct ? '<b>✓ ' + esc(o.text) + '</b>' : esc(o.text)}</li>`).join('')}</ul>`);
  else if (q.type === 'tf') body = kv('Answer', `<b>${q.answer ? 'True' : 'False'}</b>`) + kv('Why', esc(q.why || q.explain || ''));
  else if (q.type === 'order') body = kv('Right order', li((q.items || []).map((i) => i.text))) + kv('Hint', esc(q.hint || ''));
  else if (q.type === 'sort') body = kv('Categories', (q.categories || []).map((c) => `<div><b>${esc(c.name)}</b>: ${esc((q.items || []).filter((i) => i.category === c.id).map((i) => i.text).join(', '))}</div>`).join(''));
  else if (q.type === 'match') body = kv('Pairs', li((q.pairs || []).map((p) => `${p.left} → ${p.right?.value || p.right?.text || p.right || ''}`)));
  else if (q.type === 'wheel') body = kv('Phrase', `<b>${esc(q.phrase)}</b>`) + kv('Clue', esc(q.clue || q.category || ''));
  else if (q.type === 'pin') body = kv('Place', `<b>${esc(q.place)}</b>`) + kv('Map', esc(q.map || q.region || ''));
  else if (q.type === 'tune') body = kv('Track', `<b>${esc(q.track)}</b> — ${esc(q.artist)}${q.year ? ' (' + esc(String(q.year)) + ')' : ''}`) + kv('Ask', esc(q.ask || '')) + (q.previewUrl ? `<audio controls src="${esc(q.previewUrl)}" style="margin-top:8px;width:100%"></audio>` : '');
  else if (q.type === 'smash') body = kv('Picture answer', esc(q.pictureAnswer)) + kv('Clue answer', esc(q.clueAnswer)) + kv('Smash', `<b>${esc(q.smash || (q.answers || [])[0] || '')}</b>`);
  else if (q.type === 'rhyme') body = kv('First answer', `<b>${esc(q.answer1 || '')}</b>`) + kv('Second clue', esc(q.text2 || '')) + kv('Second answer', `<b>${esc(q.answer2 || '')}</b>`);
  else if (q.type === 'wipeout') body = kv('Right answers', li((q.right || []).map((i) => i.text))) + kv('Wipeouts', li((q.wrong || []).map((i) => i.text)));
  else if (q.type === 'highlow') body = kv('Highbrow answer', `<b>${esc((q.answers || [])[0] || '')}</b>`) + kv('Lowbrow clue', esc(q.low || q.lowText || '')) + kv('Also accepted', esc((q.answers || []).slice(1).join(', ')));

/** Edits a bank question in place, in the viewer's own window: the wording and the answers, laid out per type.

function bankEdit(m, type, q, summary, after) {
  const t = q.type, lines = (a) => (a || []).join('\n'), rid = (p) => p + '_' + Math.random().toString(36).slice(2, 10);
  const inp = (k, label, v, ph = '') => `<label class="bkf"><span class="muted small">${esc(label)}</span><input type="text" data-k="${k}" value="${esc(v ?? '')}" placeholder="${esc(ph)}"></label>`;
  const area = (k, label, v, rows = 3) => `<label class="bkf"><span class="muted small">${esc(label)}</span><textarea data-k="${k}" rows="${rows}">${esc(v ?? '')}</textarea></label>`;
  const note = (s) => `<p class="muted small" style="margin:6px 0 0">${esc(s)}</p>`;
  const qtext = area('text', { smash: 'Clue (for the second answer)', highlow: 'Highbrow question', rhyme: 'First clue', wipeout: 'What the right answers have in common', race: 'Title' }[t] || 'Question', q.text, 2);
  const answers = area('answers', 'Accepted answers, one per line (the first is shown as the answer)', lines(q.answers), 3);

  else if (t === 'tf') f = qtext + `<label class="bkf"><span class="muted small">Answer</span><select data-k="answer"><option value="true" ${q.answer ? 'selected' : ''}>True</option><option value="false" ${q.answer ? '' : 'selected'}>False</option></select></label>`;
  else if (t === 'order') f = qtext + area('items', 'Items in the right order, one per line', lines((q.items || []).map((i) => i.text)), 5) + inp('hint', 'Hint', q.hint, 'e.g. earliest first');
  else if (t === 'sort') f = qtext + (q.categories || []).map((c, n) => inp('cat' + n, `Group ${n + 1}`, c.name) + area('catitems' + n, `Goes in ${c.name || 'group ' + (n + 1)}, one per line`, lines((q.items || []).filter((i) => i.category === c.id).map((i) => i.text)), 3)).join('');
  else if (t === 'match') f = qtext + area('pairs', 'Pairs, one per line: left | right (a picture on the right stays as it is)', lines((q.pairs || []).map((p) => p.right?.kind === 'image' ? p.left : `${p.left} | ${p.right?.value ?? p.right?.text ?? p.right ?? ''}`)), 5);
  else if (t === 'wheel') f = inp('phrase', 'Phrase', q.phrase);
  else if (t === 'pin') f = qtext + inp('place', 'Answer (the place)', q.place) + note('The spot on the map stays where it is, so keep the same place and change the clue.');
  else if (t === 'highlow') f = qtext + area('lowText', 'Lowbrow question', q.lowText || q.low, 2) + answers;
  else if (t === 'smash') f = inp('pictureAnswer', 'Picture answer (who or what is in the picture)', q.pictureAnswer) + qtext + inp('clueAnswer', 'Clue answer', q.clueAnswer) + note('The smash is worked out when you save. A new picture is found if the picture answer changes.');
  else if (t === 'rhyme') f = qtext + inp('answer1', 'First answer', q.answer1) + area('text2', 'Second clue', q.text2, 2) + inp('answer2', 'Second answer (rhymes with the first)', q.answer2);
  else if (t === 'tune') f = inp('track', 'Song', q.track) + inp('artist', 'Artist', q.artist) + `<label class="bkf"><span class="muted small">Players name the</span><select data-k="ask">${['song', 'artist', 'year', 'film', 'lyric'].map((a) => `<option ${q.ask === a ? 'selected' : ''}>${a}</option>`).join('')}</select></label>` + answers + note('A new clip is found if the song or artist changes.');
  else if (t === 'wipeout') f = qtext + area('right', 'Right answers, one per line', lines((q.right || []).map((i) => i.text)), 6) + area('wrong', 'Wipeouts (wrong answers), one per line', lines((q.wrong || []).map((i) => i.text)), 5);
  else if (t === 'race') f = qtext + area('bank', 'Questions, one per line: question | right answer | wrong | wrong | wrong', lines((q.bank || []).map((b) => [b.text, ...(b.options || [])].join(' | '))), 8);

  else f = qtext + answers;
  $('.modal', m).innerHTML = `<h3>✏️ Edit: ${TYPES[type].icon} ${esc(TYPES[type].label)}</h3>${q.used?.note ? `<p class="muted small" style="margin:0">Note: ${esc(q.used.note)}</p>` : ''}${f}
    ${q.used ? `<label class="row" style="gap:8px;margin-top:12px;flex-wrap:nowrap"><input type="checkbox" id="bk_fresh" ${q.used.rejected ? 'checked' : ''}><span>Put it back into stock as a fresh question</span></label>` : ''}
    <div class="row" style="justify-content:flex-end;margin-top:14px;gap:6px"><button class="btn btn-ghost btn-sm" data-cancel>Cancel</button><button class="btn btn-primary btn-sm" data-save>Save</button></div>`;
  const val = (k) => ($(`[data-k="${k}"]`, m)?.value || '').trim();
  const ls = (k) => val(k).split('\n').map((s) => s.trim()).filter(Boolean);

        const pick = +($('input[name=bk_ok]:checked', m)?.value ?? -1);
        if (opts.length < 2) throw new Error('A multiple-choice question needs at least two options.');
        if (!opts.some((o) => o.n === pick)) throw new Error('Tick the right option.');
        nq.options = opts.map((o) => ({ id: q.options?.[o.n]?.id || rid('o'), text: o.text }));
        nq.correct = nq.options[opts.findIndex((o) => o.n === pick)].id;
      } else if (t === 'tf') nq.answer = val('answer') === 'true';
      else if (t === 'order') { const it = ls('items'); if (it.length < 3) throw new Error('Give at least three items.'); nq.items = it.map((text, n) => ({ id: q.items?.[n]?.id || rid('i'), text })); nq.hint = val('hint'); }
      else if (t === 'sort') {
        nq.categories = (q.categories || []).map((c, n) => ({ id: c.id, name: val('cat' + n) || c.name }));
        nq.items = nq.categories.flatMap((c, n) => ls('catitems' + n).map((text) => ({ id: (q.items || []).find((i) => i.text === text && i.category === c.id)?.id || rid('i'), text, category: c.id })));
        if (nq.items.length < 4) throw new Error('Give at least four items to sort.');
      } else if (t === 'match') {
        const pl = ls('pairs'); if (pl.length !== (q.pairs || []).length) throw new Error(`Keep one line for each of the ${(q.pairs || []).length} pairs.`);
        nq.pairs = q.pairs.map((p, n) => { const [l, r] = pl[n].split('|').map((s) => s.trim()); const np = { ...p, left: l || p.left }; if (r && p.right?.kind !== 'image') np.right = typeof p.right === 'object' && p.right ? { ...p.right, value: r } : { kind: 'text', value: r }; return np; });
      } else if (t === 'wheel') { nq.phrase = val('phrase').toUpperCase(); nq.text = nq.phrase; if (!nq.phrase) throw new Error('Give the phrase.'); }
      else if (t === 'pin') { nq.place = val('place'); if (!nq.place) throw new Error('Give the place.'); }
      else if (t === 'highlow') nq.lowText = val('lowText');
      else if (t === 'smash') { nq.pictureAnswer = val('pictureAnswer'); nq.clueAnswer = val('clueAnswer'); }
      else if (t === 'rhyme') { nq.answer1 = val('answer1'); nq.text2 = val('text2'); nq.answer2 = val('answer2'); if (!nq.answer1 || !nq.answer2 || !nq.text2) throw new Error('Fill in both clues and both answers.'); }
      else if (t === 'tune') { nq.track = val('track'); nq.artist = val('artist'); nq.ask = val('ask'); if (!nq.track || !nq.artist) throw new Error('Give the song and the artist.'); }
      else if (t === 'wipeout') {
        const keep = (list, texts, p) => texts.map((text) => ({ id: (list || []).find((i) => i.text === text)?.id || rid(p), text }));
        nq.right = keep(q.right, ls('right'), 'w'); nq.wrong = keep(q.wrong, ls('wrong'), 'w');
        if (nq.right.length < 3 || nq.wrong.length < 2) throw new Error('Give at least three right answers and two wipeouts.');
      } else if (t === 'race') {
        nq.bank = ls('bank').map((line) => { const p = line.split('|').map((s) => s.trim()).filter(Boolean); if (p.length < 2) throw new Error(`“${line}” needs a question and a right answer.`); return { id: (q.bank || []).find((b) => b.text === p[0])?.id || rid('b'), text: p[0], options: p.slice(1) }; });

        nq.target = 10;
      }
    } catch (e) { toast(e.message, true); return; }
    const fresh = !!$('#bk_fresh', m)?.checked;
    const btn = $('[data-save]', m); btn.disabled = true; btn.textContent = 'Saving…';
    try {
      const r = await api('bank_edit', { type, id: q.id, question: nq, fresh });
      const s = r.question;
      if (summary) {
        summary.text = s.text || s.phrase || s.place || '';
        summary.answer = s.type === 'choice' ? (s.options || []).find((o) => o.id === s.correct)?.text : s.type === 'tf' ? String(s.answer) : s.type === 'wheel' ? s.phrase : s.type === 'pin' ? s.place : s.type === 'order' ? (s.items || []).map((i) => i.text).join(' → ') : s.type === 'rhyme' ? [s.answer1, s.answer2].join(' / ') : s.type === 'smash' ? s.smash : s.type === 'tune' ? `${s.track} — ${s.artist}` : (s.answers || [])[0] || '';
        if (fresh) { summary.used = null; summary.rejected = false; }
      }
      m.remove(); after?.(); toast(fresh ? 'Saved and back in stock.' : 'Saved.');

    } catch (e) { btn.disabled = false; btn.textContent = 'Save'; toast(e.message, true); }
  };
}

function loadScript(src) { return new Promise((res, rej) => { if (document.querySelector(`script[src="${src}"]`)) return res(); const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Could not load the PDF reader. Check your connection.')); document.head.appendChild(s); }); }
/** Each page of a PDF as a JPEG, for the AI to read. */
async function pdfPages(file, step) {
  if (!window.pdfjsLib) {
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
  const doc = await window.pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  const pages = [];
  for (let i = 1; i <= Math.min(doc.numPages, 60); i++) {
    step(`Opening page ${i} of ${doc.numPages}…`);
    const page = await doc.getPage(i), w = page.getViewport({ scale: 1 }).width, vp = page.getViewport({ scale: Math.min(3, 1800 / w) });
    const c = document.createElement('canvas'); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    await page.render({ canvasContext: ctx, viewport: vp }).promise;
    pages.push(c.toDataURL('image/jpeg', 0.82));
  }
  return pages;
}
/** Cuts a box (fractions of the page) out of a page image and returns it as base64 JPEG, with a small margin. */
function cropPage(src, box) {
  return new Promise((res, rej) => {
    const im = new Image(); im.onerror = () => rej(new Error('page image')); im.onload = () => {
      const W = im.naturalWidth, H = im.naturalHeight, pad = 0.004;
      const x0 = Math.max(0, (box[0] - pad) * W), y0 = Math.max(0, (box[1] - pad) * H), x1 = Math.min(W, (box[2] + pad) * W), y1 = Math.min(H, (box[3] + pad) * H);
      const scale = Math.max(1, 900 / Math.max(1, x1 - x0));
      const c = document.createElement('canvas'); c.width = Math.round((x1 - x0) * Math.min(scale, 2.5)); c.height = Math.round((y1 - y0) * Math.min(scale, 2.5));
      c.getContext('2d').drawImage(im, x0, y0, x1 - x0, y1 - y0, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', 0.88).split(',')[1]);
    };
    im.src = src;
  });
}
function kAnswer(q) {
  if (q.type === 'choice') return q.options.map((o) => (o.id === q.correct ? '✓ ' : '') + o.text).join('  ·  ');
  if (q.type === 'tf') return q.answer ? '✓ True' : '✓ False';
  if (q.type === 'order') return (q.items || []).map((i) => i.text).join(' → ');

    const step = (t) => { const el = $('#k_step', m); if (el) step.el = el, el.textContent = t; };
    try {
      let r = null;
      if (url) r = await api('kahoot_import', { url }, { timeout: 170000 });
      else {
        // Read four pages at a time (overlapping by one, so a slide split across a page break is not lost), stopping
        // early if the first batch finds the Kahoot's link and Kahoot shares it; otherwise stitch by slide number.
        const pages = await pdfPages(file, step), got = new Map(), usages = []; let title = '';
        for (let i = 0; i < pages.length; i += 4) {
          step(`Reading pages ${i + 1}–${Math.min(pages.length, i + 4)} of ${pages.length}…`);
          const part = await api('kahoot_import', { pages: pages.slice(i ? i - 1 : 0, i + 4), offset: i ? i - 1 : 0 }, { timeout: 170000 });
          usages.push(part.usage);
          if (part.source === 'kahoot') { r = part; break; }
          title = title || part.title;
          for (const q of part.questions || []) { const k = q.kn ? 'n' + q.kn : 't' + String(q.text).toLowerCase(); if (!got.has(k)) got.set(k, q); }
        }
        if (!r) {
          let qs = [...got.values()].sort((a, b) => (a.kn || 1e9) - (b.kn || 1e9)); const top = Math.max(0, ...qs.map((q) => q.kn || 0));
          const dead = qs.filter((q) => q.kvideo).length; qs = qs.filter((q) => !q.kvideo); // their YouTube clips no longer play, so they cannot be asked
          // Each picture is cut out of its page and uploaded, so 'Name the celeb' questions keep their photos.
          let done = 0; const withPic = qs.filter((q) => q.kpic && pages[q.kpic.page]);

          }

        }
        r.usages = usages;
      }
      (r.questions || []).forEach((q) => { delete q.kn; delete q.kpic; delete q.kvideo; });
      if (!r.questions?.length) throw new Error('No quiz questions were found in that.');
      found = r;
      out.innerHTML = `<div class="notice">${r.source === 'kahoot' ? '✓ Found it on Kahoot: the exact questions, answers, timers and pictures.' : 'Read from the PDF, pictures cut from the pages (the Kahoot is private, so Kahoot would not share it directly). Check the answers and pictures below.'}${r.skipped ? ` ${r.skipped} slide${r.skipped === 1 ? '' : 's'} with no quiz equivalent (title slides, polls, word clouds) left out.` : ''}${r.deadVideos ? ` ${r.deadVideos} question${r.deadVideos === 1 ? '' : 's'} left out because ${r.deadVideos === 1 ? 'its' : 'their'} YouTube video no longer plays.` : ''}</div>
        <div class="field"><label>Quiz title</label><input type="text" id="k_title" value="${esc(r.title)}"></div>
        <div class="kprev">${r.questions.map((q, i) => `<div class="kq">${q.media?.url ? `<img src="${esc(q.media.url)}" alt="">` : '<span class="kq-n">' + (TYPES[q.type]?.icon || '') + '</span>'}<div><b>${i + 1}. ${esc(q.text)}</b><div class="small muted">${esc(kAnswer(q))}</div></div></div>`).join('')}</div>`;
      btn.disabled = false; btn.textContent = `Create the quiz (${r.questions.length} questions)`;
    } catch (e) { out.innerHTML = `<div class="error">${esc(e.message)}</div>`; btn.disabled = false; }
  };
}

/** The main panel as a planner: one card per round with its title, blurb, size, types and AI prompt. */
function renderPlanner(focusId) {
  const box = $('#qform'); const qz = S.quiz;
  const countIn = (r) => qz.questions.filter((q) => q.round === r.id && q.type !== 'slide').length;
  box.innerHTML = `<div class="row" style="justify-content:space-between;margin-bottom:12px"><h3 style="margin:0">📋 Rounds</h3><div class="row"><button class="btn btn-ghost btn-sm" id="pl_close">Back to questions</button><button class="btn btn-ghost btn-sm" id="pl_tpl" title="Keep this set-up (rounds, types, prompts) to write a fresh quiz from later">💾 Save as format</button><button class="btn btn-primary btn-sm" id="pl_writeall" ${S.ai ? '' : 'disabled'}>✨ Write every round with AI</button></div></div>
    ${qz.settings.template ? '<div class="notice" style="margin-bottom:12px">📋 This is a <b>weekly format</b>: a saved set-up with no questions of its own. Change the rounds, types and prompts here; then on the quiz list press <b>New quiz from this</b> to write a fresh quiz in this shape.</div>' : ''}
    <p class="muted small">Set each round up here: what it's called, what it's about, how many questions, which types, and what to tell the AI. Then write a round, or all of them, with AI — or add questions by hand from the list on the left.</p>
    <div class="rplan">${qz.rounds.map((r, i) => `<div class="rcard" data-r="${r.id}">
      <div class="rhead"><span class="badge">Round ${i + 1}</span><input type="text" data-pt="${r.id}" value="${esc(r.title)}" placeholder="Round title, e.g. Sports" style="font-weight:900;font-size:1.05rem;max-width:420px"><div class="grow"></div><span class="muted small">${countIn(r)} question${countIn(r) === 1 ? '' : 's'} so far</span>${qz.rounds.length > 1 ? `<button class="btn btn-ghost btn-sm" data-pdel="${r.id}" style="color:var(--bad)">Delete</button>` : ''}</div>
      <div class="field"><label>What the round is about <span class="muted">— shown on the round card before it starts</span></label><input type="text" data-pi="${r.id}" value="${esc(r.intro)}" placeholder="e.g. Ten questions on the beautiful game, from Sunday league to the World Cup"></div>
      <label class="check" style="margin:-4px 0 12px"><input type="checkbox" data-pprac="${r.id}" ${r.practice ? 'checked' : ''}> 🧪 Practice round: every question is played but scores nothing, to show people the new games</label>
      <div class="field"><label>How many of each question type <span class="muted">— total <b data-ptotal="${r.id}">${r.count}</b></span></label><div class="mixgrid">${Object.entries(TYPES).map(([k, t]) => `<label><span>${t.icon} ${esc(t.label)}</span><input type="number" data-pmix="${r.id}" data-type="${k}" min="0" max="40" value="${r.mix[k] || 0}"></label>`).join('')}</div></div>
      <div class="field"><label>Prompt for the AI <span class="muted">— what you want, as you'd tell a quizmaster</span></label><textarea data-pb="${r.id}" placeholder="e.g. A sports round where every question is about Harry Kane: clubs, records, goals, England career.">${esc(r.brief)}</textarea></div>
      <div class="row"><button class="btn btn-sm" data-pai="${r.id}" ${S.ai ? '' : 'disabled'}>✨ Write this round with AI</button><button class="btn btn-ghost btn-sm" data-padd="${r.id}">+ Add a question by hand</button></div>
    </div>`).join('')}
    <button class="btn btn-block" id="pl_add">+ Add a round</button></div>`;
  const R = (id) => qz.rounds.find((x) => x.id === id);
  $$('[data-pt]').forEach((i) => i.oninput = () => { R(i.dataset.pt).title = i.value; touch(); renderQList(); });
  $$('[data-pi]').forEach((i) => i.oninput = () => { R(i.dataset.pi).intro = i.value; touch(); });
  $$('[data-pprac]').forEach((i) => i.onchange = () => { const r = R(i.dataset.pprac); r.practice = i.checked; if (r.practice && !r.intro) r.intro = 'A practice round: have a go at each game. No points!'; touch(); renderQList(); renderPlanner(r.id); });
  $$('[data-pb]').forEach((i) => i.oninput = () => { R(i.dataset.pb).brief = i.value; touch(); renderQList(); });
  $$('[data-pmix]').forEach((i) => i.onchange = () => { const r = R(i.dataset.pmix); const n = LQ.clamp(Math.round(+i.value) || 0, 0, 40); i.value = n; if (n) r.mix[i.dataset.type] = n; else delete r.mix[i.dataset.type]; r.types = Object.keys(r.mix); r.count = Object.values(r.mix).reduce((a, b) => a + b, 0); $(`[data-ptotal="${r.id}"]`).textContent = r.count; touch(); renderQList(); });
  $$('[data-pdel]').forEach((b) => b.onclick = async () => { const r = R(b.dataset.pdel), n = countIn(r); if (n && !(await confirmBox('Delete this round?', `Its ${n} question${n === 1 ? '' : 's'} will be deleted too.`))) return; qz.questions = qz.questions.filter((q) => q.round !== r.id); qz.rounds = qz.rounds.filter((x) => x !== r); touch(); renderQList(); renderPlanner(); });
  $$('[data-pai]').forEach((b) => b.onclick = async () => { const r = R(b.dataset.pai); if (!r.count) return toast('Set how many of each type first.', true); if (!r.title && !r.brief) return toast('Give the round a title or a prompt first.', true); try { await generateForRound(r); toast('Round written. Read it through before you host.'); S.planner = false; renderQList(); renderQForm(); } catch {} });
  $$('[data-padd]').forEach((b) => b.onclick = () => pickType(b.dataset.padd));
  $('#pl_add').onclick = () => { qz.rounds.push({ id: uid('r'), title: `Round ${qz.rounds.length + 1}`, intro: '', brief: '', mix: { choice: 5, text: 3 }, count: 8, types: ['choice', 'text'] }); touch(); renderQList(); renderPlanner(qz.rounds[qz.rounds.length - 1].id); };
  $('#pl_close').onclick = () => { S.planner = false; renderQForm(); };
  $('#pl_writeall').onclick = () => { if (S.quiz.settings.template) return toast('This is a format. Write a quiz from it on the quiz list with “New quiz from this”.', true); writeAllRounds(); };
  $('#pl_tpl').onclick = saveAsTemplate;
  if (focusId) $(`[data-pt="${focusId}"]`)?.focus();
}
/** What a round still needs, type by type: its mix minus what is already in it. */
function roundShortfall(r) {
  const have = {}; for (const q of S.quiz.questions) if (q.round === r.id) have[q.kind || q.type] = (have[q.kind || q.type] || 0) + 1;
  return Object.entries(r.mix || {}).map(([type, n]) => ({ type, need: Math.max(0, n - (have[type] || 0)) })).filter((x) => x.need > 0);
}
/** Writes every round that still needs questions, one after another, following each round's own mix. */
async function writeAllRounds() {
  const todo = S.quiz.rounds.filter((r) => roundShortfall(r).length);
  if (!todo.length) return toast('Every round already has its questions.');
  if (todo.some((r) => !r.title && !r.brief)) return toast('Give every round a title or a prompt first.', true);
  LQ.genPlan(S.quiz.settings, 'Write all rounds', todo);
  for (const r of todo) { await generateForRound(r); }
  toast('All rounds written. Read them through before you host.');
  S.planner = false; renderQList(); renderQForm();
}
/** Generates a round's missing questions, one type at a time in the quantities its mix asks for, following its title and prompt. */
async function generateForRound(r) {
  const plan = roundShortfall(r);
  const total = plan.reduce((a, x) => a + x.need, 0);
  if (!total) return;
  const m = modal(`<h3>✨ Writing Round ${roundIndex(r.id) + 1}${r.title ? ': ' + esc(r.title) : ''}</h3><div class="gen-progress"><span class="spinner"></span><span id="ga_step">Starting…</span></div><p class="muted small mt">${plan.map((x) => `${x.need} × ${esc(TYPES[x.type].label)}`).join(' · ')}</p>`);
  $('#ga_step', m).textContent = 'Checking what has been asked before…';
  const avoid = await avoidList(); let written = 0;
  if (!S.quiz.id) await save();
  try {
    for (const { type, need } of plan) {
      const BATCH = ['potato', 'koth', 'blockbusters', 'chase'].includes(type) ? 1 : ['race', 'wipeout', 'pin', 'match'].includes(type) ? 2 : ['choice', 'tf', 'text', 'order', 'sort'].includes(type) ? 6 : 4; // heavy ones fetch pictures; plain ones are quick on Sonnet
      let got = 0;
      while (got < need) {
        $('#ga_step', m).textContent = `${TYPES[type].label}: writing ${got + 1}–${Math.min(need, got + BATCH)} of ${need} (${written} of ${total} done)…`;
        const usedPictures = S.quiz.questions.flatMap((q) => [q.media?.source, q.media?.url]).filter((s) => typeof s === 'string' && /^https?:/.test(s));
        const res = await api('generate', { topic: (r.brief ? `${r.title}. ${r.brief}` : r.title).slice(0, 200), title: r.title, brief: r.brief, usedPictures, count: Math.min(BATCH, need - got), difficulty: 'mixed', types: [type], pictures: true, web: true, avoid, premium: !!S.quiz.settings.aiPremium, quizId: S.quiz.id }, { timeout: 170000 });
        LQ.addUsage(S.quiz.settings, res.usage); LQ.genLog(S.quiz.settings, 'Write round', res, { round: r.title });
        if (!res.questions.length) break;
        if (res.fromBank) $('#ga_step', m).textContent = `${TYPES[type].label}: ${res.fromBank} from the bank`;
        if (!res.questions.some((q) => (q.kind || q.type) === type)) { toast(`The server wrote ${TYPES[res.questions[0].type]?.label || 'other'} questions instead of ${TYPES[type].label}: the quiz-api function is out of date and needs redeploying. They were not added.`, true); break; }
        for (const q of res.questions) { q.round = r.id; q.time = timeFor(q.kind || q.type, S.quiz.settings); if (q.collage && !q.media?.url) { try { await buildCollageFor(q); } catch {} } S.quiz.questions.push(q); avoid.push(q.text); got++; written++; }
        touch(); renderQList(); save();
      }
    }
    m.remove();
  } catch (e) { m.remove(); toast(`Round ${roundIndex(r.id) + 1}: ${e.message}`, true); throw e; }
}

// ------------------------------------------------------------------ rounds
function roundModal(id) {
  if (id) { S.planner = true; renderPlanner(id); return; }
  const r = id ? S.quiz.rounds.find((x) => x.id === id) : { id: null, title: `Round ${S.quiz.rounds.length + 1}`, intro: '', brief: '', mix: { choice: 5, text: 3 }, count: 8, types: ['choice', 'text'] };
  const n = id ? S.quiz.questions.filter((q) => q.round === id).length : 0;
  const m = modal(`<h3>${id ? 'Round' : 'Add a round'}</h3>
    <div class="field"><label>Round name <span class="muted">— shown on the screen before it starts</span></label><input type="text" id="r_title" value="${esc(r.title)}" placeholder="e.g. Sports, Picture round, Music"></div>
    <div class="field"><label>Brief for the AI <span class="muted">— optional</span></label><textarea id="r_brief" placeholder="What this round should be about, as you'd tell a quizmaster. e.g. A sports round where every question is about Harry Kane: his clubs, records, goals and England career.">${esc(r.brief)}</textarea>
      <div class="help">Used whenever you write questions for this round with AI. Questions added by hand ignore it.</div></div>
    ${id && n ? `<p class="muted small">${n} question${n === 1 ? '' : 's'} in this round.</p>` : ''}
    <div class="row mt" style="justify-content:space-between">
      <div>${id && S.quiz.rounds.length > 1 ? `<button class="btn btn-ghost btn-sm" data-del style="color:var(--bad)">Delete round</button>` : ''}</div>
      <div class="row"><button class="btn btn-ghost" data-x>Cancel</button>${id ? '' : '<button class="btn" data-ok-ai>Add and write with AI</button>'}<button class="btn btn-primary" data-ok>${id ? 'Done' : 'Add round'}</button></div></div>`);
  const read = () => { r.title = $('#r_title', m).value.trim() || r.title; r.brief = $('#r_brief', m).value.trim(); };
  const commit = () => { read(); if (!id) { r.id = uid('r'); S.quiz.rounds.push(r); } touch(); m.remove(); renderQList(); renderQForm(); };
  $('[data-x]', m).onclick = () => m.remove();
  $('[data-ok]', m).onclick = commit;
  if ($('[data-ok-ai]', m)) $('[data-ok-ai]', m).onclick = () => { commit(); aiModal(false, r.id); };
  if ($('[data-del]', m)) $('[data-del]', m).onclick = async () => {
    m.remove();
    if (n && !(await confirmBox('Delete this round?', `Its ${n} question${n === 1 ? '' : 's'} will be deleted too.`))) return;
    S.quiz.questions = S.quiz.questions.filter((q) => q.round !== id);
    S.quiz.rounds = S.quiz.rounds.filter((x) => x.id !== id);
    S.sel = Math.max(0, Math.min(S.sel, S.quiz.questions.length - 1)); touch(); renderQList(); renderQForm();
  };
  setTimeout(() => $('#r_title', m).select(), 50);
}

// ------------------------------------------------------------------ question form
function renderQForm() {
  const q = cur(); const box = $('#qform');
  if (!q || S.planner) { renderPlanner(); return; }
  if (q.type === 'slide') return renderSlideForm(q);
  const n = S.sel + 1, ck = checkState(q);
  box.innerHTML = `
    <div class="row" style="justify-content:space-between;margin-bottom:10px"><h3 style="margin:0">Question ${n} <span class="muted">· ${TYPES[q.kind || q.type].icon} ${esc(TYPES[q.kind || q.type].label)}</span></h3>
      <div class="row"><button class="btn btn-ghost btn-sm" id="rejQ" title="Swap it for a different question, or reject it as a bad one">👎 Not this one</button><button class="btn btn-ghost btn-sm" id="dupQ">Duplicate</button><button class="btn btn-ghost btn-sm" id="delQ" style="color:var(--bad)">Delete</button></div></div>
    ${ck ? `<div class="checknote ${ck}"><b>${{ ok: '✓ Checked: looks right.', doubt: '? Worth a look.', wrong: '✗ Looks wrong.', stale: '~ Changed since it was checked.' }[ck]}</b> ${esc(q.check.note || '')}${q.check.fix && ck !== 'ok' ? `<div class="mt" style="margin-top:6px"><b>Suggested answer:</b> ${esc(q.check.fix)}</div>` : ''}<div class="row" style="margin-top:8px;gap:6px"><button class="btn btn-ghost btn-sm" id="recheck">Check again</button><button class="btn btn-ghost btn-sm" id="clearCheck">Dismiss</button></div></div>` : ''}
    ${q.type === 'wheel' ? '' : `<div class="field"><label>${q.type === 'smash' ? 'The clue' : q.type === 'highlow' ? 'The highbrow clue' : q.type === 'rhyme' ? 'The first clue' : q.type === 'dingbat' ? 'Instruction on the screen (optional)' : q.type === 'tune' ? 'Wording on the screen (optional — the ask below sets a default)' : 'Question'}</label><textarea id="f_text" placeholder="${esc(placeholderFor(q.type))}">${esc(q.text)}</textarea></div>`}
    <div id="typeBox"></div>
    ${q.type === 'wheel' || q.type === 'tune' ? '' : `<div class="field"><label>${q.type === 'pin' ? 'Picture to drop the pin on' : q.type === 'smash' ? 'The picture' : 'On the screen'}</label><div id="mediaBox"></div></div>`}
    <div class="row" style="align-items:flex-end">
      <div class="field" style="max-width:180px${q.type === 'potato' ? ';display:none' : ''}"><label>${q.type === 'wipeout' ? 'Seconds per turn' : q.type === 'race' ? 'Race time limit (seconds)' : q.type === 'koth' ? 'Seconds to answer or buzz' : q.type === 'blockbusters' || q.type === 'chase' ? 'Seconds per question' : 'Time limit (seconds)'}</label><input type="number" id="f_time" min="${q.type === 'wipeout' ? 3 : 5}" max="${q.type === 'race' ? 600 : 180}" value="${q.time}"></div>
      ${q.type === 'wipeout' ? `<div class="field" style="max-width:160px"><label>Points per right pick</label><input type="number" id="f_pick" min="0" max="5000" value="${q.pickPoints ?? 200}"></div><div class="field" style="max-width:160px"><label>Wipeout penalty</label><input type="number" id="f_penalty" min="0" max="5000" value="${q.penalty ?? 500}"></div><div class="field" style="max-width:190px"><label>Look at the board first (seconds)</label><input type="number" id="f_study" min="0" max="60" value="${q.study ?? 20}"></div>` : ''}
      ${S.quiz.rounds.length > 1 ? `<div class="field" style="max-width:240px"><label>Round</label><select id="f_round">${S.quiz.rounds.map((r, i) => `<option value="${r.id}" ${r.id === q.round ? 'selected' : ''}>${i + 1}. ${esc(r.title || 'Untitled round')}</option>`).join('')}</select></div>` : ''}
      ${q.type === 'order' || q.type === 'match' || q.type === 'sort' ? `<label class="check" style="margin-bottom:14px"><input type="checkbox" id="f_partial" ${q.partial ? 'checked' : ''}> Partial credit for partly right</label>` : ''}
      ${q.type === 'text' || q.type === 'highlow' || q.type === 'rhyme' || q.type === 'club' || q.type === 'dingbat' || q.type === 'tune' ? `<label class="check" style="margin-bottom:14px"><input type="checkbox" id="f_ai" ${q.ai !== false ? 'checked' : ''}> Let AI judge spelling and wording</label>` : ''}
      ${S.quiz.rounds.find((r) => r.id === q.round)?.practice ? '<span class="muted small" style="margin-bottom:14px">🧪 Practice: the whole round scores nothing</span>' : `<label class="check" style="margin-bottom:14px" title="Played in full, but the points don&#39;t count: good for showing people how a game works"><input type="checkbox" id="f_practice" ${q.practice ? 'checked' : ''}> 🧪 Practice: no points</label>`}
    </div>
    <div id="problems"></div>`;
  if ($('#f_text')) $('#f_text').oninput = (e) => { q.text = e.target.value; touch(); refreshTile(); };
  $('#f_time').onchange = (e) => { q.time = LQ.clamp(+e.target.value || 30, q.type === 'wipeout' ? 3 : 5, q.type === 'race' ? 600 : 180); e.target.value = q.time; touch(); renderQList(); };
  if ($('#f_pick')) $('#f_pick').onchange = (e) => { q.pickPoints = LQ.clamp(+e.target.value || 0, 0, 5000); touch(); };
  if ($('#f_penalty')) $('#f_penalty').onchange = (e) => { q.penalty = LQ.clamp(+e.target.value || 0, 0, 5000); touch(); };
  if ($('#f_study')) $('#f_study').onchange = (e) => { q.study = LQ.clamp(+e.target.value || 0, 0, 60); touch(); };
  if ($('#f_round')) $('#f_round').onchange = (e) => { q.round = e.target.value; touch(); S.sel = S.quiz.questions.findIndex((x) => x.id === q.id); renderQList(); renderQForm(); };
  if ($('#f_partial')) $('#f_partial').onchange = (e) => { q.partial = e.target.checked; touch(); };
  if ($('#f_ai')) $('#f_ai').onchange = (e) => { q.ai = e.target.checked; touch(); };
  if ($('#f_practice')) $('#f_practice').onchange = (e) => { q.practice = e.target.checked; if (!q.practice) delete q.practice; touch(); renderQList(); };
  if ($('#recheck')) $('#recheck').onclick = () => checkQuestions([q]);
  if ($('#clearCheck')) $('#clearCheck').onclick = () => { delete q.check; touch(); renderQList(); renderQForm(); };
  $('#dupQ').onclick = () => { const c = JSON.parse(JSON.stringify(q)); c.id = uid('q'); delete c.check; S.quiz.questions.splice(S.sel + 1, 0, c); touch(); S.sel = S.quiz.questions.findIndex((x) => x.id === c.id); renderQList(); renderQForm(); };
  $('#delQ').onclick = async () => { if (!(await confirmBox('Delete this question?', 'It will be removed from the quiz.'))) return; S.quiz.questions.splice(S.sel, 1); S.sel = Math.max(0, Math.min(S.sel, S.quiz.questions.length - 1)); touch(); renderQList(); renderQForm(); };
  $('#rejQ').onclick = () => rejectQuestion(q);
  renderTypeBox(); if ($('#mediaBox')) renderMediaBox(); showProblems();
}
/** A slide: a title, a few lines and an optional picture or video. Shown between questions, on the screen and the phones. */
function renderSlideForm(q) {
  const box = $('#qform');
  const T = LQ.typeInfo('slide', q);
  box.innerHTML = `
    <div class="row" style="justify-content:space-between;margin-bottom:10px"><h3 style="margin:0">${T.icon} ${T.label} <span class="muted small">· not a question, no points</span></h3>
      <div class="row"><button class="btn btn-ghost btn-sm" id="dupQ">Duplicate</button><button class="btn btn-ghost btn-sm" id="delQ" style="color:var(--bad)">Delete</button></div></div>
    <div class="field"><label>Title</label><input type="text" id="f_text" value="${esc(q.text)}" placeholder="e.g. Welcome to Quiz Night!  ·  How to play  ·  Half-time"></div>
    <div class="field"><label>Text <span class="muted">— start lines with "-" to make a list</span></label><textarea id="f_body" rows="7" placeholder="e.g.&#10;- Phones out, join with the code on the screen&#10;- The faster you answer, the more you score&#10;- No googling!">${esc(q.body || '')}</textarea></div>
    <div class="field"><label class="check"><input type="checkbox" id="f_break" ${q.break ? 'checked' : ''}> ☕ Break, with a big countdown clock on the screen and the phones</label></div>
    ${q.break ? '' : `<div class="field"><label>On the screen <span class="muted">— optional</span></label><div id="mediaBox"></div></div>`}
    <div class="row" style="align-items:flex-end">
      ${q.break ? `<div class="field" style="max-width:260px"><label>Break length (minutes) <span class="muted">— add or take off minutes on the screen while it runs</span></label><div class="row" style="gap:6px"><button class="btn btn-ghost btn-sm" data-bm="-5">−5</button><button class="btn btn-ghost btn-sm" data-bm="-1">−1</button><input type="number" id="f_mins" min="1" max="120" value="${LQ.breakMs(q) / 60000}" style="max-width:80px;text-align:center"><button class="btn btn-ghost btn-sm" data-bm="1">+1</button><button class="btn btn-ghost btn-sm" data-bm="5">+5</button></div></div>`
      : `<div class="field" style="max-width:260px"><label>Moves on by itself after (seconds) <span class="muted">— when the game runs itself</span></label><input type="number" id="f_time" min="5" max="120" value="${q.time || 20}"></div>`}
      ${S.quiz.rounds.length > 1 ? `<div class="field" style="max-width:240px"><label>Round</label><select id="f_round">${S.quiz.rounds.map((r, i) => `<option value="${r.id}" ${r.id === q.round ? 'selected' : ''}>${i + 1}. ${esc(r.title || 'Untitled round')}</option>`).join('')}</select></div>` : ''}
    </div>
    <p class="muted small">${q.break ? 'The clock starts as the slide comes up. On the screen: −1 min, +1 min, +5 min (or the − and + keys), and End break to move on early. When the game runs itself it moves on a few seconds after the clock hits zero.' : "It stays up until you press Next. Put it first in a round and it comes after the round's title card."}</p>
    <div id="problems"></div>`;
  $('#f_text').oninput = (e) => { q.text = e.target.value; touch(); refreshTile(); showProblems(); };
  $('#f_body').oninput = (e) => { q.body = e.target.value; touch(); showProblems(); };
  $('#f_break').onchange = (e) => { q.break = e.target.checked; if (q.break) { q.breakMins = q.breakMins || 10; q.media = { kind: 'none' }; } touch(); renderQList(); renderSlideForm(q); };
  const setMins = (n) => { q.breakMins = LQ.clamp(Math.round(+n) || 10, 1, 120); const i = $('#f_mins'); if (i) i.value = q.breakMins; touch(); renderQList(); showProblems(); };
  if ($('#f_mins')) $('#f_mins').onchange = (e) => setMins(e.target.value);
  $$('[data-bm]', box).forEach((b) => b.onclick = () => setMins((+q.breakMins || 10) + +b.dataset.bm));

    $$('[data-dt]').forEach((inp) => inp.oninput = () => { q.elements[+inp.dataset.dt].t = inp.value; prev(); });
    num('data-dx', 'x', 0, 100); num('data-dy', 'y', 0, 100); num('data-ds', 's', 1, 6); num('data-dr', 'rot', -180, 180);
    $$('[data-df]').forEach((sel) => sel.onchange = () => { q.elements[+sel.dataset.df].flip = sel.value; prev(); });
    $$('[data-dst]').forEach((sel) => sel.onchange = () => { q.elements[+sel.dataset.dst].style = sel.value; prev(); });

    $('#db_add').onclick = () => { q.elements.push({ t: '', x: 50, y: q.elements.length ? 70 : 50, s: 4 }); touch(); renderTypeBox(); $$('[data-dt]').pop().focus(); };

  }
  if (q.type === 'rhyme') {
    box.innerHTML = `<div class="notice" style="margin-bottom:12px">Rhyme Time: two clues on the screen whose answers rhyme. Players type both answers in one box, first then second. <i>Sherlock's sidekick</i> + <i>Famous Bermondsey bottle</i>… the answers just need to rhyme.</div>
      <div class="row"><div class="field grow"><label>Answer to the first clue</label><input type="text" id="rh_a1" value="${esc(q.answer1 || '')}" placeholder="e.g. Watson"></div></div>
      <div class="field"><label>The second clue</label><textarea id="rh_t2" placeholder="e.g. A large, loud gathering after dark">${esc(q.text2 || '')}</textarea></div>
      <div class="row"><div class="field grow"><label>Answer to the second clue <span class="muted">— rhymes with the first</span></label><input type="text" id="rh_a2" value="${esc(q.answer2 || '')}" placeholder="e.g. Party"></div></div>
      <div id="rh_check" class="help"></div>`;
    const check = () => { const a = (q.answer1 || '').trim(), b = (q.answer2 || '').trim(); const end = (s) => LQ.normText(s).replace(/\s/g, '').slice(-2); $('#rh_check').textContent = a && b ? (end(a) === end(b) ? `Players type: "${a} ${b}"` : `Do "${a}" and "${b}" rhyme? They don't share an ending, but you know best.`) : ''; };
    $('#rh_a1').oninput = (e) => { q.answer1 = e.target.value; touch(); check(); showProblems(); };
    $('#rh_a2').oninput = (e) => { q.answer2 = e.target.value; touch(); check(); showProblems(); };
    $('#rh_t2').oninput = (e) => { q.text2 = e.target.value; touch(); showProblems(); };
    check();
  }
  if (q.type === 'wheel') {
    box.innerHTML = `<div class="notice" style="margin-bottom:12px">The phrase goes up on the board hidden. Every few seconds another letter turns over, everywhere it appears. Players type the whole phrase on their phones whenever they think they know it, and the sooner the better: points fall with the clock.</div>
      <div class="row"><div class="field grow"><label>The phrase</label><input type="text" id="w_phrase" value="${esc(q.phrase || '')}" placeholder="e.g. A PIECE OF CAKE" style="text-transform:uppercase"></div><div class="field" style="max-width:220px"><label>Category <span class="muted">— shown under the board</span></label><input type="text" id="w_cat" value="${esc(q.category || '')}" placeholder="Phrase, Person, Place, Thing…" list="w_cats"><datalist id="w_cats">${['Phrase', 'Person', 'Place', 'Thing', 'Event', 'Food & Drink', 'Song Title', 'Movie Title', 'TV Show', 'Before & After', 'Same Name', 'Living Thing', 'Proper Name', 'What Are You Doing?', 'On the Map', 'Fictional Character', 'Around the House', 'Landmark', 'Occupation'].map((c) => `<option value="${c}">`).join('')}</datalist></div></div>
      <div id="w_board" class="center" style="margin:6px 0 14px"></div>
      <div class="row"><div class="field" style="max-width:200px"><label>Turn a letter every (seconds)</label><input type="number" id="w_every" min="1" max="30" value="${q.revealEvery || 4}"></div><div class="field grow"><label>Letters shown from the start <span class="muted">— optional, e.g. RSTLNE</span></label><input type="text" id="w_start" value="${esc(q.startLetters || '')}" placeholder="none" style="text-transform:uppercase"></div></div>`;
    const draw = () => { const L = LQ.wheelLayout(q.phrase); $('#w_board').innerHTML = L ? LQ.wheelBoardHtml(L, q.startLetters || '', false) + `<div><span class="wof-cat">${esc(q.category || 'Phrase')}</span></div>` : `<div class="error">${q.phrase ? 'That does not fit the board: four rows of 12, 14, 14 and 12 letters, and a word cannot be split across rows.' : 'Type the phrase to see it on the board.'}</div>`; };
    $('#w_phrase').oninput = (e) => { q.phrase = e.target.value.toUpperCase(); q.text = q.phrase; touch(); draw(); showProblems(); refreshTile(); };
    $('#w_cat').oninput = (e) => { q.category = e.target.value; touch(); draw(); showProblems(); };
    $('#w_every').onchange = (e) => { q.revealEvery = LQ.clamp(+e.target.value || 4, 1, 30); touch(); };
    $('#w_start').oninput = (e) => { q.startLetters = e.target.value.toUpperCase().replace(/[^A-Z]/g, ''); touch(); draw(); };
    draw();
  }
  if (q.type === 'smash') {
    box.innerHTML = `<div class="notice" style="margin-bottom:12px">Answer Smash: the picture's answer and the clue's answer overlap, and players type the two smashed into one. <i>Emma Watson</i> + <i>Sonic the Hedgehog</i> = <b>Emma Watsonic the Hedgehog</b>. Write the clue in the question box above.</div>
      <div class="row"><div class="field grow"><label>The picture is of</label><input type="text" id="s_pic" value="${esc(q.pictureAnswer || '')}" placeholder="e.g. Emma Watson"></div><div class="field grow"><label>The clue's answer</label><input type="text" id="s_ans" value="${esc(q.clueAnswer || '')}" placeholder="e.g. Sonic the Hedgehog"></div></div>
      <div class="field"><label>The smash <span class="muted">— what players have to type</span></label><div id="smashOut"></div></div>`;
    const draw = () => {
      const auto = LQ.smashOf(q.pictureAnswer, q.clueAnswer);

      else if (auto.overlap) { const a = q.pictureAnswer.trimEnd(), ov = a.slice(a.length - auto.overlap); out.innerHTML = `<div class="smashline">${esc(a.slice(0, a.length - auto.overlap))}<mark>${esc(ov)}</mark>${esc(auto.smash.slice(a.length))}</div><div class="help">The highlighted letters are shared by both answers. <a href="#" id="s_edit">Type the smash yourself instead</a>.</div>`; }
      else out.innerHTML = `<div class="error">These two don't overlap: the end of the first has to be the start of the second. Change one of them, or <a href="#" id="s_edit">type the smash yourself</a>.</div>`;
      if ($('#s_edit')) $('#s_edit').onclick = (e) => { e.preventDefault(); q.smashCustom = true; touch(); draw(); $('#s_smash')?.focus(); };
      if ($('#s_auto')) $('#s_auto').onclick = () => { q.smashCustom = false; touch(); draw(); showProblems(); };
      if ($('#s_smash')) $('#s_smash').oninput = (e) => { q.smash = e.target.value; touch(); showProblems(); };
      showProblems();
    };
    $('#s_pic').oninput = (e) => { q.pictureAnswer = e.target.value; touch(); draw(); };
    $('#s_ans').oninput = (e) => { q.clueAnswer = e.target.value; touch(); draw(); };
    draw();
  }
}
function renderPinPick() {
  const q = cur(); const box = $('#pinpick'); if (!box) return;
  if (!q.media?.url) { box.innerHTML = '<div class="notice">Add a picture below first — a map, a photo, a collage, anything.</div>'; return; }
  const area = q.mode === 'area';
  box.innerHTML = `<div class="pinpick ${area ? 'area' : ''}"><img src="${esc(q.media.url)}" draggable="false">${area ? '<div class="rect"></div>' : '<div class="ring zero"></div><div class="ring full"></div><svg class="pin" viewBox="0 0 24 24"><path fill="#e21b3c" stroke="#fff" stroke-width="1.5" d="M12 1.5a7.5 7.5 0 0 0-7.5 7.5c0 5.6 7.5 13.5 7.5 13.5S19.5 14.6 19.5 9A7.5 7.5 0 0 0 12 1.5z"/><circle cx="12" cy="9" r="3" fill="#fff"/></svg>'}</div>`;
  const wrap = $('.pinpick', box), img = $('img', wrap);
  const frac = (e) => { const r = img.getBoundingClientRect(); return { x: LQ.clamp((e.clientX - r.left) / r.width, 0, 1), y: LQ.clamp((e.clientY - r.top) / r.height, 0, 1) }; };
  if (area) {
    const place = () => {
      const w = img.clientWidth, h = img.clientHeight; if (!w) return;
      $$('.tile', wrap).forEach((t) => t.remove());
      for (const [i, t] of (q.collage || []).entries()) { const d = document.createElement('div'); d.className = 'tile'; d.style.left = t.rect.x * w + 'px'; d.style.top = t.rect.y * h + 'px'; d.style.width = t.rect.w * w + 'px'; d.style.height = t.rect.h * h + 'px'; d.title = t.title || ''; d.onclick = (e) => { e.stopPropagation(); q.target = { ...t.rect }; q.answerIndex = i; touch(); place(); showProblems(); }; wrap.appendChild(d); }
      const r = $('.rect', wrap); if (q.target && q.target.w > 0) { r.style.display = 'block'; r.style.left = q.target.x * w + 'px'; r.style.top = q.target.y * h + 'px'; r.style.width = q.target.w * w + 'px'; r.style.height = q.target.h * h + 'px'; } else r.style.display = 'none';
    };
    img.onload = place; if (img.complete) place();
    let start = null;
    wrap.onpointerdown = (e) => { if (e.target.classList.contains('tile')) return; start = frac(e); wrap.setPointerCapture(e.pointerId); };
    wrap.onpointermove = (e) => { if (!start) return; const p = frac(e); q.target = { x: Math.min(start.x, p.x), y: Math.min(start.y, p.y), w: Math.abs(p.x - start.x), h: Math.abs(p.y - start.y) }; place(); };
    wrap.onpointerup = (e) => { if (!start) return; const p = frac(e); const t = { x: Math.min(start.x, p.x), y: Math.min(start.y, p.y), w: Math.abs(p.x - start.x), h: Math.abs(p.y - start.y) }; start = null; if (t.w > 0.01 && t.h > 0.01) { q.target = t; delete q.answerIndex; } touch(); place(); showProblems(); };
    return;
  }
  const place = () => {
    const w = img.clientWidth, h = img.clientHeight; if (!w) return;
    $('.pin', wrap).style.left = (q.pin.x * w) + 'px'; $('.pin', wrap).style.top = (q.pin.y * h) + 'px';
    for (const [cls, r] of [['full', q.radiusFull], ['zero', q.radiusZero]]) { const el = $('.ring.' + cls, wrap); el.style.left = (q.pin.x * w) + 'px'; el.style.top = (q.pin.y * h) + 'px'; el.style.width = el.style.height = (r * 2 * w) + 'px'; }
  };
  img.onload = place; if (img.complete) place();
  wrap.onclick = (e) => { q.pin = frac(e); touch(); place(); showProblems(); };
}

// ------------------------------------------------------------------ collages
function collageModal(q) {
  const tiles = (q.collage || []).map((t) => ({ title: t.title || '', url: t.url, credit: t.credit }));
  let answer = Number.isInteger(q.answerIndex) ? q.answerIndex : 0;
  const m = modal(`<h3>🖼 Make a collage</h3><p class="muted small">Two to nine pictures, tiled into one. Tick the one that is the answer.</p><div id="c_list"></div>
    <div class="row mt"><input type="text" id="c_title" class="grow" placeholder="Find a picture of… e.g. Amalgam carrier"><button class="btn btn-sm" id="c_find">Find on Wikipedia</button><button class="btn btn-ghost btn-sm" id="c_up">Upload</button></div>
    <div id="c_err" class="mt"></div>
    <div class="row mt" style="justify-content:flex-end"><button class="btn btn-ghost" data-x>Cancel</button><button class="btn btn-primary" data-ok>Build the collage</button></div>`);
  const draw = () => {
    $('#c_list', m).innerHTML = tiles.length ? tiles.map((t, i) => `<div class="list-item" style="grid-template-columns:44px 1fr auto auto"><img class="thumb" src="${esc(t.url)}"><input type="text" data-ct="${i}" value="${esc(t.title)}" placeholder="What it is (for your notes)"><label class="check" title="This is the answer"><input type="radio" name="c_ans" ${i === answer ? 'checked' : ''} data-ca="${i}"> answer</label><button class="btn btn-ghost btn-sm" data-cr="${i}">✕</button></div>`).join('') : '<p class="muted">No pictures yet.</p>';
    $$('[data-ct]', m).forEach((inp) => inp.oninput = () => { tiles[+inp.dataset.ct].title = inp.value; });
    $$('[data-ca]', m).forEach((r) => r.onchange = () => { answer = +r.dataset.ca; });
    $$('[data-cr]', m).forEach((b) => b.onclick = () => { tiles.splice(+b.dataset.cr, 1); if (answer >= tiles.length) answer = 0; draw(); });
    $('[data-ok]', m).disabled = tiles.length < 2;
  };
  const err = (msg) => { $('#c_err', m).innerHTML = msg ? `<div class="error">${esc(msg)}</div>` : ''; };
  $('#c_find', m).onclick = async () => {
    const title = $('#c_title', m).value.trim(); if (!title) return; if (tiles.length >= 9) return err('Nine pictures at most.');
    err(''); $('#c_find', m).disabled = true;
    try { const r = await api('picture', { title }, { timeout: 60000 }); tiles.push({ title, url: r.url, credit: `Wikipedia / Wikimedia Commons: ${title}` }); $('#c_title', m).value = ''; draw(); }
    catch (e) { err(e.message); }
    $('#c_find', m).disabled = false;
  };
  $('#c_title', m).onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); $('#c_find', m).click(); } };
  $('#c_up', m).onclick = () => { if (tiles.length >= 9) return err('Nine pictures at most.'); pickImage((url) => { tiles.push({ title: '', url }); draw(); }); };
  $('[data-x]', m).onclick = () => m.remove();
  $('[data-ok]', m).onclick = async () => {
    $('[data-ok]', m).disabled = true; err('');
    try { q.collage = tiles; q.answerIndex = answer; await buildCollageFor(q); touch(); m.remove(); renderTypeBox(); renderMediaBox(); showProblems(); toast('Collage built'); }
    catch (e) { err(e.message); $('[data-ok]', m).disabled = false; }
  };
  draw();
}

function renderMediaBox() {

  $$('[data-mk]').forEach((b) => b.onclick = () => { const k = b.dataset.mk; if (k === m.kind) return; q.media = k === 'none' ? { kind: 'none' } : k === 'image' ? { kind: 'image', url: '' } : { kind: 'youtube', url: '', videoId: '', start: 0 }; touch(); renderMediaBox(); showProblems(); });

      <div class="row mt"><button class="btn btn-sm" id="upPic">${q.media.url ? 'Change picture' : 'Upload a picture'}</button><span class="muted small">or paste a link:</span><input type="url" id="picUrl" class="grow" placeholder="https://…jpg" value="${q.media.url && !q.media.url.includes('/quiz-media/') ? esc(q.media.url) : ''}" style="max-width:380px"></div>
      ${q.media.credit ? `<div class="help">${esc(q.media.credit)}</div>` : ''}
      ${q.type === 'pin' ? `<div class="row mt"><button class="btn btn-sm" id="blankMap">🗺 Blank map of a place…</button><span class="help">A label-free map of any country, region or continent, or “World”.${q.mapRegion ? ` Currently: ${esc(q.mapRegion)}.` : ''}</span></div><div class="help">For “where on the body / on the pitch / in the painting” upload any picture instead.</div>` : q.type === 'smash' ? `<div class="row mt"><button class="btn btn-sm" id="findPic">🔎 Find a picture of ${esc(q.pictureAnswer || '…')}</button><span class="help">From Wikipedia, or upload your own.</span></div>` : '<div class="help">Shown big on the screen while the question is live, and on players\' phones.</div>'}`;
    $('#upPic').onclick = () => pickImage((url) => { q.media = { kind: 'image', url }; delete q.mapRegion; delete q.mapBounds; delete q.collage; touch(); renderMediaBox(); if (pinOnly) renderPinPick(); showProblems(); });
    if ($('#findPic')) $('#findPic').onclick = async () => {
      const title = q.pictureAnswer?.trim(); if (!title) return toast('Fill in what the picture is of first.', true);

      catch (e) { toast(e.message, true); }

    if ($('#blankMap')) $('#blankMap').onclick = () => {

      $('[data-x]', m).onclick = () => m.remove();
      const go = async () => {
        const region = $('#mapRegion', m).value.trim(); if (!region) return;
        $('[data-ok]', m).disabled = true; $('#mapErr', m).innerHTML = '<span class="spinner"></span>';
        try { const r = await api('map', { region }, { timeout: 60000 }); q.media = { kind: 'image', url: r.url, credit: `Wikimedia Commons: ${r.region} location map` }; q.mapRegion = r.region; if (r.bounds) q.mapBounds = r.bounds; else delete q.mapBounds; touch(); m.remove(); renderMediaBox(); renderPinPick(); showProblems(); }
        catch (e) { $('#mapErr', m).innerHTML = `<div class="error" style="margin-bottom:10px">${esc(e.message)}</div>`; $('[data-ok]', m).disabled = false; }
      };
      $('[data-ok]', m).onclick = go; $('#mapRegion', m).onkeydown = (e) => { if (e.key === 'Enter') go(); };
    };

  } else if (m.kind === 'youtube') {
    p.innerHTML = `<div class="row"><input type="url" id="ytUrl" class="grow" placeholder="Paste a YouTube link" value="${esc(m.url || '')}"><div class="field" style="margin:0;max-width:170px"><input type="number" id="ytStart" min="0" placeholder="Start at (s)" value="${m.start || ''}"></div><div class="field" style="margin:0;max-width:150px"><input type="number" id="ytEnd" min="0" placeholder="Stop at (s)" value="${m.end || ''}"></div></div>
      ${m.videoId ? `<div class="preview mt"><iframe src="https://www.youtube-nocookie.com/embed/${esc(m.videoId)}?start=${+m.start || 0}${m.end ? '&end=' + (+m.end) : ''}" allow="autoplay; encrypted-media" allowfullscreen></iframe></div>` : ''}
      <div class="help">The video plays on the host screen with sound as soon as the question starts and stops at the stop time (blank plays on). For Catchphrase-style clips, start just before the scene and stop before the answer is said. Players answer on their phones while it plays. Share your screen with sound on the call.</div>`;
    $('#ytUrl').onchange = (e) => { m.url = e.target.value.trim(); m.videoId = youtubeId(m.url); touch(); renderMediaBox(); showProblems(); };
    $('#ytStart').onchange = (e) => { m.start = Math.max(0, +e.target.value || 0); touch(); renderMediaBox(); };
    $('#ytEnd').onchange = (e) => { m.end = Math.max(0, +e.target.value || 0) || undefined; touch(); renderMediaBox(); };
  } else {
    p.innerHTML = '<div class="help">Just the question text on the screen.</div>';
  }
}
function pickImage(cb) {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    toast('Uploading picture…');
    try { const r = await resizeImage(f); const u = await api('upload', { data: r.data, contentType: r.contentType }, { timeout: 90000 }); toast('Picture added'); cb(u.url); }
    catch (e) { toast(e.message, true); }
  };
  inp.click();
}
