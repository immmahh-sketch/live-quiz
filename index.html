<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Let's Quiz! — Builder</title>
<link rel="icon" type="image/png" sizes="64x64" href="assets/brand/icon-64.png">
<link rel="apple-touch-icon" href="assets/brand/icon-build-180.png">
<link rel="manifest" href="manifest-build.webmanifest">
<meta name="apple-mobile-web-app-title" content="Quiz Builder">
<meta name="theme-color" content="#5b3df5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body class="builder">
<div class="topbar">
  <div class="logo"><img src="assets/brand/mark.png" alt=""> Let's Quiz!</div>
  <div class="grow"></div>
  <div id="topRight"></div>
</div>
<div class="wrap" id="view"></div>
<div class="toast" id="toast"></div>

<script src="assets/common.js"></script>
<script>
const { $, $$, esc, uid, api, TYPES, COLORS, DEFAULT_SETTINGS, newQuestion, validate, youtubeId, resizeImage, normalizeQuiz, orderQuestions, quizForSave, timeFor, composeCollage, buildCollageFor } = LQ;
const view = $('#view');
const S = { quizzes: [], quiz: null, sel: 0, ai: false, saveTimer: null, saving: false, dirty: false, planner: false };

let toastT;
function toast(msg, bad) {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (bad ? ' bad' : '');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), bad ? 5000 : 2500);
}
function modal(html) {
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal">${html}</div>`;
  bg.addEventListener('click', (e) => { if (e.target === bg) bg.remove(); });
  document.body.appendChild(bg);
  return bg;
}
function confirmBox(title, body, okLabel = 'Delete') {
  return new Promise((res) => {
    const m = modal(`<h3>${esc(title)}</h3><p class="muted">${esc(body)}</p><div class="row" style="justify-content:flex-end"><button class="btn btn-ghost" data-x>Cancel</button><button class="btn btn-danger" data-ok>${esc(okLabel)}</button></div>`);
    $('[data-x]', m).onclick = () => { m.remove(); res(false); };
    $('[data-ok]', m).onclick = () => { m.remove(); res(true); };
  });
}
const fmtDate = (s) => new Date(s).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });

// ------------------------------------------------------------------ boot
(async function boot() {
  if (!LQ.hostPassword()) return viewLogin();
  try { const r = await api('login'); S.ai = !!r.ai; }
  catch (e) { if (e.status === 401) { LQ.setHostPassword(''); return viewLogin('Wrong password.'); } view.innerHTML = `<div class="error">${esc(e.message)}</div>`; return; }
  const params = new URLSearchParams(location.search);
  if (params.get('game')) return openReport(params.get('game'));
  const id = params.get('quiz');
  if (id) return openQuiz(id);
  loadList();
})();

// ------------------------------------------------------------------ reports
async function openReport(id) {
  history.replaceState(null, '', '?game=' + id);
  $('#topRight').innerHTML = '';
  view.innerHTML = '<p class="muted">Loading the report…</p>';
  let g;
  try { g = (await api('game', { id })).game; } catch (e) { view.innerHTML = `<div class="error">${esc(e.message)}</div><p class="mt"><a href="index.html">Back to quizzes</a></p>`; return; }
  const rep = g.report, when = new Date(g.ended_at).toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  if (!rep) { view.innerHTML = `<div class="row" style="margin-bottom:14px"><button class="btn btn-ghost btn-sm" id="back">← Quizzes</button><h1 style="margin:0">${esc(g.title || 'Quiz')}</h1></div><div class="card"><p>This game was played before reports were kept, so only the scoreboard is here.</p><ol>${(g.players || []).map((p) => `<li>${esc(p.name)} — ${p.score}</li>`).join('')}</ol></div>`; $('#back').onclick = () => loadList(); return; }
  const ps = rep.players, qs = rep.questions;
  const cell = (e, pid) => { const a = e.players[pid]; if (!a) return '<td class="muted">—</td>'; const cls = a.skipped ? 'r-skip' : a.correct ? 'r-ok' : a.partial > 0 ? 'r-part' : a.answered ? 'r-no' : 'r-none'; return `<td class="${cls}"><div class="ans-t">${esc(a.answer)}</div><div class="ans-p">${a.points > 0 ? '+' : ''}${a.points}</div></td>`; };
  view.innerHTML = `
    <div class="row" style="margin-bottom:14px"><button class="btn btn-ghost btn-sm" id="back">← Quizzes</button><h1 style="margin:0">📊 ${esc(g.title || 'Quiz')}</h1><span class="muted small">${when} · game ${esc(g.code)} · ${qs.length} questions · ${ps.length} players</span><div class="grow"></div><button class="btn btn-ghost btn-sm" id="csv">⬇ Download CSV</button><button class="btn btn-ghost btn-sm" onclick="window.print()">🖨 Print</button></div>
    <div class="card" style="margin-bottom:16px"><h2 style="font-size:1.15rem">Final scores</h2><table class="rtable"><thead><tr><th>#</th><th>Player</th><th>Score</th><th>Right</th><th>Answered</th></tr></thead><tbody>${ps.map((p) => `<tr><td>${p.rank}</td><td>${p.emoji ? p.emoji + ' ' : ''}${esc(p.name)}${(rep.bots || []).includes(p.pid) ? ' <span class="tag">bot</span>' : ''}</td><td><b>${p.score}</b></td><td>${p.correct} of ${qs.length}</td><td>${p.answered} of ${qs.length}</td></tr>`).join('')}</tbody></table></div>
    <div class="card" style="overflow:auto"><h2 style="font-size:1.15rem">Every answer</h2><p class="muted small">Green is right, amber partly right, red wrong, grey skipped or not answered. The figure under each answer is the points it scored.</p>
      <table class="rtable answers-t"><thead><tr><th>#</th><th>Question</th><th>Answer</th>${ps.map((p) => `<th>${p.emoji ? p.emoji + ' ' : ''}${esc(p.name)}</th>`).join('')}</tr></thead>
      <tbody>${qs.map((e) => `<tr><td>${e.n}</td><td><div class="small muted">${esc(TYPES[e.type]?.label || e.type)}${e.round ? ' · ' + esc(e.round) : ''}</div>${esc(e.text)}</td><td class="small"><b>${esc(e.answer)}</b></td>${ps.map((p) => cell(e, p.pid)).join('')}</tr>`).join('')}</tbody></table></div>`;
  $('#back').onclick = () => loadList();
  $('#csv').onclick = () => {
    const esc2 = (s) => `"${String(s ?? '').replace(/"/g, '""')}"`;
    const rows = [['Question #', 'Round', 'Type', 'Question', 'Correct answer', 'Player', 'Answer', 'Result', 'Points']];
    for (const e of qs) for (const p of ps) { const a = e.players[p.pid]; if (!a) continue; rows.push([e.n, e.round, TYPES[e.type]?.label || e.type, e.text, e.answer, p.name, a.answer, a.skipped ? 'skipped' : a.correct ? 'right' : a.partial > 0 ? 'partly right' : a.answered ? 'wrong' : 'no answer', a.points]); }
    rows.push([]); rows.push(['Final scores']); rows.push(['Rank', 'Player', 'Score', 'Right', 'Answered']);
    for (const p of ps) rows.push([p.rank, p.name, p.score, p.correct, p.answered]);
    const blob = new Blob(['﻿' + rows.map((r) => r.map(esc2).join(',')).join('\r\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `${(g.title || 'quiz').replace(/[^\w\- ]+/g, '')} ${new Date(g.ended_at).toISOString().slice(0, 10)}.csv`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
}

// ------------------------------------------------------------------ login
function viewLogin(msg) {
  $('#topRight').innerHTML = '';
  view.innerHTML = `<div class="hero"><img src="assets/brand/logo.png" alt="Let's Quiz!"><h1>Let's Quiz!</h1><p>Build the quiz here. Share your screen on the call. Everyone plays on their phone.</p></div>
    <div class="card login"><h2>Host sign-in</h2><p class="muted">This is the host's portal. Players don't sign in — they scan the code on the screen.</p>
    ${msg ? `<div class="error" style="margin-bottom:12px">${esc(msg)}</div>` : ''}
    <form id="loginForm"><div class="field"><label>Password</label><input type="password" id="pw" autocomplete="current-password" autofocus></div>
    <button class="btn btn-primary btn-block">Sign in</button></form>
    <p class="center small mt" style="margin-bottom:0"><a href="host.html?quiz=demo" target="_blank">Try the demo quiz without signing in</a></p></div>`;
  $('#loginForm').onsubmit = async (e) => {
    e.preventDefault();
    const pw = $('#pw').value;
    try { const r = await api('login', {}, { password: pw }); LQ.setHostPassword(pw); S.ai = !!r.ai; loadList(); }
    catch (err) { viewLogin(err.status === 401 ? 'Wrong password.' : err.message); }
  };
}

// ------------------------------------------------------------------ quiz list
async function loadList() {
  view.innerHTML = '<p class="muted">Loading…</p>';
  try { const r = await api('list'); S.quizzes = r.quizzes; } catch (e) { view.innerHTML = `<div class="error">${esc(e.message)}</div>`; return; }
  renderList();
  api('games').then((r) => renderGames(r.games)).catch(() => {});
}
function renderList() {
  history.replaceState(null, '', location.pathname);
  S.quiz = null;
  const tpls = S.quizzes.filter((q) => q.template), quizzes = S.quizzes.filter((q) => !q.template);
  $('#topRight').innerHTML = `<button class="btn btn-ghost btn-sm" id="logout">Sign out</button>`;
  $('#logout').onclick = () => { LQ.setHostPassword(''); viewLogin(); };
  view.innerHTML = `
    <div class="row" style="margin-bottom:18px"><h1 style="margin:0">Your quizzes</h1><div class="grow"></div>
      <a class="btn btn-ghost" href="tv.html?m=1" title="A big-button wizard that builds a whole quiz in a few taps">📱 Quick build</a>
      <button class="btn btn-ghost" id="aiNew">✨ Write one with AI</button>
      <button class="btn btn-primary" id="newQuiz">+ New quiz</button></div>
    ${tpls.length ? `<div class="tplsec"><div class="row" style="margin-bottom:8px"><h2 style="margin:0">📋 Weekly formats</h2><span class="muted small">Saved set-ups: rounds, types and prompts. One click writes a fresh quiz in that format.</span></div>
      <div class="quizgrid">${tpls.map(tplCard).join('')}</div></div>` : ''}
    <div class="row" style="margin:${tpls.length ? '22px' : '0'} 0 8px"><h2 style="margin:0">Quizzes</h2></div>
    <div class="quizgrid">${quizzes.map(quizCard).join('')}
      ${quizzes.length ? '' : '<div class="card newcard" id="newQuiz2">Create your first quiz</div>'}</div>
    <div id="games" class="mt"></div>`;
  $('#newQuiz').onclick = newQuiz;
  if ($('#newQuiz2')) $('#newQuiz2').onclick = newQuiz;
  $('#aiNew').onclick = () => aiModal(true);
  $$('[data-open]').forEach((b) => b.onclick = () => openQuiz(b.dataset.open));
  $$('[data-tnew]').forEach((b) => b.onclick = () => newFromTemplate(b.dataset.tnew));
  $$('[data-host]').forEach((b) => b.onclick = () => window.open('host.html?quiz=' + b.dataset.host, '_blank'));
  $$('[data-dup]').forEach((b) => b.onclick = () => duplicateQuiz(b.dataset.dup));
  $$('[data-del]').forEach((b) => b.onclick = async () => {
    const q = S.quizzes.find((x) => x.id === b.dataset.del);
    if (!(await confirmBox('Delete this quiz?', `“${q.title}” and its ${q.count} questions will be gone for good.`))) return;
    try { await api('delete', { id: q.id }); toast('Deleted'); loadList(); } catch (e) { toast(e.message, true); }
  });
}
function tplCard(t) {
  const n = (t.rounds || []).reduce((a, r) => a + r.count, 0);
  const types = [...new Set((t.rounds || []).flatMap((r) => r.types))];
  return `<div class="card quizcard tpl"><h3>📋 ${esc(t.title)}</h3>
    <div class="muted small">${t.rounds?.length || 0} round${t.rounds?.length === 1 ? '' : 's'} · ${n} question${n === 1 ? '' : 's'}${t.rounds?.length ? ' · ' + t.rounds.map((r) => esc(r.title || 'untitled')).join(', ') : ''}</div>
    <div class="types">${types.slice(0, 5).map((x) => `<span class="tag">${esc(TYPES[x]?.label || x)}</span>`).join('')}${types.length > 5 ? `<span class="tag" style="background:var(--paper);color:var(--ink-3)">+${types.length - 5} more</span>` : ''}</div>
    <div class="actions"><button class="btn btn-primary btn-sm" data-tnew="${t.id}" ${S.ai ? '' : 'disabled'}>✨ New quiz from this</button>
      <button class="btn btn-sm" data-open="${t.id}">Edit format</button>
      <button class="btn btn-ghost btn-sm" data-del="${t.id}" style="color:var(--bad)">Delete</button></div></div>`;
}
/** One click: a fresh quiz with the template's rounds, then the AI writes every round. */
async function newFromTemplate(id) {
  let t;
  try { t = normalizeQuiz((await api('get', { id })).quiz); } catch (e) { return toast(e.message, true); }
  const when = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  const quiz = normalizeQuiz({ title: `${t.title.replace(/\s*\(format\)$/i, '')} · ${when}`, settings: { ...t.settings, template: false }, questions: [],
    rounds: t.rounds.map((r) => ({ id: uid('r'), title: r.title, intro: r.intro, brief: r.brief, mix: { ...r.mix } })) });
  S.quiz = quiz; S.sel = 0; S.planner = true; S.dirty = true;
  renderEditor();
  await save();
  if (!S.quiz.id) return;
  toast(`New quiz from “${t.title}” — writing it now…`);
  try { await writeAllRounds(); } catch {}
}
/** Saves this quiz's set-up (rounds, types, prompts, settings) as a reusable format, without its questions. */
async function saveAsTemplate() {
  const qz = S.quiz;
  const m = modal(`<h3>💾 Save as a weekly format</h3><p class="muted small">Keeps the rounds, how many of each type, and the AI prompts. Not the questions, so every quiz written from it is fresh.</p>
    <div class="field"><label>Name</label><input type="text" id="tpl_name" value="${esc(qz.title.replace(/\s*·.*$/, ''))}" placeholder="e.g. Tuesday pub quiz"></div>
    <div class="row mt" style="justify-content:flex-end"><button class="btn btn-ghost" data-x>Cancel</button><button class="btn btn-primary" data-ok>Save format</button></div>`);
  $('[data-x]', m).onclick = () => m.remove();
  $('[data-ok]', m).onclick = async () => {
    const name = $('#tpl_name', m).value.trim() || qz.title;
    const tpl = { id: null, title: name, settings: { ...qz.settings, template: true }, questions: [],
      rounds: qz.rounds.map((r) => ({ id: uid('r'), title: r.title, intro: r.intro, brief: r.brief, mix: { ...r.mix } })) };
    try { await api('save', { quiz: quizForSave(normalizeQuiz(tpl)) }); m.remove(); toast(`Saved. “${name}” is under Weekly formats on the quiz list.`); }
    catch (e) { toast('Could not save the format: ' + e.message, true); }
  };
  setTimeout(() => $('#tpl_name', m).select(), 50);
}
function quizCard(q) {
  return `<div class="card quizcard"><h3>${esc(q.title)}</h3>
    <div class="muted small">${q.count} question${q.count === 1 ? '' : 's'} · updated ${fmtDate(q.updated_at)}</div>
    <div class="types">${q.types.slice(0, 4).map((t) => `<span class="tag">${esc(TYPES[t]?.label || t)}</span>`).join('')}${q.types.length > 4 ? `<span class="tag" style="background:var(--paper);color:var(--ink-3)">+${q.types.length - 4} more</span>` : ''}</div>
    <div class="actions"><button class="btn btn-primary btn-sm" data-host="${q.id}" ${q.count ? '' : 'disabled'}>▶ Host</button>
      <button class="btn btn-sm" data-open="${q.id}">Edit</button>
      <button class="btn btn-ghost btn-sm" data-dup="${q.id}">Duplicate</button>
      <button class="btn btn-ghost btn-sm" data-del="${q.id}" style="color:var(--bad)">Delete</button></div></div>`;
}
function renderGames(games) {
  const el = $('#games'); if (!el || !games?.length) return;
  el.innerHTML = `<h2 style="font-size:1.2rem">Recent games</h2><div class="card">${games.slice(0, 20).map((g) => {
    const win = (g.players || [])[0];
    return `<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)"><b>${esc(g.title || 'Quiz')}</b><span class="muted small">${fmtDate(g.ended_at)} · ${(g.players || []).length} players</span><div class="grow"></div>${win ? `<span>🏆 ${win.emoji ? win.emoji + ' ' : ''}${esc(win.name)} <span class="muted">${win.score} pts</span></span>` : ''}<button class="btn btn-ghost btn-sm" data-report="${g.id}">📊 Report</button></div>`;
  }).join('')}</div>`;
  $$('[data-report]', el).forEach((b) => b.onclick = () => openReport(b.dataset.report));
}
async function duplicateQuiz(id) {
  try {
    const r = await api('get', { id });
    const copy = quizForSave(normalizeQuiz(r.quiz)); copy.id = null; copy.title += ' (copy)';
    await api('save', { quiz: copy }); toast('Duplicated'); loadList();
  } catch (e) { toast(e.message, true); }
}

// ------------------------------------------------------------------ editor
async function openQuiz(id) {
  view.innerHTML = '<p class="muted">Loading…</p>';
  try { const r = await api('get', { id }); S.quiz = normalizeQuiz(r.quiz); S.sel = 0; renderEditor(); }
  catch (e) { view.innerHTML = `<div class="error">${esc(e.message)}</div><p class="mt"><a href="index.html">Back to quizzes</a></p>`; }
}
function newQuiz() {
  S.quiz = normalizeQuiz({ title: 'New quiz', questions: [] }); Object.assign(S.quiz.rounds[0], { mix: { choice: 5, text: 3 }, count: 8, types: ['choice', 'text'] }); S.sel = 0; S.planner = true; renderEditor();
}
const cur = () => S.quiz.questions[S.sel];
const roundOf = (q) => S.quiz.rounds.find((r) => r.id === q.round) || S.quiz.rounds[0];
const roundIndex = (id) => S.quiz.rounds.findIndex((r) => r.id === id);

function renderEditor() {
  const q = S.quiz;
  if (q.id) history.replaceState(null, '', '?quiz=' + q.id);
  $('#topRight').innerHTML = '';
  view.innerHTML = `
    <div class="edhead">
      <div class="row"><button class="btn btn-ghost btn-sm" id="back">← Quizzes</button><input type="text" id="title" value="${esc(q.title)}" class="grow" style="font-weight:900;font-size:1.2rem;max-width:560px" placeholder="Quiz title"><span id="saveState" class="muted small"></span></div>
      <div class="row"><button class="btn btn-ghost btn-sm" id="planner">📋 Rounds</button><button class="btn btn-ghost btn-sm" id="settings">⚙ Settings</button><button class="btn btn-ghost btn-sm" id="aiAdd">✨ Add with AI</button><button class="btn btn-ghost btn-sm" id="checkAll" title="Fact-check every question with AI">✔ Check all</button><div class="grow"></div><button class="btn btn-sm" id="save">Save</button><button class="btn btn-primary btn-sm" id="host">▶ Host live</button></div>
    </div>
    <div class="editor"><div class="card qlist" id="qlist"></div><div class="card" id="qform"></div></div>`;
  $('#back').onclick = async () => { if (S.dirty) await save(); loadList(); };
  $('#title').oninput = (e) => { q.title = e.target.value; touch(); };
  $('#settings').onclick = settingsModal;
  $('#planner').onclick = () => { S.planner = true; renderPlanner(); };
  $('#aiAdd').onclick = () => aiModal(false, cur()?.round || q.rounds[0].id);
  $('#checkAll').onclick = () => checkRounds(q.rounds.map((r) => r.id));
  $('#save').onclick = () => save(true);
  $('#host').onclick = hostNow;
  renderQList(); renderQForm();
}
function touch() { S.dirty = true; orderQuestions(S.quiz); $('#saveState').textContent = 'Unsaved changes'; clearTimeout(S.saveTimer); S.saveTimer = setTimeout(() => save(), 2000); }
async function save(explicit) {
  if (S.saving || !S.quiz) return;
  S.saving = true; const st = $('#saveState'); if (st) st.textContent = 'Saving…';
  try {
    const r = await api('save', { quiz: quizForSave(S.quiz) });
    S.quiz.id = r.quiz.id; S.dirty = false;
    history.replaceState(null, '', '?quiz=' + S.quiz.id);
    if (st) st.textContent = 'Saved';
    if (explicit) toast('Saved');
  } catch (e) { if (st) st.textContent = 'Not saved'; toast('Could not save: ' + e.message, true); }
  S.saving = false;
}
async function hostNow() {
  const bad = S.quiz.questions.map((q, i) => ({ i, p: validate(q) })).filter((x) => x.p.length);
  if (!S.quiz.questions.length) return toast('Add a question first.', true);
  if (bad.length) { S.sel = bad[0].i; renderQList(); renderQForm(); return toast(`Question ${bad[0].i + 1} isn't finished: ${bad[0].p[0]}`, true); }
  await save();
  if (!S.quiz.id) return;
  window.open('host.html?quiz=' + S.quiz.id, '_blank');
}

function renderQList() {
  const qs = S.quiz.questions, rounds = S.quiz.rounds;
  let html = '';
  rounds.forEach((r, ri) => {
    const inRound = qs.map((q, i) => [q, i]).filter(([q]) => q.round === r.id);
    html += `<div class="roundhead"><div class="rt"><small>Round ${ri + 1} · ${inRound.length}${r.count ? ' of ' + r.count : ''} question${inRound.length === 1 && !r.count ? '' : 's'}${r.brief ? ' · ✨' : ''}</small>${esc(r.title) || '<span class="muted">Untitled round</span>'}</div>
      <div class="ra"><button data-rup="${ri}" title="Move round up" ${ri === 0 ? 'disabled' : ''}>▲</button><button data-rdown="${ri}" title="Move round down" ${ri === rounds.length - 1 ? 'disabled' : ''}>▼</button><button data-redit="${r.id}" title="Round name and AI brief">✎</button><button data-check="${r.id}" title="Fact-check this round with AI" ${inRound.length ? '' : 'disabled'}>✔</button></div></div>`;
    html += inRound.map(([q, i]) => {
      const probs = validate(q), ck = checkState(q);
      return `<div class="qtile ${i === S.sel ? 'active' : ''}" data-i="${i}">
        <div class="n">${i + 1}</div>
        <div class="t"><small>${TYPES[q.type].icon} ${esc(TYPES[q.type].label)} · ${q.time}s${q.media?.kind === 'youtube' ? ' · ▶ video' : q.media?.kind === 'image' ? ' · 🖼' : ''}</small>${esc(q.text) || '<span class="muted">Untitled question</span>'}</div>
        <div class="mv">${probs.length ? '<span class="warn" title="' + esc(probs.join(' ')) + '">!</span>' : ''}${ck ? `<span class="chk ${ck}" title="${esc(q.check.note || '')}">${{ ok: '✓', doubt: '?', wrong: '✗', stale: '~' }[ck]}</span>` : ''}<button data-up="${i}" title="Move up" ${inRound[0][1] === i ? 'disabled' : ''}>▲</button><button data-down="${i}" title="Move down" ${inRound[inRound.length - 1][1] === i ? 'disabled' : ''}>▼</button></div></div>`;

function moveQ(i, d) {

function moveRound(i, d) {

/** What a round still needs, type by type: its mix minus what is already in it. */
function roundShortfall(r) {
  const have = {}; for (const q of S.quiz.questions) if (q.round === r.id) have[q.type] = (have[q.type] || 0) + 1;
  return Object.entries(r.mix || {}).map(([type, n]) => ({ type, need: Math.max(0, n - (have[type] || 0)) })).filter((x) => x.need > 0);
}
/** Writes every round that still needs questions, one after another, following each round's own mix. */
async function writeAllRounds() {
  const todo = S.quiz.rounds.filter((r) => roundShortfall(r).length);
  if (!todo.length) return toast('Every round already has its questions.');
  if (todo.some((r) => !r.title && !r.brief)) return toast('Give every round a title or a prompt first.', true);
  for (const r of todo) { await generateForRound(r); }
  toast('All rounds written. Read them through before you host.');
  S.planner = false; renderQList(); renderQForm();
}
/** Generates a round's missing questions, one type at a time in the quantities its mix asks for, following its title and prompt. */
async function generateForRound(r) {
  const plan = roundShortfall(r);
  const total = plan.reduce((a, x) => a + x.need, 0);
  if (!total) return;
  const m = modal(`<h3>✨ Writing Round ${roundIndex(r.id) + 1}${r.title ? ': ' + esc(r.title) : ''}</h3><div class="gen-progress"><span class="spinner"></span><span id="ga_step">Starting…</span></div><p class="muted small mt">${plan.map((x) => `${x.need} × ${esc(TYPES[x.type].label)}`).join(' · ')}</p>`);
  $('#ga_step', m).textContent = 'Checking what has been asked before…';
  const avoid = await avoidList(); let written = 0;
  try {
    for (const { type, need } of plan) {
      const BATCH = ['race', 'wipeout', 'pin', 'match'].includes(type) ? 2 : ['choice', 'tf', 'text', 'order', 'sort'].includes(type) ? 6 : 4; // heavy ones fetch pictures; plain ones are quick on Sonnet
      let got = 0;
      while (got < need) {
        $('#ga_step', m).textContent = `${TYPES[type].label}: writing ${got + 1}–${Math.min(need, got + BATCH)} of ${need} (${written} of ${total} done)…`;
        const usedPictures = S.quiz.questions.flatMap((q) => [q.media?.source, q.media?.url]).filter((s) => typeof s === 'string' && /^https?:/.test(s));
        const res = await api('generate', { topic: (r.brief ? `${r.title}. ${r.brief}` : r.title).slice(0, 200), title: r.title, brief: r.brief, usedPictures, count: Math.min(BATCH, need - got), difficulty: 'mixed', types: [type], pictures: true, web: true, avoid, premium: !!S.quiz.settings.aiPremium }, { timeout: 170000 });
        LQ.addUsage(S.quiz.settings, res.usage);
        if (!res.questions.length) break;
        if (!res.questions.some((q) => q.type === type)) { toast(`The server wrote ${TYPES[res.questions[0].type]?.label || 'other'} questions instead of ${TYPES[type].label}: the quiz-api function is out of date and needs redeploying. They were not added.`, true); break; }
        for (const q of res.questions) { q.round = r.id; q.time = timeFor(q.type, S.quiz.settings); if (q.collage && !q.media?.url) { try { await buildCollageFor(q); } catch {} } S.quiz.questions.push(q); avoid.push(q.text); got++; written++; }
        touch(); renderQList(); save();
      }
    }
    m.remove();
  } catch (e) { m.remove(); toast(`Round ${roundIndex(r.id) + 1}: ${e.message}`, true); throw e; }
}

    $$('[data-dt]').forEach((inp) => inp.oninput = () => { q.elements[+inp.dataset.dt].t = inp.value; prev(); });
    num('data-dx', 'x', 0, 100); num('data-dy', 'y', 0, 100); num('data-ds', 's', 1, 6); num('data-dr', 'rot', -180, 180);
    $$('[data-df]').forEach((sel) => sel.onchange = () => { q.elements[+sel.dataset.df].flip = sel.value; prev(); });
    $$('[data-dst]').forEach((sel) => sel.onchange = () => { q.elements[+sel.dataset.dst].style = sel.value; prev(); });
    $$('[data-drm]').forEach((b) => b.onclick = () => { q.elements.splice(+b.dataset.drm, 1); touch(); renderTypeBox(); showProblems(); });
    $('#db_add').onclick = () => { q.elements.push({ t: '', x: 50, y: q.elements.length ? 70 : 50, s: 4 }); touch(); renderTypeBox(); $$('[data-dt]').pop().focus(); };
    $$('[data-ans]').forEach((inp) => inp.oninput = () => { q.answers[+inp.dataset.ans] = inp.value; touch(); showProblems(); });
    $$('[data-rm-ans]').forEach((b) => b.onclick = () => { q.answers.splice(+b.dataset.rmAns, 1); touch(); renderTypeBox(); showProblems(); });
    $('#addAns').onclick = () => { q.answers.push(''); touch(); renderTypeBox(); $$('[data-ans]').pop().focus(); };
  }
  if (q.type === 'rhyme') {
    box.innerHTML = `<div class="notice" style="margin-bottom:12px">Rhyme Time: two clues on the screen whose answers rhyme. Players type both answers in one box, first then second. <i>Sherlock's sidekick</i> + <i>Famous Bermondsey bottle</i>… the answers just need to rhyme.</div>
      <div class="row"><div class="field grow"><label>Answer to the first clue</label><input type="text" id="rh_a1" value="${esc(q.answer1 || '')}" placeholder="e.g. Watson"></div></div>
      <div class="field"><label>The second clue</label><textarea id="rh_t2" placeholder="e.g. A large, loud gathering after dark">${esc(q.text2 || '')}</textarea></div>
      <div class="row"><div class="field grow"><label>Answer to the second clue <span class="muted">— rhymes with the first</span></label><input type="text" id="rh_a2" value="${esc(q.answer2 || '')}" placeholder="e.g. Party"></div></div>
      <div id="rh_check" class="help"></div>`;
    const check = () => { const a = (q.answer1 || '').trim(), b = (q.answer2 || '').trim(); const end = (s) => LQ.normText(s).replace(/\s/g, '').slice(-2); $('#rh_check').textContent = a && b ? (end(a) === end(b) ? `Players type: "${a} ${b}"` : `Do "${a}" and "${b}" rhyme? They don't share an ending, but you know best.`) : ''; };
    $('#rh_a1').oninput = (e) => { q.answer1 = e.target.value; touch(); check(); showProblems(); };
    $('#rh_a2').oninput = (e) => { q.answer2 = e.target.value; touch(); check(); showProblems(); };
    $('#rh_t2').oninput = (e) => { q.text2 = e.target.value; touch(); showProblems(); };
    check();
  }
  if (q.type === 'wheel') {
    box.innerHTML = `<div class="notice" style="margin-bottom:12px">The phrase goes up on the board hidden. Every few seconds another letter turns over, everywhere it appears. Players type the whole phrase on their phones whenever they think they know it, and the sooner the better: points fall with the clock.</div>
      <div class="row"><div class="field grow"><label>The phrase</label><input type="text" id="w_phrase" value="${esc(q.phrase || '')}" placeholder="e.g. A PIECE OF CAKE" style="text-transform:uppercase"></div><div class="field" style="max-width:220px"><label>Category <span class="muted">— shown under the board</span></label><input type="text" id="w_cat" value="${esc(q.category || '')}" placeholder="Phrase, Person, Place, Thing…" list="w_cats"><datalist id="w_cats">${['Phrase', 'Person', 'Place', 'Thing', 'Event', 'Food & Drink', 'Song Title', 'Movie Title', 'TV Show', 'Before & After', 'Same Name', 'Living Thing', 'Proper Name', 'What Are You Doing?', 'On the Map', 'Fictional Character', 'Around the House', 'Landmark', 'Occupation'].map((c) => `<option value="${c}">`).join('')}</datalist></div></div>
      <div id="w_board" class="center" style="margin:6px 0 14px"></div>
      <div class="row"><div class="field" style="max-width:200px"><label>Turn a letter every (seconds)</label><input type="number" id="w_every" min="1" max="30" value="${q.revealEvery || 4}"></div><div class="field grow"><label>Letters shown from the start <span class="muted">— optional, e.g. RSTLNE</span></label><input type="text" id="w_start" value="${esc(q.startLetters || '')}" placeholder="none" style="text-transform:uppercase"></div></div>`;
    const draw = () => { const L = LQ.wheelLayout(q.phrase); $('#w_board').innerHTML = L ? LQ.wheelBoardHtml(L, q.startLetters || '', false) + `<div><span class="wof-cat">${esc(q.category || 'Phrase')}</span></div>` : `<div class="error">${q.phrase ? 'That does not fit the board: four rows of 12, 14, 14 and 12 letters, and a word cannot be split across rows.' : 'Type the phrase to see it on the board.'}</div>`; };
    $('#w_phrase').oninput = (e) => { q.phrase = e.target.value.toUpperCase(); q.text = q.phrase; touch(); draw(); showProblems(); refreshTile(); };
    $('#w_cat').oninput = (e) => { q.category = e.target.value; touch(); draw(); showProblems(); };
    $('#w_every').onchange = (e) => { q.revealEvery = LQ.clamp(+e.target.value || 4, 1, 30); touch(); };
    $('#w_start').oninput = (e) => { q.startLetters = e.target.value.toUpperCase().replace(/[^A-Z]/g, ''); touch(); draw(); };
    draw();
  }
  if (q.type === 'smash') {
    box.innerHTML = `<div class="notice" style="margin-bottom:12px">Answer Smash: the picture's answer and the clue's answer overlap, and players type the two smashed into one. <i>Emma Watson</i> + <i>Sonic the Hedgehog</i> = <b>Emma Watsonic the Hedgehog</b>. Write the clue in the question box above.</div>
      <div class="row"><div class="field grow"><label>The picture is of</label><input type="text" id="s_pic" value="${esc(q.pictureAnswer || '')}" placeholder="e.g. Emma Watson"></div><div class="field grow"><label>The clue's answer</label><input type="text" id="s_ans" value="${esc(q.clueAnswer || '')}" placeholder="e.g. Sonic the Hedgehog"></div></div>
      <div class="field"><label>The smash <span class="muted">— what players have to type</span></label><div id="smashOut"></div></div>`;
    const draw = () => {
      const auto = LQ.smashOf(q.pictureAnswer, q.clueAnswer);
      if (!q.smashCustom) q.smash = auto.smash;
      const out = $('#smashOut');
      if (q.smashCustom) out.innerHTML = `<div class="row"><input type="text" id="s_smash" class="grow" value="${esc(q.smash || '')}"><button class="btn btn-ghost btn-sm" id="s_auto">Work it out for me</button></div>`;
      else if (auto.overlap) { const a = q.pictureAnswer.trimEnd(), ov = a.slice(a.length - auto.overlap); out.innerHTML = `<div class="smashline">${esc(a.slice(0, a.length - auto.overlap))}<mark>${esc(ov)}</mark>${esc(auto.smash.slice(a.length))}</div><div class="help">The highlighted letters are shared by both answers. <a href="#" id="s_edit">Type the smash yourself instead</a>.</div>`; }
      else out.innerHTML = `<div class="error">These two don't overlap: the end of the first has to be the start of the second. Change one of them, or <a href="#" id="s_edit">type the smash yourself</a>.</div>`;
      if ($('#s_edit')) $('#s_edit').onclick = (e) => { e.preventDefault(); q.smashCustom = true; touch(); draw(); $('#s_smash')?.focus(); };
      if ($('#s_auto')) $('#s_auto').onclick = () => { q.smashCustom = false; touch(); draw(); showProblems(); };
      if ($('#s_smash')) $('#s_smash').oninput = (e) => { q.smash = e.target.value; touch(); showProblems(); };
      showProblems();
    };
    $('#s_pic').oninput = (e) => { q.pictureAnswer = e.target.value; touch(); draw(); };
    $('#s_ans').oninput = (e) => { q.clueAnswer = e.target.value; touch(); draw(); };
    draw();
  }
}
function renderPinPick() {
  const q = cur(); const box = $('#pinpick'); if (!box) return;
  if (!q.media?.url) { box.innerHTML = '<div class="notice">Add a picture below first — a map, a photo, a collage, anything.</div>'; return; }
  const area = q.mode === 'area';
  box.innerHTML = `<div class="pinpick ${area ? 'area' : ''}"><img src="${esc(q.media.url)}" draggable="false">${area ? '<div class="rect"></div>' : '<div class="ring zero"></div><div class="ring full"></div><svg class="pin" viewBox="0 0 24 24"><path fill="#e21b3c" stroke="#fff" stroke-width="1.5" d="M12 1.5a7.5 7.5 0 0 0-7.5 7.5c0 5.6 7.5 13.5 7.5 13.5S19.5 14.6 19.5 9A7.5 7.5 0 0 0 12 1.5z"/><circle cx="12" cy="9" r="3" fill="#fff"/></svg>'}</div>`;
  const wrap = $('.pinpick', box), img = $('img', wrap);
  const frac = (e) => { const r = img.getBoundingClientRect(); return { x: LQ.clamp((e.clientX - r.left) / r.width, 0, 1), y: LQ.clamp((e.clientY - r.top) / r.height, 0, 1) }; };
  if (area) {
    const place = () => {
      const w = img.clientWidth, h = img.clientHeight; if (!w) return;
      $$('.tile', wrap).forEach((t) => t.remove());
      for (const [i, t] of (q.collage || []).entries()) { const d = document.createElement('div'); d.className = 'tile'; d.style.left = t.rect.x * w + 'px'; d.style.top = t.rect.y * h + 'px'; d.style.width = t.rect.w * w + 'px'; d.style.height = t.rect.h * h + 'px'; d.title = t.title || ''; d.onclick = (e) => { e.stopPropagation(); q.target = { ...t.rect }; q.answerIndex = i; touch(); place(); showProblems(); }; wrap.appendChild(d); }
      const r = $('.rect', wrap); if (q.target && q.target.w > 0) { r.style.display = 'block'; r.style.left = q.target.x * w + 'px'; r.style.top = q.target.y * h + 'px'; r.style.width = q.target.w * w + 'px'; r.style.height = q.target.h * h + 'px'; } else r.style.display = 'none';
    };
    img.onload = place; if (img.complete) place();
    let start = null;
    wrap.onpointerdown = (e) => { if (e.target.classList.contains('tile')) return; start = frac(e); wrap.setPointerCapture(e.pointerId); };
    wrap.onpointermove = (e) => { if (!start) return; const p = frac(e); q.target = { x: Math.min(start.x, p.x), y: Math.min(start.y, p.y), w: Math.abs(p.x - start.x), h: Math.abs(p.y - start.y) }; place(); };
    wrap.onpointerup = (e) => { if (!start) return; const p = frac(e); const t = { x: Math.min(start.x, p.x), y: Math.min(start.y, p.y), w: Math.abs(p.x - start.x), h: Math.abs(p.y - start.y) }; start = null; if (t.w > 0.01 && t.h > 0.01) { q.target = t; delete q.answerIndex; } touch(); place(); showProblems(); };
    return;
  }
  const place = () => {
    const w = img.clientWidth, h = img.clientHeight; if (!w) return;
    $('.pin', wrap).style.left = (q.pin.x * w) + 'px'; $('.pin', wrap).style.top = (q.pin.y * h) + 'px';
    for (const [cls, r] of [['full', q.radiusFull], ['zero', q.radiusZero]]) { const el = $('.ring.' + cls, wrap); el.style.left = (q.pin.x * w) + 'px'; el.style.top = (q.pin.y * h) + 'px'; el.style.width = el.style.height = (r * 2 * w) + 'px'; }
  };
  img.onload = place; if (img.complete) place();
  wrap.onclick = (e) => { q.pin = frac(e); touch(); place(); showProblems(); };
}

// ------------------------------------------------------------------ collages
function collageModal(q) {
  const tiles = (q.collage || []).map((t) => ({ title: t.title || '', url: t.url, credit: t.credit }));
  let answer = Number.isInteger(q.answerIndex) ? q.answerIndex : 0;
  const m = modal(`<h3>🖼 Make a collage</h3><p class="muted small">Two to nine pictures, tiled into one. Tick the one that is the answer.</p><div id="c_list"></div>
    <div class="row mt"><input type="text" id="c_title" class="grow" placeholder="Find a picture of… e.g. Amalgam carrier"><button class="btn btn-sm" id="c_find">Find on Wikipedia</button><button class="btn btn-ghost btn-sm" id="c_up">Upload</button></div>
    <div id="c_err" class="mt"></div>
    <div class="row mt" style="justify-content:flex-end"><button class="btn btn-ghost" data-x>Cancel</button><button class="btn btn-primary" data-ok>Build the collage</button></div>`);
  const draw = () => {
    $('#c_list', m).innerHTML = tiles.length ? tiles.map((t, i) => `<div class="list-item" style="grid-template-columns:44px 1fr auto auto"><img class="thumb" src="${esc(t.url)}"><input type="text" data-ct="${i}" value="${esc(t.title)}" placeholder="What it is (for your notes)"><label class="check" title="This is the answer"><input type="radio" name="c_ans" ${i === answer ? 'checked' : ''} data-ca="${i}"> answer</label><button class="btn btn-ghost btn-sm" data-cr="${i}">✕</button></div>`).join('') : '<p class="muted">No pictures yet.</p>';
    $$('[data-ct]', m).forEach((inp) => inp.oninput = () => { tiles[+inp.dataset.ct].title = inp.value; });
    $$('[data-ca]', m).forEach((r) => r.onchange = () => { answer = +r.dataset.ca; });
    $$('[data-cr]', m).forEach((b) => b.onclick = () => { tiles.splice(+b.dataset.cr, 1); if (answer >= tiles.length) answer = 0; draw(); });
    $('[data-ok]', m).disabled = tiles.length < 2;
  };
  const err = (msg) => { $('#c_err', m).innerHTML = msg ? `<div class="error">${esc(msg)}</div>` : ''; };
  $('#c_find', m).onclick = async () => {
    const title = $('#c_title', m).value.trim(); if (!title) return; if (tiles.length >= 9) return err('Nine pictures at most.');
    err(''); $('#c_find', m).disabled = true;
    try { const r = await api('picture', { title }, { timeout: 60000 }); tiles.push({ title, url: r.url, credit: `Wikipedia / Wikimedia Commons: ${title}` }); $('#c_title', m).value = ''; draw(); }
    catch (e) { err(e.message); }
    $('#c_find', m).disabled = false;
  };
  $('#c_title', m).onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); $('#c_find', m).click(); } };
  $('#c_up', m).onclick = () => { if (tiles.length >= 9) return err('Nine pictures at most.'); pickImage((url) => { tiles.push({ title: '', url }); draw(); }); };
  $('[data-x]', m).onclick = () => m.remove();
  $('[data-ok]', m).onclick = async () => {
    $('[data-ok]', m).disabled = true; err('');
    try { q.collage = tiles; q.answerIndex = answer; await buildCollageFor(q); touch(); m.remove(); renderTypeBox(); renderMediaBox(); showProblems(); toast('Collage built'); }
    catch (e) { err(e.message); $('[data-ok]', m).disabled = false; }
  };
  draw();
}

function renderMediaBox() {
  const q = cur(); const box = $('#mediaBox'); const m = q.media || (q.media = { kind: 'none' });
  const pinOnly = q.type === 'pin' || q.type === 'smash';
  box.innerHTML = `${pinOnly ? '' : `<div class="media-tabs"><button data-mk="none" class="${m.kind === 'none' ? 'on' : ''}">Nothing</button><button data-mk="image" class="${m.kind === 'image' ? 'on' : ''}">🖼 Picture</button><button data-mk="youtube" class="${m.kind === 'youtube' ? 'on' : ''}">▶ YouTube video</button></div>`}<div id="mediaPanel"></div>`;
  $$('[data-mk]').forEach((b) => b.onclick = () => { const k = b.dataset.mk; if (k === m.kind) return; q.media = k === 'none' ? { kind: 'none' } : k === 'image' ? { kind: 'image', url: '' } : { kind: 'youtube', url: '', videoId: '', start: 0 }; touch(); renderMediaBox(); showProblems(); });
  const p = $('#mediaPanel');

    p.innerHTML = `${q.media.url ? `<div class="preview"><img src="${esc(q.media.url)}"></div>` : ''}
      <div class="row mt"><button class="btn btn-sm" id="upPic">${q.media.url ? 'Change picture' : 'Upload a picture'}</button><span class="muted small">or paste a link:</span><input type="url" id="picUrl" class="grow" placeholder="https://…jpg" value="${q.media.url && !q.media.url.includes('/quiz-media/') ? esc(q.media.url) : ''}" style="max-width:380px"></div>
      ${q.media.credit ? `<div class="help">${esc(q.media.credit)}</div>` : ''}
      ${q.type === 'pin' ? `<div class="row mt"><button class="btn btn-sm" id="blankMap">🗺 Blank map of a place…</button><span class="help">A label-free map of any country, region or continent, or “World”.${q.mapRegion ? ` Currently: ${esc(q.mapRegion)}.` : ''}</span></div><div class="help">For “where on the body / on the pitch / in the painting” upload any picture instead.</div>` : q.type === 'smash' ? `<div class="row mt"><button class="btn btn-sm" id="findPic">🔎 Find a picture of ${esc(q.pictureAnswer || '…')}</button><span class="help">From Wikipedia, or upload your own.</span></div>` : '<div class="help">Shown big on the screen while the question is live, and on players\' phones.</div>'}`;
    $('#upPic').onclick = () => pickImage((url) => { q.media = { kind: 'image', url }; delete q.mapRegion; delete q.mapBounds; delete q.collage; touch(); renderMediaBox(); if (pinOnly) renderPinPick(); showProblems(); });
    if ($('#findPic')) $('#findPic').onclick = async () => {
      const title = q.pictureAnswer?.trim(); if (!title) return toast('Fill in what the picture is of first.', true);
      toast('Finding a picture…');
      try { const r = await api('picture', { title }, { timeout: 60000 }); q.media = { kind: 'image', url: r.url, credit: `Wikipedia / Wikimedia Commons: ${title}` }; touch(); renderMediaBox(); showProblems(); toast('Picture added'); }
      catch (e) { toast(e.message, true); }

    if ($('#blankMap')) $('#blankMap').onclick = () => {
      const m = modal(`<h3>Blank map of…</h3><div class="field"><input type="text" id="mapRegion" placeholder="e.g. France, United Kingdom, Europe, Africa, USA, World" value="${esc(q.mapRegion || '')}" autofocus></div><div id="mapErr"></div><div class="row" style="justify-content:flex-end"><button class="btn btn-ghost" data-x>Cancel</button><button class="btn btn-primary" data-ok>Use this map</button></div>`);
      $('[data-x]', m).onclick = () => m.remove();
      const go = async () => {
        const region = $('#mapRegion', m).value.trim(); if (!region) return;
        $('[data-ok]', m).disabled = true; $('#mapErr', m).innerHTML = '<span class="spinner"></span>';
        try { const r = await api('map', { region }, { timeout: 60000 }); q.media = { kind: 'image', url: r.url, credit: `Wikimedia Commons: ${r.region} location map` }; q.mapRegion = r.region; if (r.bounds) q.mapBounds = r.bounds; else delete q.mapBounds; touch(); m.remove(); renderMediaBox(); renderPinPick(); showProblems(); }
        catch (e) { $('#mapErr', m).innerHTML = `<div class="error" style="margin-bottom:10px">${esc(e.message)}</div>`; $('[data-ok]', m).disabled = false; }
      };
      $('[data-ok]', m).onclick = go; $('#mapRegion', m).onkeydown = (e) => { if (e.key === 'Enter') go(); };
    };
    $('#picUrl').onchange = (e) => { const u = e.target.value.trim(); if (!u) return; q.media = { kind: 'image', url: u }; touch(); renderMediaBox(); if (pinOnly) renderPinPick(); showProblems(); };
  } else if (m.kind === 'youtube') {
    p.innerHTML = `<div class="row"><input type="url" id="ytUrl" class="grow" placeholder="Paste a YouTube link" value="${esc(m.url || '')}"><div class="field" style="margin:0;max-width:170px"><input type="number" id="ytStart" min="0" placeholder="Start at (s)" value="${m.start || ''}"></div><div class="field" style="margin:0;max-width:150px"><input type="number" id="ytEnd" min="0" placeholder="Stop at (s)" value="${m.end || ''}"></div></div>
      ${m.videoId ? `<div class="preview mt"><iframe src="https://www.youtube-nocookie.com/embed/${esc(m.videoId)}?start=${+m.start || 0}${m.end ? '&end=' + (+m.end) : ''}" allow="autoplay; encrypted-media" allowfullscreen></iframe></div>` : ''}
      <div class="help">The video plays on the host screen with sound as soon as the question starts and stops at the stop time (blank plays on). For Catchphrase-style clips, start just before the scene and stop before the answer is said. Players answer on their phones while it plays. Share your screen with sound on the call.</div>`;
    $('#ytUrl').onchange = (e) => { m.url = e.target.value.trim(); m.videoId = youtubeId(m.url); touch(); renderMediaBox(); showProblems(); };
    $('#ytStart').onchange = (e) => { m.start = Math.max(0, +e.target.value || 0); touch(); renderMediaBox(); };
    $('#ytEnd').onchange = (e) => { m.end = Math.max(0, +e.target.value || 0) || undefined; touch(); renderMediaBox(); };
  } else {
    p.innerHTML = '<div class="help">Just the question text on the screen.</div>';
  }
}
function pickImage(cb) {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    toast('Uploading picture…');
    try { const r = await resizeImage(f); const u = await api('upload', { data: r.data, contentType: r.contentType }, { timeout: 90000 }); toast('Picture added'); cb(u.url); }
    catch (e) { toast(e.message, true); }
  };
  inp.click();
}

    <div class="field grow"><label>Points at the buzzer</label><input type="number" id="s_min" value="${s.minPoints}" min="0" max="10000"></div></div>
    <div class="help" style="margin-top:-8px;margin-bottom:12px">Points fall in a straight line from the first number to the second over the question's time limit. Wrong answers score nothing.</div>
    <div class="field"><label>Time limit by question type (seconds)</label>
      <div class="timegrid">${Object.entries(TYPES).map(([k, t]) => `<label><span>${t.icon} ${esc(t.label)}</span><input type="number" data-tt="${k}" value="${timeFor(k, s)}" min="5" max="180"></label>`).join('')}</div>
      <div class="help">New questions and AI-written ones get their type's time. Each question can still be changed on its own.</div>
      <label class="check" style="margin-top:8px"><input type="checkbox" id="s_apply"> Apply these to every question already in the quiz</label></div>
    <label class="check"><input type="checkbox" id="s_show" ${s.showAnswersOnPhones !== false ? 'checked' : ''}> Show the right answer on players' phones after each question</label>
    <div class="field mt"><label>AI models</label>
      <label class="check"><input type="checkbox" id="s_premium" ${s.aiPremium ? 'checked' : ''}> Use the top model (Opus) for every question type</label>
      <div class="help">Off: plain factual questions are written by Sonnet with a few web searches, the wordplay and logic types (10% Club, Dingbats, Rhyme Time, Highbrow Lowbrow, Answer Smash, Wheel) by Opus without searching, and typed answers are judged by Haiku. On: everything on Opus with more searches, at several times the cost.</div>
      ${(() => { const u = LQ.usageSummary(s.aiUsage); return u ? `<div class="notice" style="margin-top:8px"><b>AI used on this quiz so far:</b> about $${u.usd.toFixed(2)} at list prices.<br><span class="small">${u.rows.map(esc).join('<br>')}</span></div>` : '<div class="help">No AI used on this quiz yet.</div>'; })()}</div>
    <div class="row mt" style="justify-content:flex-end"><button class="btn btn-ghost" data-x>Cancel</button><button class="btn btn-primary" data-ok>Done</button></div>`);
  $('[data-x]', m).onclick = () => m.remove();
  $('[data-ok]', m).onclick = () => {
    s.maxPoints = LQ.clamp(+$('#s_max', m).value || 1000, 10, 10000);
    s.minPoints = LQ.clamp(+$('#s_min', m).value || 0, 0, s.maxPoints);
    s.timeByType = {}; $$('[data-tt]', m).forEach((inp) => { s.timeByType[inp.dataset.tt] = LQ.clamp(+inp.value || LQ.DEFAULT_TIMES[inp.dataset.tt], 5, 180); });
    s.showAnswersOnPhones = $('#s_show', m).checked;
    s.aiPremium = $('#s_premium', m).checked;
    if ($('#s_apply', m).checked) for (const q of S.quiz.questions) q.time = timeFor(q.type, s);
    touch(); m.remove(); renderQList(); renderQForm(); toast('Settings updated');
  };
}

// ------------------------------------------------------------------ AI: what's been asked before
/** Question texts from every quiz ever saved (except this one), newest first, fetched once per session. */
async function pastQuestions() {
  if (S.history && S.historyFor === (S.quiz?.id || null)) return S.history;
  try { const r = await api('history', { exclude: S.quiz?.id || null }); S.history = r.questions.map((q) => q.text); S.historyFor = S.quiz?.id || null; S.historyQuizzes = r.quizzes; }
  catch { S.history = []; }
  return S.history;
}
/** The full do-not-repeat list for a request: this quiz's questions first, then everything from earlier quizzes. */
async function avoidList(extra = []) {
  const here = S.quiz ? S.quiz.questions.map((q) => q.type === 'smash' ? `${q.pictureAnswer} + ${q.clueAnswer}` : q.type === 'wheel' ? q.phrase : q.text).filter(Boolean) : [];
  const past = await pastQuestions();
  return [...new Set([...extra, ...here, ...past])];
}

// ------------------------------------------------------------------ AI: fill a race bank
function bankModal(q) {
  const need = Math.max(0, Math.max(20, (q.target || 10) * 2) - q.bank.filter((b) => b.text.trim()).length);
  const m = modal(`<h3>✨ Fill the question bank</h3>
    ${S.ai ? '' : '<div class="error" style="margin-bottom:12px">AI isn\'t switched on for this server yet.</div>'}
    <div class="field"><label>Topic</label><input type="text" id="b_topic" value="${esc(q.text.replace(/^the race:?\s*/i, ''))}" placeholder="e.g. Capital cities, 90s number ones, the Premier League"></div>
    <div class="row"><div class="field grow"><label>How many to add</label><input type="number" id="b_count" value="${need || 10}" min="1" max="40"></div>
      <div class="field grow"><label>Difficulty</label><select id="b_diff"><option value="easy">Easy — it's a race</option><option value="mixed" selected>Mixed</option><option value="medium">Medium</option><option value="hard">Hard</option></select></div></div>
    <label class="check"><input type="checkbox" id="b_web"> Search the web to check facts</label>
    <div class="help" style="margin-top:6px">Race questions are quick multiple choice: short question, four short answers. Empty rows in the bank are replaced first.</div>
    <div id="b_prog" class="mt hidden"></div>
    <div class="row mt" style="justify-content:flex-end"><button class="btn btn-ghost" data-x>Cancel</button><button class="btn btn-primary" data-ok ${S.ai ? '' : 'disabled'}>Write them</button></div>`);
  $('[data-x]', m).onclick = () => m.remove();
  $('[data-ok]', m).onclick = async () => {
    const topic = $('#b_topic', m).value.trim(); if (!topic) return toast('Give it a topic.', true);
    const total = LQ.clamp(+$('#b_count', m).value || 10, 1, 40), BATCH = 6;
    const btn = $('[data-ok]', m); btn.disabled = true; $('[data-x]', m).disabled = true;
    const prog = $('#b_prog', m); prog.classList.remove('hidden'); prog.innerHTML = `<div class="gen-progress"><span class="spinner"></span><span id="b_step"></span></div>`;
    const avoid = await avoidList(q.bank.map((b) => b.text).filter(Boolean)); let written = 0;
    try {
      while (written < total) {
        $('#b_step', m).textContent = `Writing questions ${written + 1}–${Math.min(total, written + BATCH)} of ${total}…`;
        const r = await api('generate', { topic, title: topic, brief: `Quick-fire race questions on ${topic}: one short line each, four short answers, nothing that needs thinking time.`, count: Math.min(BATCH, total - written), difficulty: $('#b_diff', m).value, types: ['choice'], pictures: false, web: $('#b_web', m).checked, avoid, premium: !!S.quiz.settings.aiPremium }, { timeout: 170000 });
        LQ.addUsage(S.quiz.settings, r.usage);
        if (!r.questions.length) break;
        for (const g of r.questions) {
          const right = g.options.find((o) => o.id === g.correct)?.text; if (!right) continue;
          const wrong = g.options.filter((o) => o.id !== g.correct).map((o) => o.text);
          const item = { id: uid('b'), text: g.text, options: [right, wrong[0] || '', wrong[1] || '', wrong[2] || ''] };
          const empty = q.bank.findIndex((b) => !b.text.trim() && !b.options.some((o) => o.trim()));
          if (empty >= 0) q.bank[empty] = item; else q.bank.push(item);
          avoid.push(g.text); written++;
        }
        touch(); renderTypeBox(); showProblems(); save();
      }
      m.remove(); toast(`Added ${written} question${written === 1 ? '' : 's'} to the bank.`);
    } catch (e) { prog.innerHTML = `<div class="error">${esc(e.message)}</div>`; btn.disabled = false; $('[data-x]', m).disabled = false; }
  };
}

// ------------------------------------------------------------------ AI fact-check
/** The question as the checker sees it — also what a check is tied to, so an edit makes it stale. */
function summaryOf(q) {
  const lines = [`Type: ${TYPES[q.type].label}`, `Question: ${q.type === 'wheel' ? '(puzzle board)' : q.text}`];
  if (q.type === 'choice') lines.push('Options: ' + q.options.filter((o) => o.text.trim()).map((o) => o.text + (o.id === q.correct ? ' [MARKED CORRECT]' : '')).join(' | '));  if (q.type === 'text') lines.push('Accepted answers: ' + q.answers.filter((a) => a.trim()).join(' | '));
  if (q.type === 'order') lines.push(`Correct order${q.hint ? ` (${q.hint})` : ''}: ` + q.items.filter((i) => i.text.trim()).map((i, n) => `${n + 1}. ${i.text}`).join(' | '));
  if (q.type === 'tf') lines.push(`Marked as: ${q.answer === false ? 'FALSE' : 'TRUE'}`);
  if (q.type === 'sort') lines.push('Categories and the answers placed in each: ' + q.categories.filter((c) => c.name.trim()).map((c) => `${c.name}: ${q.items.filter((i) => i.category === c.id && i.text.trim()).map((i) => i.text).join(', ') || '(none)'}`).join(' | '));
  if (q.type === 'wipeout') lines.push('Marked RIGHT (each must genuinely fit the question): ' + q.right.filter((i) => i.text.trim()).map((i) => i.text).join(' | '), 'Marked WRONG (each must genuinely NOT fit): ' + q.wrong.filter((i) => i.text.trim()).map((i) => i.text).join(' | '));
  if (q.type === 'race') lines.push(`Race to ${q.target} right. Bank (right answer first, then wrong ones):\n` + q.bank.filter((b) => b.text.trim()).map((b, i) => `${i + 1}. ${b.text} — RIGHT: ${b.options[0]}; wrong: ${b.options.slice(1).filter(Boolean).join(', ')}`).join('\n'));
  if (q.type === 'match') lines.push('Pairs (left → right): ' + q.pairs.map((p) => `${p.left} → ${p.right.kind === 'image' ? '[a picture — cannot be checked here, treat as fine]' : p.right.value}`).join(' | '));
  if (q.type === 'highlow') lines.push(`Highbrow Lowbrow: both clues must have the same answer. Highbrow clue: ${q.text}. Lowbrow clue: ${q.lowText}. Accepted answers: ${q.answers.filter((a) => a.trim()).join(' | ')}. Check each clue really leads to that answer and nothing else.`);
  if (q.type === 'club') lines.push(`The 10% Club (logic/lateral thinking, no knowledge needed), billed as a ${q.pct}% question. Accepted answers: ${q.answers.filter((a) => a.trim()).join(' | ')}. Check the puzzle has exactly that answer, is solvable by reasoning alone within 30 seconds, and that the difficulty roughly matches the percentage.`);
  if (q.type === 'dingbat') lines.push(`Dingbats rebus. Words on the board: ${(q.elements || []).filter((e) => (e.t || '').trim()).map((e) => `"${e.t}" at x${e.x} y${e.y} size ${e.s}${e.rot ? ` rotated ${e.rot}°` : ''}${e.flip === 'h' ? ' mirrored' : e.flip === 'v' ? ' upside down' : ''}${e.style ? ` ${e.style}` : ''}`).join('; ')}. Answer: ${q.answers[0]}. Check the layout genuinely suggests that phrase and no other.`);
  if (q.type === 'rhyme') lines.push(`Rhyme Time: clue 1 "${q.text}" → ${q.answer1}; clue 2 "${q.text2}" → ${q.answer2}. Check each clue leads only to its answer, and that the two answers rhyme.`);
  if (q.type === 'wheel') lines.push(`Wheel of Fortune puzzle. Category: ${q.category}. Phrase: ${q.phrase}. Check the phrase is a real, correctly spelt phrase/title/name and that the category fits it.`);
  if (q.type === 'smash') lines.push(`Answer Smash. The picture shows: ${q.pictureAnswer}. The clue's answer: ${q.clueAnswer}. The smashed answer players must type: ${q.smash}. Check the clue really leads to that answer, the picture subject is right, and the two overlap as claimed.`);
  if (q.type === 'pin' && q.mode === 'area') lines.push(q.collage ? `Hit-the-right-thing on a collage of: ${q.collage.map((t, i) => (i === q.answerIndex ? '[ANSWER] ' : '') + (t.title || 'untitled')).join(', ')}. Check the marked answer is what the question asks for and no other tile also fits.` : 'Hit-the-right-thing on a custom picture; only check the question wording makes sense.');
  else if (q.type === 'pin') {
    const b = q.mapBounds || (q.media?.url?.includes('/maps/world') ? { top: 90, bottom: -90, left: -180, right: 180 } : null);
    if (b && q.pin) lines.push(`Target on a blank map of ${q.mapRegion || 'the world'}: ${q.place || 'unnamed'} at roughly latitude ${(b.top - q.pin.y * (b.top - b.bottom)).toFixed(2)}, longitude ${(b.left + q.pin.x * (b.right - b.left)).toFixed(2)}. Check that is really where the place is.`);
    else if (q.mapRegion) lines.push(`Target is “${q.place || 'unnamed'}” on a blank map of ${q.mapRegion}; check the place is in that region and the question makes sense.`);
    else lines.push('Target is a spot on a custom picture; only check the question wording makes sense.');
  }
  if (q.media?.kind === 'image') lines.push(`Has a picture${q.media.credit ? ` (${q.media.credit})` : ''}; it is on screen while the question is asked.`);
  return lines.join('\n');
}
function hashOf(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return String(h); }
/** 'ok' | 'doubt' | 'wrong' | 'stale' | null */
function checkState(q) { if (!q.check) return null; return q.check.hash === hashOf(summaryOf(q)) ? q.check.verdict : 'stale'; }

function checkRounds(roundIds) {
  const qs = S.quiz.questions.filter((q) => roundIds.includes(q.round) && !validate(q).length);
  if (!qs.length) return toast('Nothing finished to check yet.', true);
  checkQuestions(qs);
}
async function checkQuestions(qs) {
  if (!S.ai) return toast('AI isn\'t switched on for this server yet.', true);
  const m = modal(`<h3>✔ Checking with AI</h3><p class="muted">Each question is looked up independently, with web search, and marked in the list: <b style="color:var(--ok)">✓</b> looks right, <b style="color:var(--warn)">?</b> worth a look, <b style="color:var(--bad)">✗</b> looks wrong.</p>
    <div class="gen-progress"><span class="spinner"></span><span id="c_step">Starting…</span></div><div id="c_done" class="mt"></div>
    <div class="row mt" style="justify-content:flex-end"><button class="btn btn-ghost" data-x>Stop</button></div>`);
  let stop = false; $('[data-x]', m).onclick = () => { stop = true; m.remove(); };
  const BATCH = 4, tally = { ok: 0, doubt: 0, wrong: 0 };
  let done = 0;
  try {
    for (let i = 0; i < qs.length && !stop; i += BATCH) {
      const batch = qs.slice(i, i + BATCH);
      const step = $('#c_step', m); if (step) step.textContent = `Checking ${i + 1}–${Math.min(qs.length, i + BATCH)} of ${qs.length}…`;
      const r = await api('verify', { premium: !!S.quiz.settings.aiPremium, questions: batch.map((q) => ({ id: q.id, summary: summaryOf(q) })) }, { timeout: 170000 });
      LQ.addUsage(S.quiz.settings, r.usage);
      if (stop) break;
      for (const q of batch) {
        const c = r.checks[q.id];
        q.check = c ? { ...c, hash: hashOf(summaryOf(q)), at: new Date().toISOString() } : { verdict: 'doubt', note: 'The checker did not return a verdict for this one.', hash: hashOf(summaryOf(q)), at: new Date().toISOString() };
        tally[q.check.verdict]++;
      }
      done += batch.length; touch(); renderQList(); renderQForm();
      const d = $('#c_done', m); if (d) d.innerHTML = `<span style="color:var(--ok)">✓ ${tally.ok}</span> &nbsp; <span style="color:var(--warn)">? ${tally.doubt}</span> &nbsp; <span style="color:var(--bad)">✗ ${tally.wrong}</span> &nbsp; <span class="muted">of ${done}</span>`;
    }
    if (!stop) {
      const step = $('#c_step', m); if (step) step.textContent = 'Done.';
      $('.spinner', m)?.remove(); $('[data-x]', m).textContent = 'Close';
      const first = qs.find((q) => q.check?.verdict === 'wrong') || qs.find((q) => q.check?.verdict === 'doubt');
      if (first) { S.sel = S.quiz.questions.indexOf(first); renderQList(); renderQForm(); }
      save();
    }
  } catch (e) {
    const step = $('#c_step', m); if (step) step.textContent = e.message; $('.spinner', m)?.remove(); $('[data-x]', m).textContent = 'Close';
  }
}

// ------------------------------------------------------------------ AI writer
function aiModal(fresh, roundId) {
  const round = !fresh && S.quiz ? (S.quiz.rounds.find((r) => r.id === roundId) || roundOf(cur() || {}) || S.quiz.rounds[0]) : null;
  const m = modal(`<h3>✨ Write questions with AI${round ? ` <span class="muted">· Round ${roundIndex(round.id) + 1}</span>` : ''}</h3>
    ${S.ai ? '' : '<div class="error" style="margin-bottom:12px">AI isn\'t switched on for this server yet. Add an <b>ANTHROPIC_API_KEY</b> secret to the Supabase project and it will light up.</div>'}
    <div class="field"><label>${round ? 'Round name' : 'Topic or round'}</label><input type="text" id="g_topic" value="${esc(round ? round.title : '')}" placeholder="e.g. 1990s music, British geography, Christmas films, general knowledge" ${round && round.title ? '' : 'autofocus'}></div>
    <div class="field"><label>Brief for the AI <span class="muted">— optional</span></label><textarea id="g_brief" placeholder="Tell it what you want, as you'd tell a quizmaster. e.g. A sports round where every question is about Harry Kane: clubs, records, goals, England career.">${esc(round ? round.brief : '')}</textarea>${round ? '<div class="help">Saved on the round, so writing more later follows the same brief.</div>' : ''}</div>
    <div class="row"><div class="field grow"><label>How many</label><input type="number" id="g_count" value="${round ? Math.max(1, (round.count || 8) - S.quiz.questions.filter((q) => q.round === round.id).length) : 8}" min="1" max="40"></div>
      <div class="field grow"><label>Difficulty</label><select id="g_diff"><option value="mixed">Mixed</option><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option></select></div></div>
    <div class="field"><label>Question types</label><div class="row">${Object.entries(TYPES).map(([k, t]) => `<label class="check"><input type="checkbox" data-gt="${k}" ${(round?.types?.length ? round.types : ['choice', 'text']).includes(k) ? 'checked' : ''}> ${t.icon} ${esc(t.label)}</label>`).join('')}</div>
      <div class="help">Drop-the-pin questions use a world map, so they suit places. Match-up questions get pictures when the pictures box is ticked.</div></div>
    <label class="check"><input type="checkbox" id="g_pics" checked> Find pictures for the questions (from Wikipedia)</label><br>
    <label class="check" style="margin-top:8px"><input type="checkbox" id="g_web" checked> Search the web to check facts and cover recent events</label>
    <div id="g_prog" class="mt hidden"></div>
    <div class="row mt" style="justify-content:flex-end"><button class="btn btn-ghost" data-x>Cancel</button><button class="btn btn-primary" data-ok ${S.ai ? '' : 'disabled'}>Write them</button></div>`);
  $('[data-x]', m).onclick = () => m.remove();
  $('[data-ok]', m).onclick = async () => {
    const topic = $('#g_topic', m).value.trim(), brief = $('#g_brief', m).value.trim();
    const types = $$('[data-gt]', m).filter((c) => c.checked).map((c) => c.dataset.gt);
    if (!types.length) return toast('Tick at least one question type.', true);
    if (!topic && !brief) return toast('Give it a topic or a brief.', true);
    if (round) { round.title = topic || round.title; round.brief = brief; touch(); renderQList(); }
    const btn = $('[data-ok]', m); btn.disabled = true; $('[data-x]', m).disabled = true;
    const prog = $('#g_prog', m); prog.classList.remove('hidden');
    const total = LQ.clamp(+$('#g_count', m).value || 8, 1, 40), BATCH = 4;
    // "topic" is what an older server reads; "brief" is the full instruction for the current one.
    const usedPictures = S.quiz ? S.quiz.questions.flatMap((q) => [q.media?.source, q.media?.url, ...(q.pairs || []).flatMap((p) => [p.right?.source, p.right?.value])]).filter((s) => typeof s === 'string' && /^https?:/.test(s)) : [];
    const opts = { topic: (brief ? `${topic}. ${brief}` : topic).slice(0, 200), title: topic, brief, usedPictures, difficulty: $('#g_diff', m).value, types, pictures: $('#g_pics', m).checked, web: $('#g_web', m).checked };
    // Written in batches of four: one edge-function request has a time limit, and with web
    // search and pictures a big round does not fit in it. Each batch lands in the quiz as it
    // arrives, and later batches are told what's already been written so they don't repeat it.
    const steps = ['checking earlier quizzes', 'searching the web', 'writing', 'finding pictures'];
    // Seeded with what this quiz already has and with every earlier quiz, so nothing gets asked twice.
    let written = 0, si = 0, start = null; const warnings = [];
    const avoid = await avoidList();
    const status = () => { const el = $('#g_step', m); if (el) el.textContent = `Writing questions ${written + 1}–${Math.min(total, written + BATCH)} of ${total} (${steps[si]})…`; };
    prog.innerHTML = `<div class="gen-progress"><span class="spinner"></span><span id="g_step"></span></div>`; status();
    const tick = setInterval(() => { si = Math.min(si + 1, steps.length - 1); status(); }, 10000);
    try {
      while (written < total) {
        si = 0; status();
        const r = await api('generate', { ...opts, count: Math.min(BATCH, total - written), avoid, premium: !!S.quiz.settings.aiPremium }, { timeout: 170000 });
        LQ.addUsage(S.quiz.settings, r.usage);
        if (!r.questions.length) break;
        if (!r.questions.some((q) => types.includes(q.type))) { warnings.push(`The server does not know the question types you asked for yet (the quiz-api function needs redeploying); it wrote ${[...new Set(r.questions.map((q) => TYPES[q.type]?.label))].join(' and ')} instead.`); }
        let rid = round?.id;
        if (fresh && start === null) {
          const name = topic ? topic.charAt(0).toUpperCase() + topic.slice(1) : 'AI quiz';
          S.quiz = normalizeQuiz({ title: name, questions: [] }); S.quiz.rounds[0].title = name; S.quiz.rounds[0].brief = brief; renderEditor();
        }
        rid = rid || S.quiz.rounds[0].id;
        let firstId = null;
        for (const q of r.questions) {
          q.round = rid; q.time = timeFor(q.type, S.quiz.settings);
          if (q.collage && !q.media?.url) { try { await buildCollageFor(q); } catch (e) { warnings.push(`Could not build the collage for “${q.text}”: ${e.message}`); } }
          S.quiz.questions.push(q); avoid.push(q.text); firstId = firstId || q.id;
        }
        written += r.questions.length; warnings.push(...(r.warnings || []));
        touch(); if (start === null) { start = S.quiz.questions.findIndex((q) => q.id === firstId); } S.sel = start; renderQList(); renderQForm(); save();
      }
      clearInterval(tick); m.remove(); S.planner = false; renderQList(); renderQForm();
      toast(`Added ${written} question${written === 1 ? '' : 's'}. Read them through before you host — AI can be wrong.`);
      if (warnings.length) setTimeout(() => toast(warnings[0] + (warnings.length > 1 ? ` (+${warnings.length - 1} more)` : ''), true), 2800);
    } catch (e) {
      clearInterval(tick);
      prog.innerHTML = `<div class="error">${esc(e.message)}${written ? ` The ${written} question${written === 1 ? '' : 's'} written so far ${written === 1 ? 'is' : 'are'} in the quiz.` : ''}</div>`;
      btn.disabled = false; $('[data-x]', m).disabled = false;
    }
  };
}
window.addEventListener('beforeunload', (e) => { if (S.dirty) { e.preventDefault(); e.returnValue = ''; } });
</script>
