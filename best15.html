<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Best of 15 · Let's Quiz!</title>
<link rel="icon" type="image/png" sizes="64x64" href="assets/brand/icon-64.png">
<meta name="theme-color" content="#1b1544">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/hubkit.css?v=20261115b">
<style>
  .top { display: flex; align-items: center; gap: 12px; font-weight: 900; }
  .top .who { background: #fff; color: var(--ink); border-radius: 999px; padding: 4px 16px; font-size: 1.15rem; }
  .top .cat { flex: 1 1 auto; opacity: .9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top .n { background: rgba(255,255,255,.14); border-radius: 999px; padding: 4px 14px; white-space: nowrap; }
  .bar { display: flex; gap: 4px; } .bar i { flex: 1; height: 8px; border-radius: 4px; background: rgba(255,255,255,.18); } .bar i.ok { background: var(--good); } .bar i.no { background: var(--bad); } .bar i.cur { background: var(--sun); } .bar i.pass { background: #9b95c9; }
  .q { font-size: 1.75rem; font-weight: 900; line-height: 1.18; margin: 2px 0; }
  .clip { display: flex; align-items: center; gap: 12px; }
  .clip .btn { padding: 8px 16px; font-size: 1.05rem; }
  .clip .wave { flex: 1; height: 10px; border-radius: 5px; background: rgba(255,255,255,.15); overflow: hidden; } .clip .wave i { display: block; height: 100%; width: 0; background: var(--sun); }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; flex: 1 1 auto; min-height: 0; align-content: start; }
  .portrait .opts { grid-template-columns: 1fr; }
  .opt { display: flex; align-items: center; gap: 14px; text-align: left; background: #fff; color: var(--ink); border: 4px solid #fff; border-radius: 18px; padding: 10px 16px; font-weight: 900; font-size: 1.35rem; line-height: 1.1; min-height: 64px; }
  .opt .lt { flex: none; display: grid; place-items: center; width: 42px; height: 42px; border-radius: 12px; background: var(--brand); color: #fff; font-size: 1.4rem; }
  .opt:focus { outline: 5px solid var(--sun); outline-offset: 3px; transform: scale(1.02); }
  .opt.gone { opacity: .22; pointer-events: none; }
  .opt.right { background: var(--good); border-color: var(--good); color: #fff; } .opt.right .lt { background: #fff; color: var(--good); }
  .opt.wrong { background: var(--bad); border-color: var(--bad); color: #fff; } .opt.wrong .lt { background: #fff; color: var(--bad); }
  .opt[disabled] { cursor: default; }
  .help { display: flex; gap: 10px; flex-wrap: wrap; } .help .btn { flex: 1 1 0; padding: 8px 10px; font-size: .95rem; white-space: nowrap; }
  .res { border-radius: 16px; padding: 8px 18px; font-weight: 900; display: flex; align-items: center; gap: 16px; }
  .res.ok { background: var(--good); } .res.no { background: var(--bad); } .res.pass { background: #6b64a8; }
  .res b { font-size: 1.6rem; } .res span { flex: 1; font-size: 1.1rem; }
  .cats { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; align-content: start; padding: 8px 10px 10px 8px; }
  .portrait .cats { grid-template-columns: repeat(2, 1fr); }
  .cats .btn { text-align: center; font-size: 1rem; padding: 12px 8px; min-height: 58px; display: flex; align-items: center; justify-content: center; line-height: 1.1; }
  .cats .btn.surprise { background: var(--sun); color: var(--ink); border-color: var(--sun); }
  .big { font-size: 3rem; font-weight: 900; line-height: 1.05; }
  .scoreline { display: flex; gap: 16px; justify-content: center; } .scoreline .card { text-align: center; min-width: 200px; } .scoreline .card b { display: block; font-size: 3.4rem; line-height: 1; } .scoreline .card.win { background: var(--sun); color: var(--ink); border-color: var(--sun); }
  #vstat { font-size: .85rem; min-height: 1.2em; opacity: .85; text-align: center; }
  body.testmode { --stage: #0f3b3a; --stage-2: #1f6b5e; }
  .tbadge { background: #ffb020; color: #3a2400; font-weight: 900; border-radius: 999px; padding: 2px 12px; font-size: .85rem; }
</style>
</head>
<body>
<div id="stage"><div class="screen" id="screen"><div class="center" style="margin:auto">Loading…</div></div></div>
<div id="hubOver"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/common.js"></script>
<script src="assets/hubkit.js?v=20261115b"></script>
<script src="assets/dpad.js"></script>
<script src="assets/boxes-voice.js?v=20261115i"></script>
<script src="assets/hubvoice.js?v=20261115g"></script>
<script>
// Best of 15 and the Music quiz. Every question is multiple choice (A, B, C, D). Each player picks a category (the Music quiz is one mix of clips and music
// questions) and answers 15. One clue (takes two wrong options away), one swap, passes as you like, 1 point each. Then the other player. The winner takes
// a game point. Each question shown is retired in the bank. ?test=1 plays a fixed 5-question set, over and over, with nothing used up and no game point.
HUB.stage();
const { $, esc } = HUB;
const P = new URLSearchParams(location.search), MUSIC = P.get('mode') === 'music', TEST = HUB.test;
const TITLE = MUSIC ? 'Music Quiz' : 'Best of 15', ICON = MUSIC ? '🎵' : '🎯';
document.title = TITLE + (TEST ? ' (test)' : '') + " · Let's Quiz!"; if (TEST) document.body.classList.add('testmode');
const KEY = MUSIC ? 'lq_music' : 'lq_b15', LET = 'ABCD';
const call = (action, body, ms) => LQ.api(action, body, { timeout: ms || 15000 });
let R = null, CATS = null, tok = 0, busy = false, clip = null, N = 15;
const names = () => HUB.names();
const save = () => { if (TEST) return; try { localStorage.setItem(KEY, JSON.stringify({ ...R, at: Date.now() })); } catch {} };
const fresh = () => ({ phase: 'cat', turn: 0, scores: [null, null], cats: ['', ''], cur: null });
function load() { if (TEST) return null; try { const r = JSON.parse(localStorage.getItem(KEY) || 'null'); if (r && Date.now() - r.at < 4 * 3600e3 && r.phase && r.phase !== 'final') return r; } catch {} return null; }
const sayOn = () => HV.on();

// ---------------------------------------------------------------- the clip (the Music quiz plays the start of a song)
function stopClip() { if (clip) { try { clip.pause(); } catch {} clip = null; } }
function playClip(q) {
  stopClip(); if (!q.url) return Promise.resolve();
  return new Promise((res) => {
    const a = new Audio(q.url); clip = a; a.preload = 'auto'; let done = false;
    const fin = () => { if (!done) { done = true; clearTimeout(t); const b = $('#wave i'); if (b) b.style.width = '0'; res(); } };
    const t = setTimeout(() => { try { a.pause(); } catch {} fin(); }, Math.min(32, (q.len || 15) + 2) * 1000);
    a.onended = fin; a.onerror = fin;
    a.ontimeupdate = () => { const b = $('#wave i'); if (b && a.duration) b.style.width = Math.min(100, a.currentTime / a.duration * 100) + '%'; };
    a.play().catch(fin);
  });
}

// ---------------------------------------------------------------- screens
const topBar = (extra = '') => { const c = R.cur; return `<div class="top"><span class="who">${HUB.emojis()[R.turn]} ${esc(names()[R.turn])}</span><span class="cat">${TEST ? '<span class="tbadge">TEST</span> ' : ''}${ICON} ${c ? esc(c.cat) : esc(TITLE)}</span>${extra}<button class="btn small" id="menuBtn" type="button" data-say="menu|quit|leave|exit" style="padding:4px 12px;font-size:.85rem">✕ Menu</button></div>`; };
function bindMenu() { const b = $('#menuBtn'); if (b) b.onclick = () => { if (TEST) return leaveTo(); HUB.confirmBox('Leave ' + TITLE + '?', 'The round is not saved. The questions already shown stay used.', 'Yes, leave', leaveTo); }; }
function leaveTo() { stopClip(); HV.stop(); R = null; try { localStorage.removeItem(KEY); } catch {} location.href = TEST ? 'choosetest' + (HUB.mode.tv ? '?tv=1' : HUB.mode.car ? '?car=1' : '') : HUB.hubUrl(); }
const scoreStrip = () => { const s = R.scores; return `<span class="muted small">${s[0] != null ? esc(names()[0]) + ' ' + s[0] : ''}${s[0] != null && s[1] != null ? ' · ' : ''}${s[1] != null ? esc(names()[1]) + ' ' + s[1] : ''}</span>`; };

async function loadCats() { if (CATS) return CATS; try { CATS = (await call('b15_cats', {})).categories || []; } catch { CATS = []; } return CATS; }
async function screenCat() {
  tok++; const my = tok; R.phase = 'cat'; R.cur = null; save(); stopClip();
  if (MUSIC || TEST) return pick(MUSIC ? 'Music quiz' : 'Test round');
  const n = names()[R.turn];
  $('#screen').innerHTML = `<div class="top"><span class="who">${HUB.emojis()[R.turn]} ${esc(n)}</span><span class="cat">${ICON} Choose your category</span>${scoreStrip()}<button class="btn small" id="menuBtn" type="button" data-say="menu|quit|leave|exit" style="padding:4px 12px;font-size:.85rem">✕ Menu</button></div>
    <div class="cats" id="cats"><div class="center muted" style="grid-column:1/-1;padding:40px">Loading the categories…</div></div><div id="vstat"></div>`;
  bindMenu(); const cats = await loadCats(); if (my !== tok) return;
  if (!cats.length) { $('#cats').innerHTML = '<div class="center" style="grid-column:1/-1;padding:30px">The categories could not be loaded. Check the internet connection.<br><br><button class="btn primary" id="retry" type="button" data-say="try again|retry">Try again</button></div>'; $('#retry').onclick = () => { CATS = null; screenCat(); }; return; }
  $('#cats').innerHTML = `<button class="btn surprise" type="button" data-c="" data-say="surprise me|surprise|random|you choose" data-autofocus>🎲 Surprise me</button>` + cats.map((c) => `<button class="btn" type="button" data-c="${esc(c.name)}" data-say="${esc(c.name)}">${esc(c.name)}</button>`).join('');
  document.querySelectorAll('#cats [data-c]').forEach((b) => { b.onclick = () => pick(b.dataset.c || cats[Math.floor(Math.random() * cats.length)].name); });
  HUB.focusFirst();
  if (sayOn()) {
    const rnd = () => cats[Math.floor(Math.random() * cats.length)].name;
    HV.screen({ prompt: `${names()[R.turn]}, choose your category. For example ${rnd()}, ${rnd()}, or ${rnd()}. Or say surprise me.`, hint: 'Say a category, or surprise me.', dom: false,
      items: [{ words: ['surprise me', 'surprise', 'random', 'you choose'], fn: () => pick(rnd()) }, { words: ['menu', 'quit', 'leave', 'exit'], fn: () => $('#menuBtn').click() },
        { test: (alts) => matchCat(alts, cats), fn: (name) => pick(name) }] });
  }
}
function matchCat(alts, cats) {
  const STOP = new Set(['the', 'and', 'of', 'a', 'in']); let best = null, bs = 0, tie = false;
  for (const a of alts) { const ht = new Set(HV.norm(a).split(' ').filter(Boolean)); for (const c of cats) { const ct = HV.norm(c.name).split(' ').filter((x) => x && !STOP.has(x)); if (!ct.length) continue; const sc = ct.filter((x) => ht.has(x)).length / ct.length; if (sc > bs + 0.001) { bs = sc; best = c.name; tie = false; } else if (Math.abs(sc - bs) < 0.001 && sc > 0 && best !== c.name) tie = true; } }
  return bs >= 0.6 && !tie ? best : null;
}
async function pick(cat) {
  if (busy) return; busy = true; tok++; const my = tok;
  $('#screen').innerHTML = `<div class="center" style="margin:auto"><div class="big">${ICON}</div><h2 style="margin-top:10px">${esc(cat)}</h2><p class="muted">Finding your questions…</p></div>`;
  try {
    const d = TEST ? await (await fetch('tests/' + (MUSIC ? 'music' : 'best15') + '.json')).json() : await call('b15_draw', MUSIC ? { mode: 'music', n: N, spares: 6 } : { category: cat, n: N, spares: 6 }, 25000);
    N = TEST ? d.questions.length : 15;
    R.cats[R.turn] = cat; R.cur = { cat, qs: d.questions, spares: d.spares || [], i: 0, score: 0, clue: false, swap: false, marks: [], hidden: [], res: null }; R.phase = 'play'; save();
    // hands-free: have the natural voice make the questions to come while the first is being read, so there is no wait between them
    try { if (BV.on) { const c = R.cur, out = []; c.qs.forEach((q, i) => { out.push(`${q.url ? `Question ${i + 1}. ${q.t} Listen.` : `Question ${i + 1}. ${q.t} ` + readOpts(q, c) + '.'}`); if (q.url) out.push(readOpts(q, c) + '.'); out.push(`Not quite. The answer was ${LET[q.c]}: ${q.o[q.c]}.`); }); bvPrefetchMany(out); } } catch {}
    busy = false; if (my === tok) screenQ();
  } catch (e) {
    busy = false; const msg = (e && e.message) || 'Could not get the questions.';
    $('#screen').innerHTML = `<div class="center" style="margin:auto"><h2>Hmm.</h2><p class="muted">${esc(msg)}</p><button class="btn primary" id="again" type="button" data-autofocus data-say="try again|choose again|again">${MUSIC ? 'Try again' : 'Choose again'}</button></div>`; $('#again').onclick = screenCat; HUB.focusFirst();
  }
}

function retire(q) { if (!q || q.shown) return; q.shown = true; if (!TEST) call('b15_retire', { ids: [q.id] }, 8000).catch(() => {}); }
function readOpts(q, c) { return q.o.map((t, i) => (c.hidden.includes(i) ? null : `${LET[i]}: ${t}`)).filter(Boolean).join('. '); }
function screenQ() {
  tok++; const my = tok, c = R.cur, q = c.qs[c.i]; stopClip(); HV.stop(); if (!q) return finishRound();
  retire(q); save();
  const bar = `<div class="bar">${Array.from({ length: N }, (_, k) => `<i class="${k < c.i ? (c.marks[k] === 1 ? 'ok' : c.marks[k] === 2 ? 'pass' : 'no') : k === c.i ? 'cur' : ''}"></i>`).join('')}</div>`, res = c.res;
  const opts = q.o.map((t, i) => { const gone = c.hidden.includes(i); const st = res ? (i === q.c ? ' right' : i === res.pick ? ' wrong' : '') : ''; return `<button class="opt${gone ? ' gone' : ''}${st}" type="button" data-i="${i}"${res || gone ? ' disabled' : ''}${gone ? '' : ` data-say="${LET[i].toLowerCase()}"`}><span class="lt">${LET[i]}</span><span>${esc(t)}</span></button>`; }).join('');
  const clipRow = q.url ? `<div class="clip"><button class="btn" id="replay" type="button" data-say="replay|play it again|play again|hear it again|play the clip|play the song">🔊 ${c.played ? 'Play it again' : 'Play the clip'}</button><div class="wave" id="wave"><i></i></div></div>` : '';
  const verdict = res ? `<div class="res ${res.ok ? 'ok' : res.pass ? 'pass' : 'no'}"><b>${res.ok ? '✅ Correct!' : res.pass ? '⏭ Passed' : '❌ Not quite'}</b><span>${res.ok ? '' : 'The answer: ' + esc(q.o[q.c])}</span><button class="btn primary" id="next" type="button" data-autofocus data-say="next|next question|continue|carry on|go on">${c.i + 1 >= N ? 'See your score ▶' : 'Next question ▶'}</button></div>` : '';
  const help = res ? '' : `<div class="help"><button class="btn" id="hClue" type="button" data-say="clue|give me a clue|hint|fifty fifty|50 50"${c.clue ? ' disabled' : ''}>💡 Give me a clue${c.clue ? ' (used)' : ''}</button><button class="btn" id="hSwap" type="button" data-say="swap|swap the question|change the question|another question|different question"${c.swap || !c.spares.length ? ' disabled' : ''}>🔄 Swap the question${c.swap ? ' (used)' : ''}</button><button class="btn" id="hPass" type="button" data-say="pass|skip|no idea|i don't know">⏭ Pass</button></div>`;
  $('#screen').innerHTML = `${topBar(`<span class="n">${c.i + 1} of ${N}</span><span class="n">✔ ${c.score}</span>`)}${bar}${clipRow}<div class="q">${esc(q.t)}</div><div class="opts">${opts}</div>${verdict}${help}<div id="vstat"></div>`;
  bindMenu();
  const on = (id, f) => { const b = $('#' + id); if (b && !b.disabled) b.onclick = f; };
  on('next', () => { c.i++; c.res = null; c.hidden = []; c.played = false; c.heard = false; save(); screenQ(); });
  on('hClue', useClue); on('hSwap', useSwap); on('hPass', doPass);
  on('replay', () => { c.played = true; playClip(q); });
  document.querySelectorAll('.opt:not([disabled])').forEach((b) => { b.onclick = () => choose(+b.dataset.i); });
  HUB.focusFirst();
  if (!res && q.url && !c.played) { c.played = true; if (!sayOn()) playClip(q); }
  if (sayOn()) voiceQ(my);
}
function choose(i) {
  const c = R.cur, q = c.qs[c.i]; if (c.res || c.hidden.includes(i)) return; stopClip();
  const ok = i === q.c; c.marks[c.i] = ok ? 1 : 0; if (ok) c.score++; c.res = { ok, pick: i }; save(); screenQ();
}
function doPass() { const c = R.cur; if (c.res) return; stopClip(); c.marks[c.i] = 2; c.res = { pass: true, pick: -1 }; save(); screenQ(); }
function useClue() { // the 50:50: two wrong options go
  const c = R.cur, q = c.qs[c.i]; if (c.clue || c.res) return; c.clue = true;
  const wrong = q.o.map((_, i) => i).filter((i) => i !== q.c).sort(() => Math.random() - 0.5); c.hidden = wrong.slice(0, Math.max(1, q.o.length - 2));
  save(); screenQ();
}
function useSwap() { const c = R.cur; if (c.swap || c.res || !c.spares.length) return; stopClip(); c.swap = true; c.qs[c.i] = c.spares.shift(); c.hidden = []; c.played = false; c.heard = false; save(); screenQ(); }

function finishRound() {
  tok++; stopClip(); const c = R.cur; R.scores[R.turn] = c.score; R.phase = 'between'; save();
  const n = names();
  if (TEST) return screenFinal();
  if (R.turn === 0) {
    $('#screen').innerHTML = `<div class="top"><span class="who">${HUB.emojis()[0]} ${esc(n[0])}</span><span class="cat">${ICON} ${esc(c.cat)}</span></div>
      <div class="center" style="margin:auto"><p class="muted" style="margin:0">${esc(n[0])} got</p><div class="big" style="font-size:5rem">${c.score} <span style="font-size:2rem">out of ${N}</span></div><p class="sub">Now ${esc(n[1])}${MUSIC ? '' : ': choose your category'}.</p></div>
      <button class="btn primary big" id="go" type="button" data-autofocus data-say="next|continue|go|start|ready|my turn|${esc(n[1])}'s turn">${esc(n[1])}'s turn ▶</button>`;
    const go = () => { R.turn = 1; save(); screenCat(); }; $('#go').onclick = go; HUB.focusFirst();
    if (sayOn()) HV.screen({ prompt: [`${n[0]} got ${c.score} out of ${N}.`, `Now ${n[1]}.`], then: go }); // nothing to ask: on to the next player
  } else screenFinal();
}
function screenFinal() {
  tok++; stopClip(); const n = names(), s = R.scores;
  if (TEST) {
    $('#screen').innerHTML = `<div class="top"><span class="who">${ICON} ${esc(TITLE)}</span><span class="cat"><span class="tbadge">TEST</span> Finished</span></div>
      <div class="center" style="margin:auto"><p class="muted" style="margin:0">You got</p><div class="big" style="font-size:5rem">${s[0]} <span style="font-size:2rem">out of ${N}</span></div><p class="sub">Nothing was used up and no game point was given. Run it as often as you like.</p></div>
      <div class="row"><button class="btn primary big grow" id="again" type="button" data-autofocus data-say="play again|again|another go|restart">↻ Play the test again</button><button class="btn big grow" id="hub" type="button" data-say="back|test menu|menu|choose another|back to the tests">Back to the tests</button></div>`;
    $('#again').onclick = () => { R = fresh(); screenCat(); }; $('#hub').onclick = leaveTo; HUB.focusFirst();
    if (sayOn()) HV.screen({ prompt: `You got ${s[0]} out of ${N}. Say play again, or back to the tests.`, hint: 'Say play again, or back to the tests.', items: [] });
    return;
  }
  const win = s[0] === s[1] ? -1 : s[0] > s[1] ? 0 : 1;
  if (!R.awarded) { R.awarded = true; if (win >= 0) HUB.award(win, TITLE); save(); }
  const g = HUB.points();
  $('#screen').innerHTML = `<div class="top"><span class="who">${ICON} ${esc(TITLE)}</span><span class="cat">Final score</span></div>
    <div class="scoreline">${[0, 1].map((i) => `<div class="card${win === i ? ' win' : ''}"><small>${HUB.emojis()[i]} ${esc(n[i])}</small><b>${s[i]}</b><span class="small">${esc(R.cats[i] || '')}</span></div>`).join('')}</div>
    <div class="center"><div class="big" style="font-size:2.2rem">${win < 0 ? "It's a draw! No game point." : '🏆 ' + esc(n[win]) + ' wins!'}</div><p class="sub">${win < 0 ? '' : '+1 game point · '}Game points: <b>${esc(HUB.pointsText())}</b></p></div>
    <div class="row"><button class="btn primary big grow" id="again" type="button" data-autofocus data-say="another round|play again|again|another|one more">↻ Another round</button><button class="btn big grow" id="hub" type="button" data-say="choose another quiz|another quiz|different quiz|menu|home|choose">Choose another quiz</button></div>`;
  $('#again').onclick = () => { R = fresh(); save(); screenCat(); }; $('#hub').onclick = leaveTo; HUB.focusFirst();
  if (sayOn()) HV.screen({ prompt: `${s[0]} to ${s[1]}. ${win < 0 ? 'A draw. No game point.' : n[win] + ' wins and takes a game point.'} Game points: ${n[0]} ${g[0]}, ${n[1]} ${g[1]}. Say another round, or choose another quiz.`, hint: 'Say another round, or choose another quiz.', items: [] });
  try { localStorage.removeItem(KEY); } catch {}
}

// ---------------------------------------------------------------- hands-free: read the question and the options, listen for A to D (or what the option says) and for every button
async function voiceQ(my) {
  const c = R.cur, q = c.qs[c.i];
  if (c.res) { // the verdict, then on to the next question
    const r = c.res; await bvSay(r.ok ? 'Correct!' : r.pass ? `Passed. The answer was ${LET[q.c]}: ${q.o[q.c]}.` : `Not quite. The answer was ${LET[q.c]}: ${q.o[q.c]}.`); if (my !== tok) return;
    if (c.i + 1 < N) { await bvSay(`${c.score} so far.`); if (my !== tok) return; }
    const nx = $('#next'); if (my === tok && nx) nx.click(); return;
  }
  if (q.url && !c.heard) { c.heard = true; await bvSay(`Question ${c.i + 1}. ${q.t} Listen.`); if (my !== tok) return; await playClip(q); if (my !== tok) return; }
  const intro = q.url ? '' : `Question ${c.i + 1}. ${q.t} `;
  const clueNote = c.hidden.length ? 'Two are gone. ' : '';
  const prompt = `${intro}${clueNote}${readOpts(q, c)}.`;
  const nOpts = q.o.length;
  await HV.screen({ prompt, hint: 'Say A, B, C or D. Or say give me a clue, swap the question, or pass.', dom: false,
    items: [
      { test: (alts) => { for (const a of alts) { let i = HV.letterIndex(a, nOpts); if (i < 0) i = BVP.letter(a, q.o); if (i >= 0 && !c.hidden.includes(i)) return i + 1; } return false; }, fn: (k) => { choose(k - 1); } },
      { words: ['clue', 'hint', 'fifty fifty', '50 50', 'give me a clue'], fn: () => { if (c.clue) { bvSay('You have used your clue.').then(() => voiceQ(my)); return; } c.heard = true; useClue(); } },
      { words: ['swap', 'swap the question', 'change the question', 'another question', 'different question'], fn: () => { if (c.swap || !c.spares.length) { bvSay('You have used your swap.').then(() => voiceQ(my)); return; } useSwap(); } },
      { words: ['pass', 'skip', 'no idea', 'i do not know', "i don't know", 'dont know'], fn: () => { doPass(); } },
      { words: ['replay', 'play it again', 'play again', 'hear it again', 'play the clip', 'play the song'], fn: async () => { if (!q.url) return voiceQ(my); await playClip(q); voiceQ(my); } },
      { words: ['menu', 'quit', 'leave', 'exit'], fn: () => $('#menuBtn').click() },
    ] });
}

// ---------------------------------------------------------------- start
(function boot() {
  HV.button(() => { if (!R) return; ({ play: screenQ, cat: screenCat, between: finishRound }[R.phase] || screenFinal)(); });
  const r = load();
  if (r && r.phase === 'play' && r.cur) { R = r; N = R.cur.qs.length > 5 ? 15 : R.cur.qs.length; screenQ(); }
  else if (r && r.phase === 'between') { R = r; finishRound(); }
  else { R = fresh(); screenCat(); }
  addEventListener('pagehide', () => { if (R) save(); });
})();
</script>
