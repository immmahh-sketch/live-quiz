<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Host panel</title>
<link rel="icon" type="image/png" sizes="64x64" href="assets/brand/icon-64.png">
<link rel="stylesheet" href="assets/style.css">
<style>
  /* The host's own window: never shared into the call. Dark, big and plain, so the one thing that needs doing is obvious at a glance. */
  html, body { margin: 0; background: #120a0c; color: #f4e9d0; font-family: system-ui, "Segoe UI", sans-serif; min-height: 100%; }
  body.hostpanel { padding: 0; }
  .hp-top { position: sticky; top: 0; z-index: 20; background: #120a0c; padding: 10px 14px 8px; border-bottom: 1px solid rgba(244,233,208,.15); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .hp-top h1 { margin: 0; font-size: 1.05rem; letter-spacing: .06em; text-transform: uppercase; color: #e8c46a; }
  .hp-dot { width: 11px; height: 11px; border-radius: 50%; background: #777; flex: none; }
  .hp-dot.ok { background: #2fd067; } .hp-dot.bad { background: #ff5a5a; }
  .hp-status { font-size: .85rem; opacity: .8; flex: 1; min-width: 160px; }
  .hp-top button { background: rgba(244,233,208,.12); color: #f4e9d0; border: 1px solid rgba(244,233,208,.25); border-radius: 9px; padding: 5px 10px; font: inherit; font-size: .8rem; cursor: pointer; }
  #hpAlerts { position: sticky; top: 52px; z-index: 19; display: grid; gap: 10px; padding: 0 14px; }
  #hpAlerts:not(:empty) { padding-top: 12px; padding-bottom: 4px; background: #120a0c; }
  .hp-hold { background: #d90429; color: #fff; border-radius: 16px; padding: 20px 14px; text-align: center; box-shadow: 0 0 0 5px rgba(217,4,41,.35); animation: hpPulse .8s ease-in-out infinite alternate; }
  .hp-hold .big { font-size: clamp(2.6rem, 11vw, 4.6rem); font-weight: 900; letter-spacing: .04em; line-height: 1; }
  .hp-hold .sub { font-weight: 700; font-size: 1.05rem; margin-top: 8px; }
  .hp-cue { background: #0f9d3e; color: #fff; border-radius: 16px; padding: 16px 16px 18px; box-shadow: 0 0 0 5px rgba(15,157,62,.4); animation: hpPulseG 1.1s ease-in-out infinite alternate; }
  .hp-cue .kick { font: 900 .95rem/1 system-ui, sans-serif; letter-spacing: .14em; opacity: .92; }
  .hp-cue .title { font: 900 1.9rem/1.1 system-ui, sans-serif; margin: 8px 0 10px; }
  .hp-cue .say { white-space: pre-line; font: 800 1.3rem/1.38 system-ui, sans-serif; padding: 12px 14px; border-radius: 14px; background: rgba(0,0,0,.24); }
  .hp-cue button { margin-top: 12px; width: 100%; background: #fff; color: #0b6b2b; font: 900 1.3rem system-ui, sans-serif; border: 0; border-radius: 14px; padding: 14px; cursor: pointer; }
  @keyframes hpPulse { from { filter: brightness(1); } to { filter: brightness(1.25); } }
  @keyframes hpPulseG { from { filter: brightness(1); } to { filter: brightness(1.18); } }
  #hpMain { padding: 12px 14px 40px; display: grid; gap: 10px; }
  .hp-card { background: #2b1115; border-radius: 14px; padding: 12px 14px; }
  .hp-card b { font-size: 1.05rem; } .hp-card .small { opacity: .85; margin-top: 4px; font-size: .9rem; line-height: 1.5; }
  .hp-feed { background: #1b1013; border-radius: 14px; padding: 10px 12px; border: 1px solid rgba(244,233,208,.1); }
  .hp-feed ul { list-style: none; padding: 0; margin: 0; max-height: 52vh; overflow: auto; }
  .hp-feed li { padding: 6px 0; border-top: 1px solid rgba(255,255,255,.1); font-size: .95rem; } .hp-feed li:first-child { border-top: 0; font-weight: 800; }
  .hp-feed .tm { opacity: .55; font-size: .75rem; margin-right: 6px; font-variant-numeric: tabular-nums; }
  .hp-grid { display: grid; gap: 6px; }
  .hp-btn { background: rgba(244,233,208,.1); color: #f4e9d0; border: 1px solid rgba(244,233,208,.22); border-radius: 11px; padding: 10px 12px; font: inherit; font-weight: 700; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; text-align: left; }
  .hp-btn.on { background: #8a1c26; border-color: #e8c46a; }
  .hp-btn.sm { width: auto; padding: 7px 12px; font-size: .9rem; }
  .hp-btn:disabled { opacity: .45; cursor: default; }
  .hp-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .hp-muted { opacity: .7; font-size: .85rem; }
  details > summary { cursor: pointer; font-size: .9rem; opacity: .85; }
  textarea.hp-in { width: 100%; box-sizing: border-box; margin-top: 6px; font: inherit; padding: 8px; border-radius: 10px; border: 2px solid rgba(244,233,208,.25); background: #1b1013; color: #f4e9d0; }
  #hpConfirm { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.7); display: grid; place-items: center; padding: 18px; }
  #hpConfirm > div { background: #2b1115; border-radius: 16px; padding: 18px; max-width: 420px; width: 100%; }
  #hpConfirm h3 { margin: 0 0 6px; }
</style>
</head>
<body class="hostpanel">
<div class="hp-top"><span class="hp-dot" id="hpDot"></span><h1>🗡 Host panel</h1><span class="hp-status" id="hpStatus">Looking for your live game…</span><button id="hpSound" type="button" title="A short beep when a hold or a stunt comes up">🔔 Sound on</button></div>
<div id="hpAlerts"></div>
<div id="hpCtl" style="padding:10px 14px 0"></div>
<div id="hpMain"><p class="hp-muted">Looking for your live game… Start it with ▶ Host in the builder, and open the lobby.</p></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/common.js"></script>
<script src="assets/hostctl.js"></script>
<script>
/* The Traitors control panel as a window of its own (a copy of the builder's 🗡 Traitors pop-up in index.html, made for the quizmaster's
 * computer): HOLD ON, the stunt prompts from "I Literally Just Told You", the Traitor's activity and the pick/message tools.
 * It only listens to the game's own channel, sealed with the host password, and shows nothing on the shared quiz screen. */
const { $, $$, esc, api } = LQ;
const want = new URLSearchParams(location.search).get('quiz') || '';
let code = '', sbc = null, ch = null, last = null, lastAt = 0, sel2 = [], pollT = null, findT = null, detOpen = false, soundOn = true;
try { soundOn = localStorage.getItem('lq_hp_sound') !== '0'; } catch {}
const pw = () => LQ.hostPassword();

// A window of its own: a narrow one that can sit beside the quiz, if this one was opened from the builder.
try { if (window.opener && outerWidth > 900) { resizeTo(540, Math.min(screen.availHeight, 860)); } } catch {}

// ---- sound and the window title: so a hold is noticed even when the eyes are elsewhere
let ac = null;
function beep(n) { if (!soundOn) return; try { ac = ac || new AudioContext(); ac.resume(); for (let i = 0; i < n; i++) { const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = 880; g.gain.value = .18; o.connect(g); g.connect(ac.destination); o.start(ac.currentTime + i * .32); o.stop(ac.currentTime + i * .32 + .2); } } catch {} }
function setSoundBtn() { $('#hpSound').textContent = soundOn ? '🔔 Sound on' : '🔕 Sound off'; }
$('#hpSound').onclick = () => { soundOn = !soundOn; try { localStorage.setItem('lq_hp_sound', soundOn ? '1' : '0'); } catch {} setSoundBtn(); if (soundOn) beep(1); };
setSoundBtn();
let titleT = null, titleMsg = '';
function titleFlash(msg) { if (msg === titleMsg) return; titleMsg = msg; clearInterval(titleT); if (!msg) { document.title = 'Host panel'; return; } let on = false; titleT = setInterval(() => { on = !on; document.title = on ? msg : 'Host panel'; }, 700); document.title = msg; }

const t0 = (ts) => new Date(ts).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
function setStatus(txt, state) { $('#hpStatus').textContent = txt; $('#hpDot').className = 'hp-dot' + (state ? ' ' + state : ''); }
const confirmIt = (t, m, ok) => new Promise((res) => {
  const c = document.createElement('div'); c.id = 'hpConfirm'; c.innerHTML = `<div><h3>${esc(t)}</h3><p>${esc(m)}</p><div class="hp-row" style="justify-content:flex-end"><button class="hp-btn sm" data-n>Cancel</button><button class="hp-btn sm on" data-y>${esc(ok)}</button></div></div>`;
  document.body.appendChild(c); $('[data-n]', c).onclick = () => { c.remove(); res(false); }; $('[data-y]', c).onclick = () => { c.remove(); res(true); };
});
const ask = async (m = {}) => { if (!ch || !code || !pw()) return; try { await ch.send({ type: 'broadcast', event: 'trctl', payload: { m: await LQ.seal(pw(), code, { ...m, ts: Date.now() }) } }); } catch {} };

// ---- finding the live game, then listening to it
async function findGame() {
  if (!pw()) { $('#hpMain').innerHTML = `<div class="hp-card"><b>Host password needed</b><div class="small">Open the quiz builder in this app first and sign in, then reopen this window. It uses the same password.</div></div>`; setStatus('No host password on this computer', 'bad'); return; }
  let found = '';
  try { const r = await api('list'); const qs = r.quizzes || []; found = (want ? qs.find((x) => x.id === want) : qs.find((x) => x.live && x.traitors) || qs.find((x) => x.live))?.live || ''; }
  catch (e) { setStatus('Could not reach the server: ' + e.message, 'bad'); return; }
  if (found && found !== code) connect(found);
  else if (!found && code) { code = ''; setStatus('The game has ended or has not started. Waiting…', ''); }
  else if (!found && !code) setStatus('Waiting for you to open the lobby (▶ Host in the builder)…', '');
}
function connect(c) {
  try { sbc?.removeChannel(ch); } catch {}
  code = c; last = null; lastAt = 0; sbc = sbc || LQ.client();
  ch = sbc.channel('quiz-' + code, { config: { broadcast: { self: false } } });
  ch.on('broadcast', { event: 'trctlr' }, async ({ payload }) => { try { last = await LQ.unseal(pw(), code, payload.m); lastAt = Date.now(); draw(); } catch {} });
  ch.subscribe((st) => { if (st === 'SUBSCRIBED') ask({ op: 'poll' }); });
  setStatus('Connected to game ' + code + ', waiting for the host screen…', 'ok');
}
setInterval(() => { if (code) ask({ op: 'poll' }); }, 6000);
findT = setInterval(findGame, 15000); findGame();
setInterval(() => { // freshness of what is on screen
  if (!code) return;
  if (!lastAt) { setStatus('Game ' + code + ': the host screen has not answered yet. Is it on the host screen, with Traitors switched on?', 'bad'); return; }
  const age = Math.round((Date.now() - lastAt) / 1000);
  setStatus(age > 20 ? `Game ${code}: no update for ${age} s. Is the host screen still open?` : `Game ${code} · ${last?.phase || ''} · ${last?.players?.length ?? 0} players`, age > 20 ? 'bad' : 'ok');
}, 2000);

// ---- the alerts: HOLD ON and the stunt prompt, always at the top, big
let heldBefore = false, cueBefore = '';
function drawAlerts(d) {
  const box = $('#hpAlerts'); let h = '';
  if (d.hold) h += `<div class="hp-hold"><div class="big">✋ HOLD ON</div><div class="sub">The Traitor is about to do something. Do not start the next question yet. This clears the moment they send it.</div></div>`;
  if (d.cue) h += `<div class="hp-cue" data-id="${esc(d.cue.id)}"><div class="kick">DO IT NOW · ITEM ${d.cue.item}</div><div class="title">${esc(d.cue.title)}</div><div class="say">${esc(d.cue.say)}</div><button type="button" data-cdone>✓ DONE</button></div>`;
  const key = (d.hold ? 'h' : '') + '|' + (d.cue ? d.cue.id : '');
  if (box.dataset.key !== key) { box.innerHTML = h; box.dataset.key = key; const b = $('[data-cdone]', box); if (b) b.onclick = () => { ask({ op: 'cuedone', id: d.cue.id }); box.innerHTML = ''; box.dataset.key = ''; titleFlash(''); }; }
  if (d.hold && !heldBefore) beep(4);
  if (d.cue && d.cue.id !== cueBefore) beep(3);
  heldBefore = !!d.hold; cueBefore = d.cue ? d.cue.id : '';
  titleFlash(d.hold ? '✋ HOLD ON' : d.cue ? '🟢 DO IT: ' + d.cue.title : '');
}

// ---- the panel itself
function draw() {
  const d = last; if (!d) return;
  drawAlerts(d);
  LQHostCtl.render($('#hpCtl'), d, ask, confirmIt);
  const main = $('#hpMain');
  if (!d.on) { main.innerHTML = `<div class="hp-card"><b>${esc(d.note || 'Traitors mode is not on for this quiz.')}</b></div>`; return; }
  const tr = d.players.find((p) => p.pid === d.traitor), mate = d.mate ? d.players.find((p) => p.pid === d.mate) : null;
  sel2 = sel2.filter((x) => d.players.some((p) => p.pid === x && !p.bot));
  const keepText = $('#tmText', main)?.value || '', hadFocus = document.activeElement?.id === 'tmText';
  const twoBlock = `<div class="hp-card"><b>🗡 The Traitor was caught: pick the two new Traitors</b><div class="small">Tap two players. They find out who each other is, and carry on as a pair.</div>
    <div class="hp-grid" style="margin-top:8px">${d.players.filter((p) => !p.bot).map((p) => `<button class="hp-btn ${sel2.includes(p.pid) ? 'on' : ''}" data-p2="${p.pid}"><span>${esc(p.emoji || '🙂')} ${esc(p.name)}</span><small>${p.score}</small></button>`).join('') || '<p class="hp-muted">Nobody real has joined.</p>'}</div>
    <div class="hp-row" style="margin-top:8px"><button class="hp-btn sm on" data-p2go ${sel2.length === 2 ? '' : 'disabled'}>Make them the Traitors</button><button class="hp-btn sm" data-p2rand>🎲 Pick two at random</button></div></div>`;
  const pickers = `<div class="hp-row" style="margin-bottom:8px"><button class="hp-btn sm" data-rand>🎲 Pick at random</button><button class="hp-btn sm" data-ref>↻ Refresh</button></div>
    <div class="hp-grid">${d.players.slice().sort((a, b) => b.score - a.score).map((p) => `<button class="hp-btn ${p.pid === d.traitor ? 'on' : ''}" data-pick="${p.pid}"><span>${esc(p.emoji || '🙂')} ${esc(p.name)}${p.bot ? ' 🤖' : ''}</span><small>${p.score}</small></button>`).join('') || '<p class="hp-muted">Nobody has joined yet.</p>'}</div>`;
  main.innerHTML = `${d.note ? `<div class="hp-card" style="background:#43181d"><b style="color:#ff9a9a">${esc(d.note)}</b></div>` : ''}
    ${tr ? `<div class="hp-card"><b>🗡 ${esc(tr.emoji || '')} ${esc(tr.name)} is the Traitor${mate ? ` · and 🗡 ${esc(mate.emoji || '')} ${esc(mate.name)} (recruited)` : ''}</b><div class="small">This half left: 💰 ${d.stealsLeft ?? '?'} · 🎁 ${d.powers?.gift ?? '?'} · 🚫 ${d.powers?.block ?? '?'} · ✨ ${d.powers?.dbl ?? '?'} · secret bonus waiting: ${(d.hidden || 0).toLocaleString('en-GB')} · ${d.tableDone ? (d.listIn ? '📋 list in' : '📋 waiting for their list') : 'half-time vote to come'}${d.set && Object.values(d.set).some(Boolean) ? `<br>Lined up for the next question: ${[['gift', '🎁'], ['block', '🚫'], ['dbl', '✨']].filter(([k]) => d.set[k]).map(([k, ic]) => `${ic} ${esc(d.players.find((x) => x.pid === d.set[k])?.name || (d.set[k] === d.traitor ? 'themselves' : '?'))}`).join(' · ')}` : ''}</div></div>`
      : (d.needTwo ? twoBlock : `<div class="hp-card"><b>Nobody is the Traitor yet.</b><div class="small">Pick one:</div><div style="margin-top:8px">${pickers}</div></div>`)}
    ${tr ? `<div class="hp-feed"><div style="font-weight:800;margin:0 0 4px;font-size:.9rem">Everything the Traitor does <span class="hp-muted">(only you see this, live)</span></div>${d.log?.length ? `<ul>${d.log.slice().reverse().map((l) => `<li><span class="tm">${t0(l.t)}</span> ${esc(l.text)}</li>`).join('')}</ul>` : '<p class="hp-muted" style="margin:4px 0">Nothing yet. It appears here the moment they do it.</p>'}</div>` : ''}
    ${tr ? `<div class="hp-card"><b>✉ Write to the Traitor</b> <span class="hp-muted">(a letter from Claudia, only they see it)</span><textarea class="hp-in" id="tmText" rows="2" maxlength="280" placeholder="Your secret message…"></textarea><div class="hp-row" style="margin-top:6px"><button class="hp-btn sm on" data-tell="traitor">Send to ${esc(tr.name)}</button>${mate ? `<button class="hp-btn sm" data-tell="mate">Send to ${esc(mate.name)}</button><button class="hp-btn sm" data-tell="both">Both</button>` : ''}</div></div>` : ''}
    ${tr ? `<details id="hpDet" ${detOpen ? 'open' : ''}><summary>Change the Traitor</summary><div style="margin-top:8px">${pickers}</div></details>` : ''}`;
  const det = $('#hpDet', main); if (det) det.addEventListener('toggle', () => { detOpen = det.open; });
  const tx = $('#tmText', main); if (tx) { tx.value = keepText; if (hadFocus) tx.focus(); }
  $$('[data-p2]', main).forEach((b) => b.onclick = () => { const x = b.dataset.p2; sel2 = sel2.includes(x) ? sel2.filter((y) => y !== x) : [...sel2, x].slice(-2); draw(); });
  $('[data-p2go]', main)?.addEventListener('click', () => { if (sel2.length === 2) { ask({ op: 'pick2', a: sel2[0], b: sel2[1] }); sel2 = []; } });
  $('[data-p2rand]', main)?.addEventListener('click', () => { ask({ op: 'random2' }); sel2 = []; });
  $$('[data-tell]', main).forEach((b) => b.onclick = () => { const x = $('#tmText', main), text = x.value.trim(); if (!text) return; ask({ op: 'tell', text, to: b.dataset.tell }); x.value = ''; });
  $$('[data-pick]', main).forEach((b) => b.onclick = async () => {
    const p = d.players.find((x) => x.pid === b.dataset.pick); if (p.pid === d.traitor) return;
    if (!(await confirmIt(d.traitor ? `Make ${p.name} the Traitor instead?` : `Make ${p.name} the Traitor?`, d.traitor ? `${tr.name} stops being the Traitor.` : 'A secret screen goes to their phone straight away.', 'Yes, pick them'))) return;
    ask({ op: 'pick', pid: p.pid });
  });
  $('[data-rand]', main)?.addEventListener('click', async () => { if (await confirmIt('Pick a random Traitor?', d.traitor ? 'The current Traitor is replaced.' : 'A secret screen goes to their phone straight away.', 'Pick')) ask({ op: 'random' }); });
  $('[data-ref]', main)?.addEventListener('click', () => ask({ op: 'poll' }));
}
</script>
</body>
</html>
